<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Team Members</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }
    .overlay {
      background: rgba(255,255,255,0.6);
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 24px 20px;
      border-radius: 12px; max-width: 700px;
      width: 100%;
      margin: 6vh auto 24px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center; color: #007BFF;
      margin: 0 0 10px;
      font-size: clamp(18px, 5vw, 22px);
    }

    #projectContext {
      font-size: 14px; color: #555;
      text-align: center; margin-bottom: 20px;
      word-break: break-word;
    }

    input {
      display: block; width: 100%;
      margin: 8px 0; padding: 12px 14px;
      font-size: 15px; border: 1px solid #ccc;
      border-radius: 6px; -webkit-appearance: none;
    }
    input:focus {
      outline: none; border-color: #007BFF;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.2);
    }

    button {
      background: #007BFF; color: #fff;
      border: none; padding: 13px 18px;
      border-radius: 6px; cursor: pointer;
      font-size: 15px; min-height: 48px;
    }
    button:hover { background: #0056b3; }

    #addMemberBtn {
      width: 100%; margin-top: 10px;
    }

    .message { color: #cc0000; font-size: 14px; margin-top: 8px; }

    /* Member list */
    ul { list-style: none; padding: 0; margin: 20px 0 0; }
    li {
      margin: 8px 0; padding: 12px 14px;
      background: #f4f4f4; border-radius: 8px;
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px;
      flex-wrap: wrap;
    }
    .member-info { flex: 1; min-width: 0; font-size: 14px; word-break: break-word; }
    .member-info strong { display: block; margin-bottom: 2px; }

    .remove-btn {
      background: #cc0000; color: #fff;
      border: none; padding: 8px 12px;
      border-radius: 5px; cursor: pointer;
      font-size: 13px; min-height: 36px;
      white-space: nowrap; flex-shrink: 0;
    }
    .remove-btn:hover { background: #990000; }

    .actions {
      margin-top: 24px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    #saveBtn { width: 100%; max-width: 300px; }
    .back-link {
      color: #6c757d; cursor: pointer;
      font-size: 14px; padding: 8px;
      min-height: 44px; line-height: 28px;
    }
    .back-link:hover { color: #333; }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .container { padding: 18px 14px; margin-top: 4vh; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Assign Team Members</h2>
    <p id="projectContext">Loading project...</p>

    <form id="teamForm" onsubmit="addMember(event)">
      <input type="text"  id="memberName"      placeholder="Name"      required />
      <input type="email" id="memberEmail"     placeholder="Email"     required autocomplete="off" />
      <input type="text"  id="memberPosition"  placeholder="Position"  required />
      <input type="tel"   id="memberTelephone" placeholder="Telephone" />
      <button type="submit" id="addMemberBtn">Add Member</button>
      <p id="memberMessage" class="message"></p>
    </form>

    <ul id="memberList"></ul>

    <div class="actions">
      <button id="saveBtn">Save All</button>
      <span class="back-link" onclick="goBack()">&#8592; Back to Dashboard</span>
    </div>
  </div>

<script>
  function parseJwt(token) {
    try {
      const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b));
    } catch { return null; }
  }

  const token       = localStorage.getItem("authToken");
  const decoded     = parseJwt(token);
  const role        = localStorage.getItem("verifiedRole") || decoded?.role;
  const projectId   = localStorage.getItem("activeProjectId");
  const projectName = localStorage.getItem("activeProjectName");

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("projectContext").textContent = `${projectName} (ID: ${projectId})`;
  });

  function addMember(e) {
    e.preventDefault();

    let assignedPart;
    if (role.startsWith("Client"))     assignedPart = "Client";
    else if (role.startsWith("Contractor")) assignedPart = "Contractor";
    else if (role.startsWith("Consultant")) assignedPart = "Consultant";

    const memberData = {
      assigned_part: assignedPart,
      assigned_by:   decoded?.sub,
      name:          document.getElementById("memberName").value.trim(),
      email:         document.getElementById("memberEmail").value.trim(),
      position:      document.getElementById("memberPosition").value.trim(),
      telephone:     document.getElementById("memberTelephone").value.trim()
    };

    // Add to visual list
    const li = document.createElement("li");
    li.innerHTML = `
      <div class="member-info">
        <strong>${memberData.name}</strong>
        ${memberData.email} &nbsp;·&nbsp; ${memberData.assigned_part}
      </div>
    `;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Remove";
    removeBtn.className = "remove-btn";
    removeBtn.type = "button";
    removeBtn.onclick = () => li.remove();
    li.appendChild(removeBtn);
    document.getElementById("memberList").appendChild(li);

    document.getElementById("memberMessage").style.color = "#155724";
    document.getElementById("memberMessage").textContent = `${memberData.name} added.`;

    // Clear form
    document.getElementById("memberName").value = "";
    document.getElementById("memberEmail").value = "";
    document.getElementById("memberPosition").value = "";
    document.getElementById("memberTelephone").value = "";

    // Save immediately
    saveAssignment("Team Member", memberData);
  }

  async function saveAssignment(assignRole, data) {
    const response = await fetch("https://oneprojectapp-backend.onrender.com/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ projectId, assignment: { role: assignRole, ...data } })
    }).then(res => res.json());

    if (response.success) {
      sessionStorage.setItem("redirectSource", response.redirectSource);
    } else {
      document.getElementById("memberMessage").style.color = "#cc0000";
      document.getElementById("memberMessage").textContent = response.error || "Failed to assign member.";
    }
  }

  document.getElementById("saveBtn").addEventListener("click", () => {
    window.location.href = "assign-team.html";
  });

  function goBack() { window.history.back(); }
</script>
</body>
</html>
