<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2447">
  <title>Project Verification</title>
  <style>
/* OneProjectApp – shared styles for the account-creation flow */
:root{--navy:#0b2447;--blue:#1976d2;--blue-d:#135fa8;--amber:#ff9f1c;--text:#1b2733;--muted:#5b6b7c;--line:#d9e1ea;--green:#2e9e5b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;
  background:var(--navy) url('account-background.jpg') no-repeat center center/cover;background-attachment:fixed;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(8,26,56,.70),rgba(8,26,56,.45))}

.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 36px}
.topbar{width:100%;max-width:1000px;margin-bottom:22px}
.brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--amber),#ff7a00);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,159,28,.35)}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:19px;font-weight:700}.brand-name span{color:var(--amber)}

/* Card */
.card{width:100%;max-width:440px;background:#fff;border-radius:16px;border-top:5px solid var(--amber);padding:28px 30px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card.wide{max-width:860px}
.card h2{color:var(--navy);font-size:clamp(20px,4.5vw,24px);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.5}

/* Stepper */
.stepper{list-style:none;display:flex;margin-bottom:24px}
.stepper li{position:relative;flex:1;text-align:center;font-size:12px;font-weight:600;color:#8a97a6}
.stepper li span{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#e8eef5;color:#6b7a8c;font-size:13px;position:relative;z-index:1}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:#e1e8f0}
.stepper li.done{color:var(--green)}.stepper li.done span{background:var(--green);color:#fff}.stepper li.done::after{background:var(--green)}
.stepper li.active{color:var(--navy)}.stepper li.active span{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(25,118,210,.18)}

/* Callout */
.callout{background:#fff7e8;border:1px solid #ffd99a;color:#7a4b00;border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:18px;text-align:center}

/* Choice cards */
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin:12px 0;background:#fff;border:2px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--blue);background:#f4f9ff}
.choice .ico{flex:none;width:44px;height:44px;border-radius:10px;background:#eaf3fd;display:grid;place-items:center}
.choice .ico svg{width:22px;height:22px;stroke:var(--blue)}
.choice strong{display:block;color:var(--navy);font-size:15px}.choice small{color:var(--muted);font-size:13px}

/* Forms */
.field{margin:10px 0}
.field label,.file-label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:5px}
.field label i{font-style:normal;font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=file]{display:block;width:100%;padding:12px 14px;font:inherit;font-size:15px;color:var(--text);background:#fff;border:1px solid #c3cdd8;border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
input[type=file]{padding:9px 12px;cursor:pointer;font-size:14px}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,210,.18)}
.card > form > input,.card > div > input{margin:9px 0}

.section-title{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:16px;font-weight:700;margin:22px 0 4px}
.section-title::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--amber)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.party{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:6px 18px 14px}
.party .section-title{margin-top:14px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;margin-top:16px;font:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--blue);border:2px solid var(--blue);border-radius:9px;cursor:pointer;box-shadow:0 6px 16px rgba(25,118,210,.28);transition:background .2s,transform .1s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}.btn:active{transform:translateY(1px)}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--navy);box-shadow:none}
.btn-outline:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.back-link{display:block;margin:14px auto 0;font:inherit;font-size:13.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:6px}
.back-link:hover{color:var(--navy);background:#eef3f8}
.btn:focus-visible,.back-link:focus-visible,.choice:focus-visible,.code:focus-visible{outline:3px solid rgba(255,159,28,.7);outline-offset:2px}

/* Messages */
.msg-box{display:none;margin-top:14px;padding:12px 14px;border-radius:8px;font-size:13.5px;line-height:1.5}
.msg-box.error{display:block;background:#fdecec;border:1px solid #f4a3a3;color:#b71c1c;font-weight:500}
.msg-box.error a{color:var(--blue-d);text-decoration:underline;font-weight:700}
#message{color:#c62828;font-size:14px;min-height:18px;margin-top:10px;text-align:center}
.msg-box#message{text-align:left}

/* Verification page */
.card.has-progress{padding-top:0;overflow:hidden;text-align:center}
.progress{height:6px;margin:0 -30px 22px;background:#eef2f6}
#progressFill{height:100%;width:100%;background:var(--amber);transition:width 1s linear}
.profile-block{display:inline-flex;align-items:center;gap:12px;background:#f6f9fc;border:1px solid var(--line);border-radius:40px;padding:6px 18px 6px 6px;margin-bottom:18px;max-width:100%}
.profile-icon{width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--blue) center/cover;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}
.profile-block p{font-size:14px;word-break:break-all;text-align:left}
.hint-text{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px}
.otp-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.code{width:clamp(38px,11vw,50px);height:clamp(46px,13vw,56px);text-align:center;font-size:clamp(18px,5vw,22px);font-weight:600;color:var(--navy);padding:0 !important;border:1.5px solid #c3cdd8 !important;border-radius:9px !important}
#verifyMessage{margin:8px 0;font-size:14px;color:#c62828;min-height:20px;line-height:1.5}
#timer{font-size:13px;color:var(--muted)}
#resendBtn{max-width:220px;margin:14px auto 0}
.card.has-progress .btn-outline{max-width:300px;margin:14px auto 0}

/* Loading bar */
#loadingBar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--amber),var(--blue));z-index:999;transition:width 1.4s ease-in-out}

@media(max-width:760px){.grid-3,.parties{grid-template-columns:1fr}.grid-3{gap:0}}
@media(max-width:400px){.card{padding:24px 18px 20px}.progress{margin:0 -18px 20px}.otp-row{gap:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
  </style>
</head>
<body>
  <div id="loadingBar"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="home.html">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/></svg></span>
        <span class="brand-name">OneProject<span>App</span></span>
      </a>
    </header>

    <main class="card has-progress">
      <div class="progress" id="progressBar"><div id="progressFill"></div></div>
      <ol class="stepper" aria-label="Progress"><li class="done"><span>&#10003;</span>Account</li><li class="done"><span>&#10003;</span>Project</li><li class="active"><span>3</span>Verify</li></ol>
      <h2>Project Verification</h2>

      <div class="profile-block">
        <div id="profileIcon" class="profile-icon"></div>
        <p id="clientEmail"></p>
      </div>

      <p class="hint-text">We&rsquo;ve sent a 6-digit verification code to your email.<br>Enter it below. It expires in 3 minutes.</p>

      <div class="otp-row"><input id="digit1" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1"><input id="digit2" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 2"><input id="digit3" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 3"><input id="digit4" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 4"><input id="digit5" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 5"><input id="digit6" maxlength="1" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 6"></div>

      <p id="verifyMessage" role="alert"></p>
      <p id="timer"></p>

      <button id="resendBtn" class="btn" style="display:none;" onclick="resendCode()">Resend Code</button>
      <button type="button" class="btn btn-outline" onclick="window.location.href='create-project-account.html'">&#8592; Back to Account Creation</button>
    </main>

  </div>

<script>
  const BACKEND_URL = "https://oneprojectapp-backend.onrender.com";

  let countdown;
  let timeLeft = 180;
  let resendAttempts = 0;

  const progressFill  = document.getElementById("progressFill");
  const timerEl       = document.getElementById("timer");
  const verifyMessage = document.getElementById("verifyMessage");
  const resendBtn     = document.getElementById("resendBtn");
  const loadingBar    = document.getElementById("loadingBar");

  document.addEventListener("DOMContentLoaded", async () => {
    const email = localStorage.getItem("clientEmail");
    if (email) {
      document.getElementById("clientEmail").textContent = email.trim();
      try {
        const res = await fetch(`${BACKEND_URL}/client/profile-picture`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        const iconEl = document.getElementById("profileIcon");
        if (data.success && data.profile_picture) {
          iconEl.style.backgroundImage = `url("${data.profile_picture}")`;
          iconEl.textContent = "";
        } else {
          iconEl.textContent = email.charAt(0).toUpperCase();
        }
      } catch {
        document.getElementById("profileIcon").textContent = email.charAt(0).toUpperCase();
      }
    }
    sendCode();
    attachAutoVerify();
  });

  function getCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) code += document.getElementById("digit" + i).value.trim();
    return code;
  }

  function clearInputs() {
    for (let i = 1; i <= 6; i++) document.getElementById("digit" + i).value = "";
    document.getElementById("digit1").focus();
  }

  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        // Only keep digits
        input.value = input.value.replace(/\D/g, "");
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getCode().length === 6) verifyCode();
      });
      // Handle backspace to go back
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) inputs[idx - 1].focus();
      });
    });
  }

  function showLoading() { loadingBar.style.width = "100%"; }
  function resetLoading() { loadingBar.style.width = "0"; }

  async function sendCode() {
    const email = localStorage.getItem("clientEmail");
    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        timeLeft = 180;
        startCountdown();
      } else {
        verifyMessage.textContent = data.error || "Failed to send code.";
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;

    const email = localStorage.getItem("clientEmail");
    const projectDetails = JSON.parse(localStorage.getItem("projectDetails"));

    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: code })
      });
      const data = await res.json();

      if (data.success) {
        clearInterval(countdown);

        const payload = {
          clientEmail: email,
          project:     projectDetails?.project,
          contractor:  projectDetails?.contractor,
          consultant:  projectDetails?.consultant
        };

        const saveRes  = await fetch(`${BACKEND_URL}/project-save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const saveData = await saveRes.json();

        if (saveData.success) {
          localStorage.clear();
          if (saveData.accessToken && saveData.refreshToken) {
            localStorage.setItem("authToken",    saveData.accessToken);
            localStorage.setItem("refreshToken", saveData.refreshToken);
          }
          verifyMessage.style.color = "#007BFF";
          verifyMessage.textContent = "Project verified and saved successfully! Redirecting…";
          setTimeout(() => window.location.href = "dashboard.html", 1500);
        } else {
          verifyMessage.textContent = saveData.error || "Failed to save project.";
          clearInputs();
        }

      } else {
        verifyMessage.textContent = data.error || "Invalid or expired code.";
        clearInputs();
        if (resendAttempts < 2) {
          resendBtn.style.display = "block";
        } else {
          resendBtn.style.display = "none";
        }
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  async function resendCode() {
    if (resendAttempts >= 2) {
      resendBtn.style.display = "none";
      return;
    }
    resendAttempts++;
    const email = localStorage.getItem("clientEmail");
    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-resend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        verifyMessage.textContent = "New code sent! Check your email.";
        resendBtn.style.display   = "none";
        timeLeft = 180;
        startCountdown();
        clearInputs();
      } else {
        verifyMessage.textContent = data.error || "Resend failed.";
        clearInputs();
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  function startCountdown() {
    clearInterval(countdown);
    resendBtn.style.display = "none";
    countdown = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "Code expired.";
        clearInputs();
        if (resendAttempts < 2) {
          resendBtn.style.display = "block";
        } else {
          resendBtn.style.display = "none";
        }
      } else {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Expires in ${minutes}:${seconds.toString().padStart(2, "0")}`;
        progressFill.style.width = `${(timeLeft / 180) * 100}%`;
        timeLeft--;
      }
    }, 1000);
  }

  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64    = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }
</script>
</body>
</html>
