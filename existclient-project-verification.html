<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Verification</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6);
      z-index: 0;
    }

    #loadingBar {
      position: fixed; top: 0; left: 0;
      height: 4px; width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 0 28px 28px;
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
      overflow: hidden;
    }

    #progressBar {
      width: 100%; height: 6px;
      background-color: #eee;
      position: relative;
      margin-bottom: 10px;
    }
    #progressFill {
      height: 100%; width: 100%;
      background-color: #cc0000;
      transition: width 1s linear;
    }

    h2 {
      color: #007BFF;
      font-size: clamp(18px, 5vw, 24px);
      margin: 20px 0 16px;
    }

    .profile-block {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .profile-icon {
      width: 52px; height: 52px; min-width: 52px;
      border-radius: 50%;
      background-size: cover; background-position: center;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      background-color: #007BFF; color: #fff;
    }

    .profile-info p { margin: 0; font-size: 14px; word-break: break-all; }

    .hint-text {
      color: #007BFF;
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    /* OTP input row */
    .otp-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: nowrap;
    }

    .code {
      width: clamp(36px, 11vw, 48px);
      height: clamp(42px, 12vw, 52px);
      text-align: center;
      font-size: clamp(16px, 4vw, 20px);
      border: 1.5px solid #ccc;
      border-radius: 6px;
      -webkit-appearance: none;
      padding: 0;
    }
    .code:focus { outline: none; border-color: #007BFF; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }

    #verifyMessage {
      margin: 8px 0;
      font-size: 14px;
      color: #cc0000;
      min-height: 18px;
      line-height: 1.5;
    }

    #timer {
      margin-top: 6px;
      font-size: 13px;
      color: #333;
    }

    #resendBtn {
      background-color: #007BFF; color: #fff;
      border: none; padding: 12px 20px;
      border-radius: 6px; font-size: 14px;
      cursor: pointer; margin-top: 12px;
      min-height: 46px;
      width: 100%;
      max-width: 200px;
    }
    #resendBtn:hover { background-color: #0056b3; }

    .back-link-button {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 18px;
      background: #f8f9fa;
      border: 1px solid #007BFF;
      color: #007BFF;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      max-width: 260px;
      min-height: 46px;
      line-height: 22px;
    }
    .back-link-button:hover { background: #e9f2ff; }

    @media (max-width: 400px) {
      body { padding: 10px; }
      .container { padding: 0 14px 20px; border-radius: 10px; }
      .otp-row { gap: 4px; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>
  <div class="container">
    <div id="progressBar"><div id="progressFill"></div></div>
    <h2>Project Verification</h2>

    <div class="profile-block">
      <div id="profileIcon" class="profile-icon"></div>
      <div class="profile-info">
        <p id="clientEmail"></p>
      </div>
    </div>

    <p class="hint-text">
      We've sent a 6-digit verification code to your email.<br>
      Enter the code below. It will expire in 3 minutes.
    </p>

    <div class="otp-row">
      <input id="digit1" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit2" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit3" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit4" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit5" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit6" maxlength="1" class="code" type="text" inputmode="numeric">
    </div>

    <p id="verifyMessage"></p>
    <p id="timer"></p>

    <button id="resendBtn" style="display:none;" onclick="resendCode()">Resend Code</button>
    <button type="button" class="back-link-button" onclick="window.location.href='create-project-account.html'">
      &#8592; Back to Account Creation
    </button>
  </div>

<script>
  const BACKEND_URL = "https://oneprojectapp-backend.onrender.com";

  let countdown;
  let timeLeft = 180;
  let resendAttempts = 0;

  const progressFill  = document.getElementById("progressFill");
  const timerEl       = document.getElementById("timer");
  const verifyMessage = document.getElementById("verifyMessage");
  const resendBtn     = document.getElementById("resendBtn");
  const loadingBar    = document.getElementById("loadingBar");

  document.addEventListener("DOMContentLoaded", async () => {
    const email = localStorage.getItem("clientEmail");
    if (email) {
      document.getElementById("clientEmail").textContent = email.trim();
      try {
        const res = await fetch(`${BACKEND_URL}/client/profile-picture`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        const iconEl = document.getElementById("profileIcon");
        if (data.success && data.profile_picture) {
          iconEl.style.backgroundImage = `url("${data.profile_picture}")`;
          iconEl.textContent = "";
        } else {
          iconEl.textContent = email.charAt(0).toUpperCase();
        }
      } catch {
        document.getElementById("profileIcon").textContent = email.charAt(0).toUpperCase();
      }
    }
    sendCode();
    attachAutoVerify();
  });

  function getCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) code += document.getElementById("digit" + i).value.trim();
    return code;
  }

  function clearInputs() {
    for (let i = 1; i <= 6; i++) document.getElementById("digit" + i).value = "";
    document.getElementById("digit1").focus();
  }

  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        // Only keep digits
        input.value = input.value.replace(/\D/g, "");
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getCode().length === 6) verifyCode();
      });
      // Handle backspace to go back
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) inputs[idx - 1].focus();
      });
    });
  }

  function showLoading() { loadingBar.style.width = "100%"; }
  function resetLoading() { loadingBar.style.width = "0"; }

  async function sendCode() {
    const email = localStorage.getItem("clientEmail");
    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        timeLeft = 180;
        startCountdown();
      } else {
        verifyMessage.textContent = data.error || "Failed to send code.";
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;

    const email = localStorage.getItem("clientEmail");
    const projectDetails = JSON.parse(localStorage.getItem("projectDetails"));

    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: code })
      });
      const data = await res.json();

      if (data.success) {
        clearInterval(countdown);

        const payload = {
          clientEmail: email,
          project:     projectDetails?.project,
          contractor:  projectDetails?.contractor,
          consultant:  projectDetails?.consultant
        };

        const saveRes  = await fetch(`${BACKEND_URL}/project-save`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const saveData = await saveRes.json();

        if (saveData.success) {
          localStorage.clear();
          if (saveData.accessToken && saveData.refreshToken) {
            localStorage.setItem("authToken",    saveData.accessToken);
            localStorage.setItem("refreshToken", saveData.refreshToken);
          }
          verifyMessage.style.color = "#007BFF";
          verifyMessage.textContent = "Project verified and saved successfully! Redirecting…";
          setTimeout(() => window.location.href = "client-dashboard.html", 1500);
        } else {
          verifyMessage.textContent = saveData.error || "Failed to save project.";
          clearInputs();
        }

      } else {
        verifyMessage.textContent = data.error || "Invalid or expired code.";
        clearInputs();
        if (resendAttempts < 2) {
          resendBtn.style.display = "block";
        } else {
          resendBtn.style.display = "none";
        }
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  async function resendCode() {
    if (resendAttempts >= 2) {
      resendBtn.style.display = "none";
      return;
    }
    resendAttempts++;
    const email = localStorage.getItem("clientEmail");
    showLoading();
    try {
      const res = await fetch(`${BACKEND_URL}/project-resend`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        verifyMessage.textContent = "New code sent! Check your email.";
        resendBtn.style.display   = "none";
        timeLeft = 180;
        startCountdown();
        clearInputs();
      } else {
        verifyMessage.textContent = data.error || "Resend failed.";
        clearInputs();
      }
    } catch {
      verifyMessage.textContent = "Server error, please try again.";
      clearInputs();
    } finally {
      resetLoading();
    }
  }

  function startCountdown() {
    clearInterval(countdown);
    resendBtn.style.display = "none";
    countdown = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "Code expired.";
        clearInputs();
        if (resendAttempts < 2) {
          resendBtn.style.display = "block";
        } else {
          resendBtn.style.display = "none";
        }
      } else {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `Expires in ${minutes}:${seconds.toString().padStart(2, "0")}`;
        progressFill.style.width = `${(timeLeft / 180) * 100}%`;
        timeLeft--;
      }
    }, 1000);
  }

  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64    = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }
</script>
</body>
</html>
