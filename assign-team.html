<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Team</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:url('account-background.jpg') no-repeat center center fixed; background-size:cover; }
    .overlay { background:rgba(255,255,255,0.6); position:fixed; top:0; left:0; width:100%; height:100%; }
    .container { position:relative; z-index:1; background:#fff; padding:30px 40px; border-radius:12px; max-width:700px; margin:8vh auto; box-shadow:0 0 12px rgba(0,0,0,0.2); }
    h2 { text-align:center; color:#007BFF; }
    h3 { margin-top:20px; color:#333; }
    input { display:block; width:100%; margin:10px 0; padding:12px; border:1px solid #ccc; border-radius:5px; }
    button { background:#007BFF; color:#fff; border:none; padding:12px 18px; border-radius:5px; cursor:pointer; font-size:15px; }
    button:hover { background:#0056b3; }
    .actions { margin-top:20px; text-align:center; }
    .back-link { display:inline-block; margin-top:10px; color:#6c757d; cursor:pointer; }
    .back-link:hover { color:#333; }
    .message { color:#cc0000; font-size:14px; margin-top:6px; }
    ul { list-style:none; padding:0; }
    li { margin:8px 0; padding:8px; background:#f4f4f4; border-radius:5px; display:flex; justify-content:space-between; align-items:center; }
    .remove-btn { background:#cc0000; color:#fff; border:none; padding:6px 12px; border-radius:5px; cursor:pointer; font-size:14px; }
    .remove-btn:hover { background:#990000; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Assign Team</h2>
    <p id="projectContext">Loading project...</p>

    <!-- Project Manager Section -->
    <div id="pmSection" style="display:none;">
      <h3>Project Manager</h3>
      <div id="pmFormContainer">
        <form id="pmForm" onsubmit="addPM(event)">
          <input type="text" id="pmName" placeholder="Name" required />
          <input type="email" id="pmEmail" placeholder="Email" required />
          <input type="text" id="pmCompany" placeholder="Company Name" required />
          <input type="text" id="pmTitle" placeholder="Title" />
          <input type="text" id="pmPosition" placeholder="Position" required />
          <input type="text" id="pmTelephone" placeholder="Telephone" />
          <input type="text" id="pmTask" placeholder="Task" required />
          <input type="text" id="pmRepresentative" placeholder="Representative" />
          <button type="submit">Assign Project Manager</button>
          <p id="pmMessage" class="message"></p>
        </form>
      </div>
      <div id="pmAssignedMessage" style="display:none;">
        <p>A Project Manager is already assigned. To change, please 
          <a href="dashboard.html">edit information</a> and remove the current PM first.</p>
      </div>
    </div>

    <!-- Team Members Section -->
    <div id="teamSection">
      <h3>Team Members</h3>
      <form id="teamForm" onsubmit="addMember(event)">
        <input type="text" id="memberName" placeholder="Name" required />
        <input type="email" id="memberEmail" placeholder="Email" required />
        <input type="text" id="memberCompany" placeholder="Company Name" required />
        <input type="text" id="memberTitle" placeholder="Title" />
        <input type="text" id="memberPosition" placeholder="Position" required />
        <input type="text" id="memberTelephone" placeholder="Telephone" />
        <input type="text" id="memberTask" placeholder="Task" required />
        <input type="text" id="memberRepresentative" placeholder="Representative" />
        <button type="submit">Confirm</button>
        <p id="memberMessage" class="message"></p>
      </form>
      <ul id="memberList"></ul>
    </div>

    <div class="actions">
      <button id="saveBtn">Save</button>
      <span class="back-link" onclick="goBack()">&#8592; Back to Dashboard</span>
    </div>
  </div>

<script>
  const userEmail = localStorage.getItem("userEmail");
  const role = localStorage.getItem("activeRole");
  const activeProjectId = localStorage.getItem("activeProjectId");

  let projectDetails = { project: null, team_members: [] };
  const projectContextEl = document.getElementById("projectContext");

  async function loadProjectContext() {
    let endpoint = role === "Client" ? "/client/project-details"
                : role === "Contractor" ? "/contractor/project-details"
                : "/consultant/project-details";

    try {
      const res = await fetch(`https://oneprojectapp-backend.onrender.com${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: userEmail, role: role, projectId: activeProjectId })
      });
      const data = await res.json();
      projectDetails.project = data.project;
      projectContextEl.textContent = `Project: ${data.project.name} — Location: ${data.project.location}`;

      if (["Client","Contractor","Consultant"].includes(role)) {
        document.getElementById("pmSection").style.display = "block";
        const existingPM = projectDetails.team_members.find(m => m.role === "Project Manager");
        if (existingPM) {
          document.getElementById("pmFormContainer").style.display = "none";
          document.getElementById("pmAssignedMessage").style.display = "block";
        }
      }
    } catch (err) {
      console.error("Project context error:", err);
      projectContextEl.textContent = "Failed to load project context.";
    }
  }

  function addPM(e) {
    e.preventDefault();
    const pmMessage = document.getElementById("pmMessage");
    const existingPM = projectDetails.team_members.find(m => m.role === "Project Manager");
    if (existingPM) {
      pmMessage.textContent = "A Project Manager is already assigned.";
      return;
    }
    const pm = {
      name: document.getElementById("pmName").value.trim(),
      email: document.getElementById("pmEmail").value.trim().toLowerCase(),
      company_name: document.getElementById("pmCompany").value.trim(),
      title: document.getElementById("pmTitle").value.trim(),
      position: document.getElementById("pmPosition").value.trim(),
      telephone: document.getElementById("pmTelephone").value.trim(),
      task: document.getElementById("pmTask").value.trim(),
      representative: document.getElementById("pmRepresentative").value.trim(),
      role: "Project Manager"
    };
    projectDetails.team_members.push(pm);
    alert("Project Manager assigned.");
    document.getElementById("pmForm").reset();
    document.getElementById("pmFormContainer").style.display = "none";
    document.getElementById("pmAssignedMessage").style.display = "block";
  }

  function addMember(e) {
    e.preventDefault();
    const memberMessage = document.getElementById("memberMessage");
    const member = {
      name: document.getElementById("memberName").value.trim(),
      email: document.getElementById("memberEmail").value.trim().toLowerCase(),
      company_name: document.getElementById("memberCompany").value.trim(),
      title: document.getElementById("memberTitle").value.trim(),
      position: document.getElementById("memberPosition").value.trim(),
      telephone: document.getElementById("memberTelephone").value.trim(),
      task: document.getElementById("memberTask").value.trim(),
      representative: document.getElementById("memberRepresentative").value.trim(),
      role: "Team Member"
    };
    if (!member.name || !member.email || !member.position || !member.task) {
      memberMessage.textContent = "Please fill all required fields.";
      return;
    }
    projectDetails.team_members.push(member);
    renderMembers();
    document.getElementById("teamForm").reset();
    memberMessage.textContent = "";
  }

  function renderMembers() {
    const list = document.getElementById("memberList");
    list.innerHTML = "";
    projectDetails.team_members.filter(m => m.role !== "Project Manager").forEach((m, index) => {
      const li = document.createElement("li");
      li.textContent = `${m.name} - ${m.position} (${m.task})`;
      const removeBtn = document.createElement("button");
      removeBtn.textContent = "Remove";
      removeBtn.className = "remove-btn";
      removeBtn.onclick = () => removeMember(index);
      li.appendChild(removeBtn);
      list.appendChild(li);
    });
  }

  function removeMember(index) {
    projectDetails.team_members.splice(index, 1);
    renderMembers();
  }

  document.getElementById("saveBtn").addEventListener("click", () => {
    fetch("https://oneprojectapp-backend.onrender.com/assign-team", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: userEmail,
        role: role,
        projectId: projectDetails.project?.id,
        assignments: projectDetails.team_members
      })
    })
    .then(res => {
      if (res.ok) {
        alert("Assignments saved successfully.");
        localStorage.removeItem("projectDetails");
        window.location.href = redirectDashboard();
      } else {
        alert("Failed to save assignments.");
      }
    })
    .catch(err => {
      console.error("Save error:", err);
      alert("Error saving assignments.");
    });
  });

  function goBack() {
    localStorage.removeItem("projectDetails");
    window.location.href = redirectDashboard();
  }

  function redirectDashboard() {
    if (role === "Client") return "client-dashboard.html";
    else if (role === "Contractor") return "contractor-dashboard.html";
    else if (role === "Consultant") return "consultant-dashboard.html";
  }

  renderMembers();
  window.addEventListener("DOMContentLoaded", loadProjectContext);
</script>
</body>
</html>
