<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Team</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }

    .box {
      background: #fff;
      border-radius: 10px;
      padding: 24px 20px;
      max-width: 460px;
      width: 100%;
      margin: 6vh auto 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      color: #007BFF;
      text-align: center;
      margin: 0 0 16px;
      font-size: clamp(18px, 5vw, 22px);
    }

    p { margin: 8px 0; font-size: 14px; word-break: break-word; }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      -webkit-appearance: none;
    }
    input:focus { outline: none; border-color: #007BFF; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }

    button {
      width: 100%;
      margin: 8px 0;
      padding: 13px 16px;
      font-size: 15px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      min-height: 48px;
      display: block;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    .message { color: #cc0000; font-size: 13px; margin-top: 8px; text-align: center; line-height: 1.5; }

    a.back-link {
      display: block;
      margin-top: 14px;
      font-size: 14px;
      color: #007BFF;
      text-decoration: none;
      text-align: center;
      padding: 8px;
      min-height: 44px;
      line-height: 28px;
    }
    a.back-link:hover { text-decoration: underline; }

    .edit-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      background: #28a745;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
      font-size: 13px;
      min-height: 40px;
      line-height: 24px;
    }
    .edit-link:hover { background: #218838; }

    .info-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-left: 3px solid #007BFF;
    }
    .info-card p { margin: 4px 0; }

    @media (max-width: 400px) {
      .box { padding: 18px 14px; margin: 4vh auto 16px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Assign Team</h2>

    <!-- Page 1 -->
    <div id="loginPage">
      <div id="identityContainer" class="info-card">
        <p><strong>Project:</strong> <span id="projectInfo"></span></p>
        <p><strong>Role:</strong> <span id="roleInfo"></span></p>
        <p><strong>Email:</strong> <span id="emailInfo"></span></p>
      </div>

      <input type="password" id="passwordInput"
             placeholder="Enter password (min 6 chars, letters &amp; numbers)" />
      <button id="loginBtn">Continue</button>
      <p id="loginMessage" class="message"></p>
      <a href="#" class="back-link" id="backLogin">&#8592; Back</a>
    </div>

    <!-- Page 2 -->
    <div id="optionsPage" style="display:none;">
      <div id="contextContainer" class="info-card">
        <p><strong>Email:</strong> <span id="contextEmail"></span></p>
        <p><strong>Project:</strong> <span id="contextProject"></span></p>
        <p><strong>Role:</strong> <span id="contextRole"></span></p>
      </div>
      <button id="pmBtn">Assign Project Manager</button>
      <button id="teamBtn">Assign Team Members</button>
      <p id="pmMessage" class="message"></p>
      <a href="#" class="back-link" id="backOptions">&#8592; Back</a>
    </div>
  </div>

<script>
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  const token = localStorage.getItem("authToken");
  const decoded = parseJwt(token);
  const redirectSource = sessionStorage.getItem("redirectSource");

  document.addEventListener("DOMContentLoaded", () => {
    const projectId = localStorage.getItem("activeProjectId");
    const projectName = localStorage.getItem("activeProjectName");
    const email = localStorage.getItem("verifiedEmail") || decoded?.companyEmail || decoded?.email;
    const role = localStorage.getItem("verifiedRole") || decoded?.role;

    if (!projectId) {
      document.getElementById("loginMessage").textContent = "No active project selected.";
      return;
    }

    document.getElementById("projectInfo").textContent = `${projectName} (ID: ${projectId})`;
    document.getElementById("roleInfo").textContent = role;
    document.getElementById("emailInfo").textContent = email;
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = localStorage.getItem("verifiedEmail") || decoded?.companyEmail || decoded?.email;
    const role = localStorage.getItem("verifiedRole") || decoded?.role;
    const projectId = localStorage.getItem("activeProjectId");
    const password = document.getElementById("passwordInput").value;

    const validPassword = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(password);
    if (!validPassword) {
      document.getElementById("loginMessage").textContent =
        "Password must be at least 6 characters and include letters and numbers.";
      return;
    }

    const payload = role === "Client"
      ? { role, company_email: email, password }
      : { role, email, password };

    try {
      const response = await fetch("https://oneprojectapp-backend.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(res => res.json());

      if (!response.success) {
        document.getElementById("loginMessage").textContent = response.error || "Login failed.";
        return;
      }

      if (role === "Client" || role === "Contractor" || role === "Consultant") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("optionsPage").style.display = "block";
        document.getElementById("contextEmail").textContent = email;
        document.getElementById("contextProject").textContent = localStorage.getItem("activeProjectName");
        document.getElementById("contextRole").textContent = role;

        const res = await fetch("https://oneprojectapp-backend.onrender.com/assign-team", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ projectId, assignments: [] })
        }).then(r => r.json());

        if (res.hasPM) {
          const pmBtn = document.getElementById("pmBtn");
          pmBtn.disabled = true;
          pmBtn.style.display = "none";
          pmBtn.replaceWith(pmBtn.cloneNode(true));
          document.getElementById("pmMessage").innerHTML =
            'PM is already assigned. <a href="edit-information.html" class="edit-link">Click here to edit information</a>';
        }

        const teamBtn = document.getElementById("teamBtn");
        teamBtn.disabled = false;
        teamBtn.style.display = "block";

      } else if (
        role === "Client Project Manager" ||
        role === "Contractor Project Manager" ||
        role === "Consultant Project Manager"
      ) {
        window.location.href = "team-form.html";
      }
    } catch (err) {
      console.error("Login/PM check error:", err);
      document.getElementById("loginMessage").textContent = "Server error. Please try again.";
    }
  });

  document.getElementById("pmBtn").addEventListener("click", () => {
    if (!document.getElementById("pmBtn").disabled) {
      window.location.href = "pm-form.html";
    }
  });

  document.getElementById("teamBtn").addEventListener("click", () => {
    window.location.href = "team-form.html";
  });

  function redirectBack() {
    localStorage.removeItem("verifiedEmail");
    localStorage.removeItem("verifiedRole");
    const source = sessionStorage.getItem("redirectSource");
    const routes = {
      "dashboard": "dashboard.html",
      "client-dashboard": "dashboard.html",
      "contractor-dashboard": "dashboard.html",
      "consultant-dashboard": "dashboard.html",
      "client-project-manager": "dashboard.html",
      "contractor-project-manager": "dashboard.html",
      "consultant-project-manager": "dashboard.html"
    };
    window.location.href = routes[source] || "home.html";
  }

  document.getElementById("backLogin").addEventListener("click", redirectBack);
  document.getElementById("backOptions").addEventListener("click", redirectBack);
</script>
</body>
</html>
