<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Team</title>
  <style>
    body {
      margin:0;
      font-family:Arial,sans-serif;
      background:url('account-background.jpg') no-repeat center center fixed;
      background-size:cover;
    }
    .box {
      background:#fff;
      border-radius:10px;
      padding:20px;
      max-width:460px;
      margin:10vh auto;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    h2 { color:#007BFF; text-align:center; margin-bottom:15px; }
    p { margin:8px 0; }
    input, button {
      width:90%;
      margin:10px auto;
      padding:10px;
      font-size:14px;
      display:block;
    }
    button {
      background:#007BFF;
      color:#fff;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover { background:#0056b3; }
    button:disabled { background:#aaa; cursor:not-allowed; }
    .message { color:#cc0000; font-size:13px; margin-top:8px; text-align:center; }
    a.back-link { display:block; margin-top:12px; font-size:13px; color:#007BFF; text-decoration:none; text-align:center; }
    a.back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Assign Team</h2>

    <!-- Page 1 -->
    <div id="loginPage">
      <div id="identityContainer">
        <p><strong>Project:</strong> <span id="projectInfo"></span></p>
        <p><strong>Role:</strong> <span id="roleInfo"></span></p>
        <p><strong>Representative:</strong> <span id="repInfo"></span></p>
        <p><strong>Email:</strong> <span id="emailInfo"></span></p>
      </div>

      <input type="password" id="passwordInput" 
             placeholder="Enter password (min 6 chars, letters & numbers)" />
      <button id="loginBtn">Continue</button>
      <p id="loginMessage" class="message"></p>
      <a href="#" class="back-link" id="backLogin">Back</a>
    </div>

    <!-- Page 2 -->
    <div id="optionsPage" style="display:none;">
      <div id="contextContainer">
        <p><strong>Email:</strong> <span id="contextEmail"></span></p>
        <p><strong>Project:</strong> <span id="contextProject"></span></p>
        <p><strong>Role:</strong> <span id="contextRole"></span></p>
      </div>
      <button id="pmBtn">Assign Project Manager</button>
      <button id="teamBtn">Assign Team Members</button>
      <p id="pmMessage" class="message"></p>
      <a href="#" class="back-link" id="backOptions">Back</a>
    </div>
  </div>

<script>
  // Decode JWT
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  // API request helper
  async function apiRequest(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  const token = localStorage.getItem("authToken");
  const decoded = parseJwt(token);
  const email = decoded.role === "Client" ? decoded.companyEmail : decoded.email;
  const redirectSource = sessionStorage.getItem("redirectSource");

  // Populate identity rows
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const profile = await apiRequest("https://oneprojectapp-backend.onrender.com/client/profile", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` }
      });

      document.getElementById("projectInfo").textContent =
        `${ProjectContext.getName()} (ID: ${ProjectContext.getId()})`;
      document.getElementById("roleInfo").textContent = decoded.role;
      document.getElementById("repInfo").textContent = profile.representative_name || "Unknown";
      document.getElementById("emailInfo").textContent = email;
    } catch (err) {
      console.error("Profile fetch error:", err);
      document.getElementById("repInfo").textContent = "Error loading user data";
    }
  });

  // Password verification
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const password = document.getElementById("passwordInput").value;
    const validPassword = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(password);
    if (!validPassword) {
      document.getElementById("loginMessage").textContent =
        "Password must be at least 6 characters and include letters and numbers.";
      return;
    }

    const payload = decoded.role === "Client"
      ? { role: decoded.role, company_email: email, password }
      : { role: decoded.role, email, password };

    try {
      const response = await apiRequest("https://oneprojectapp-backend.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.success) {
        document.getElementById("loginMessage").textContent = response.error || "Login failed.";
        return;
      }

      // Save verified identity
      localStorage.setItem("verifiedEmail", email);
      localStorage.setItem("verifiedRole", decoded.role);
      localStorage.setItem("verifiedProjectId", ProjectContext.getId());
      localStorage.setItem("verifiedProjectName", ProjectContext.getName());
      if (response.redirectSource) {
        localStorage.setItem("redirectSource", response.redirectSource);
      }

      // Transition to Page 2
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("optionsPage").style.display = "block";
      document.getElementById("contextEmail").textContent = email;
      document.getElementById("contextProject").textContent = ProjectContext.getName();
      document.getElementById("contextRole").textContent = decoded.role;
    } catch (err) {
      console.error("Login error:", err);
      document.getElementById("loginMessage").textContent = "Server error. Please try again.";
    }
  });

  // PM button logic
  document.getElementById("pmBtn").addEventListener("click", async () => {
    let endpoint;
    if (decoded.role === "Contractor") endpoint = "/contractor-project-manager/status";
    else if (decoded.role === "Consultant") endpoint = "/consultant-project-manager/status";
    else if (decoded.role === "Client") endpoint = "/client-project-manager/status";

    try {
      const res = await apiRequest(`https://oneprojectapp-backend.onrender.com${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ projectId: ProjectContext.getId() })
      });
      if (res.hasPM) {
        document.getElementById("pmBtn").disabled = true;
        document.getElementById("pmMessage").innerHTML =
          `Project Manager already assigned. Go back to dashboard to choose edit information option 
           or <a href="edit-information.html">click here</a>.`;
      } else {
        window.location.href = "pm-form.html";
      }
    } catch (err) {
      console.error("Error checking PM:", err);
    }
  });

  // Team button
  document.getElementById("teamBtn").addEventListener("click", () => {
    window.location.href = "team-form.html";
  });

  // Back redirect
  function redirectBack() {
    localStorage.removeItem("verifiedEmail");
    localStorage.removeItem("verifiedRole");
    localStorage.removeItem("verifiedProjectId");
    localStorage.removeItem("verifiedProjectName");
    const source = localStorage.getItem("redirectSource") || redirectSource;
    switch (source) {
      case "client-dashboard": window.location.href = "client-dashboard.html"; break;
      case "consultant-dashboard": window.location.href = "consultant-dashboard.html"; break;
      case "contractor-dashboard": window.location.href = "contractor-dashboard.html"; break;
      case "consultant-project-manager": window.location.href = "consultant-project-manager.html"; break;
      case "contractor-project-manager": window.location.href = "contractor-project-manager.html"; break;
      default: window.location.href = "home.html";
    }
  }

  document.getElementById("backLogin").addEventListener("click", redirectBack);
  document.getElementById("backOptions").addEventListener("click", redirectBack);
</script>
</body>
</html>
