<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Team</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:url('account-background.jpg') no-repeat center center fixed; background-size:cover; }
    .overlay { background:rgba(255,255,255,0.6); position:fixed; top:0; left:0; width:100%; height:100%; }
    .container { position:relative; z-index:1; background:#fff; padding:30px 40px; border-radius:12px; max-width:700px; margin:8vh auto; box-shadow:0 0 12px rgba(0,0,0,0.2); }
    h2 { text-align:center; color:#007BFF; }
    button { background:#007BFF; color:#fff; border:none; padding:12px 18px; border-radius:5px; cursor:pointer; font-size:15px; margin:10px; }
    button:hover { background:#0056b3; }
    button:disabled { background:#aaa; cursor:not-allowed; }
    .message { color:#cc0000; font-size:14px; margin-top:6px; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Assign Team</h2>

    <!-- Page 1: Login -->
    <div id="loginPage">
      <p id="userEmail"></p>
      <input type="password" id="passwordInput" placeholder="Enter password" />
      <button id="loginBtn">Continue</button>
    </div>

    <!-- Page 2: Options -->
    <div id="assignOptionsPage" style="display:none; text-align:center;">
      <p id="assignHeader"></p>
      <button id="pmBtn">Assign Project Manager</button>
      <button id="teamBtn">Assign Other Team Members</button>
      <p id="pmMessage" class="message"></p>
    </div>
  </div>

<script>
  // Decode JWT
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch (e) { return null; }
  }

  const token = localStorage.getItem("authToken");
  const decoded = parseJwt(token);
  document.getElementById("userEmail").textContent = `${decoded?.email} | Role: ${decoded?.role}`;

  // Page 1 → Verify password
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const password = document.getElementById("passwordInput").value;
    try {
      const res = await fetch("/verify-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ email: decoded.email, role: decoded.role, password })
      });
      const data = await res.json();
      if (data.valid) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("assignOptionsPage").style.display = "block";
        document.getElementById("assignHeader").textContent =
          `${decoded.email} | ${ProjectContext.getName()} | Role: ${decoded.role}`;
      } else {
        alert("Invalid password");
      }
    } catch (err) {
      console.error("Password verification error:", err);
    }
  });

  // Page 2 → PM button
  document.getElementById("pmBtn").addEventListener("click", async () => {
    let endpoint;
    if (decoded.role === "Contractor") endpoint = "/contractor-project-manager/status";
    else if (decoded.role === "Consultant") endpoint = "/consultant-project-manager/status";
    else if (decoded.role === "Client") endpoint = "/client-project-manager/status";

    try {
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ projectId: ProjectContext.getId() })
      });
      const data = await res.json();
      if (data.hasPM) {
        document.getElementById("pmBtn").disabled = true;
        document.getElementById("pmMessage").innerHTML =
          `There is already a ${decoded.role} Project Manager.<br><a href="dashboard.html">Go back to dashboard to edit information.</a>`;
      } else {
        window.location.href = "pm-form.html";
      }
    } catch (err) {
      console.error("Error checking PM:", err);
    }
  });

  // Page 2 → Team button
  document.getElementById("teamBtn").addEventListener("click", () => {
    window.location.href = "team-form.html";
  });
</script>
</body>
</html>
