<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Team</title>
  <style>
    body {
      margin:0;
      font-family:Arial,sans-serif;
      background:url('account-background.jpg') no-repeat center center fixed;
      background-size:cover;
    }
    .box {
      background:#fff;
      border-radius:10px;
      padding:20px;
      max-width:440px;
      margin:10vh auto;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      text-align:center;
    }
    h2 { color:#007BFF; margin-bottom:15px; }
    input, button {
      width:85%;
      margin:10px auto;
      padding:10px;
      font-size:14px;
    }
    button {
      background:#007BFF;
      color:#fff;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover { background:#0056b3; }
    button:disabled { background:#aaa; cursor:not-allowed; }
    .message { color:#cc0000; font-size:13px; margin-top:8px; }
    a.back-link { display:block; margin-top:12px; font-size:13px; color:#007BFF; text-decoration:none; }
    a.back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Assign Team</h2>

    <!-- Page 1 -->
    <div id="loginPage">
      <div id="identityContainer">
        <p id="projectInfo"></p>
        <p id="userInfo"></p>
      </div>
      <input type="password" id="passwordInput" placeholder="Enter password (min 6 chars, letters & numbers)" />
      <button id="loginBtn">Continue</button>
      <p id="loginMessage" class="message"></p>
      <a href="#" class="back-link" id="backLogin">Back</a>
    </div>

    <!-- Page 2 -->
    <div id="optionsPage" style="display:none;">
      <p id="contextHeader"></p>
      <button id="pmBtn">Assign Project Manager</button>
      <button id="teamBtn">Assign Team Members</button>
      <p id="pmMessage" class="message"></p>
      <a href="#" class="back-link" id="backOptions">Back</a>
    </div>
  </div>

<script>
  // Decode JWT
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  // API helper
  async function apiRequest(url, options) {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  const token = localStorage.getItem("authToken");
  const decoded = parseJwt(token);
  const email = decoded.role === "Client" ? decoded.companyEmail : decoded.email;
  const redirectSource = sessionStorage.getItem("redirectSource"); // dashboard source

  // Fetch profile and project info
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const profile = await apiRequest("https://oneprojectapp-backend.onrender.com/client/profile", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` }
      });

      document.getElementById("projectInfo").textContent =
        `Project: ${ProjectContext.getName()} (ID: ${ProjectContext.getId()})`;
      document.getElementById("userInfo").textContent =
        `Role: ${decoded.role} | Name: ${profile.representative_name || "Unknown"} | Email: ${email}`;
    } catch (err) {
      console.error("Profile fetch error:", err);
      document.getElementById("userInfo").textContent = "Error loading user data.";
    }
  });

  // Password verification
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const password = document.getElementById("passwordInput").value;
    const validPassword = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(password);
    if (!validPassword) {
      document.getElementById("loginMessage").textContent =
        "Password must be at least 6 characters and include letters and numbers.";
      return;
    }

    const payload = decoded.role === "Client"
      ? { role: decoded.role, company_email: email, password }
      : { role: decoded.role, email, password };

    try {
      const response = await apiRequest("https://oneprojectapp-backend.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.success) {
        document.getElementById("loginMessage").textContent = response.error || "Login failed.";
        return;
      }

      // Save verified identity
      localStorage.setItem("verifiedEmail", email);
      localStorage.setItem("verifiedRole", decoded.role);
      localStorage.setItem("verifiedProjectId", ProjectContext.getId());
      localStorage.setItem("verifiedProjectName", ProjectContext.getName());

      // Move to Page 2
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("optionsPage").style.display = "block";
      document.getElementById("contextHeader").textContent =
        `${email} | ${ProjectContext.getName()} | Role: ${decoded.role}`;
    } catch (err) {
      console.error("Login error:", err);
      document.getElementById("loginMessage").textContent = "Server error. Please try again.";
    }
  });

  // PM button
  document.getElementById("pmBtn").addEventListener("click", async () => {
    let endpoint;
    if (decoded.role === "Contractor") endpoint = "/contractor-project-manager/status";
    else if (decoded.role === "Consultant") endpoint = "/consultant-project-manager/status";
    else if (decoded.role === "Client") endpoint = "/client-project-manager/status";

    try {
      const res = await apiRequest(`https://oneprojectapp-backend.onrender.com${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ projectId: ProjectContext.getId() })
      });
      if (res.hasPM) {
        document.getElementById("pmBtn").disabled = true;
        document.getElementById("pmMessage").innerHTML =
          `Project Manager already assigned.<br><a href="${redirectSource}.html">Go back to dashboard to edit.</a>`;
      } else {
        window.location.href = "pm-form.html";
      }
    } catch (err) {
      console.error("Error checking PM:", err);
    }
  });

  // Team button
  document.getElementById("teamBtn").addEventListener("click", () => {
    window.location.href = "team-form.html";
  });

  // Back links clear localStorage and redirect correctly
  function goBack() {
    localStorage.removeItem("verifiedEmail");
    localStorage.removeItem("verifiedRole");
    localStorage.removeItem("verifiedProjectId");
    localStorage.removeItem("verifiedProjectName");
    if (redirectSource) {
      window.location.href = `${redirectSource}.html`;
    } else {
      window.location.href = "home.html";
    }
  }

  document.getElementById("backLogin").addEventListener("click", goBack);
  document.getElementById("backOptions").addEventListener("click", goBack);
</script>
</body>
</html>
