<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Team</title>
  <style>
    body {
      margin:0;
      font-family:Arial,sans-serif;
      background:url('account-background.jpg') no-repeat center center fixed;
      background-size:cover;
    }
    .box {
      background:#fff;
      border-radius:10px;
      padding:20px;
      max-width:460px;
      margin:10vh auto;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    h2 { color:#007BFF; text-align:center; margin-bottom:15px; }
    p { margin:8px 0; }
    input, button {
      width:90%;
      margin:10px auto;
      padding:10px;
      font-size:14px;
      display:block;
    }
    button {
      background:#007BFF;
      color:#fff;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover { background:#0056b3; }
    button:disabled { background:#aaa; cursor:not-allowed; }
    .message { color:#cc0000; font-size:13px; margin-top:8px; text-align:center; }
    a.back-link { display:block; margin-top:12px; font-size:13px; color:#007BFF; text-decoration:none; text-align:center; }
    a.back-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Assign Team</h2>

    <!-- Page 1 -->
    <div id="loginPage">
      <div id="identityContainer">
        <p><strong>Project:</strong> <span id="projectInfo"></span></p>
        <p><strong>Role:</strong> <span id="roleInfo"></span></p>
        <p><strong>Representative:</strong> <span id="repInfo"></span></p>
        <p><strong>Email:</strong> <span id="emailInfo"></span></p>
      </div>

      <input type="password" id="passwordInput" 
             placeholder="Enter password (min 6 chars, letters & numbers)" />
      <button id="loginBtn">Continue</button>
      <p id="loginMessage" class="message"></p>
      <a href="#" class="back-link" id="backLogin">Back</a>
    </div>

    <!-- Page 2 -->
    <div id="optionsPage" style="display:none;">
      <div id="contextContainer">
        <p><strong>Email:</strong> <span id="contextEmail"></span></p>
        <p><strong>Project:</strong> <span id="contextProject"></span></p>
        <p><strong>Role:</strong> <span id="contextRole"></span></p>
      </div>
      <button id="pmBtn">Assign Project Manager</button>
      <button id="teamBtn">Assign Team Members</button>
      <p id="pmMessage" class="message"></p>
      <a href="#" class="back-link" id="backOptions">Back</a>
    </div>
  </div>

<script>
  // Decode JWT (optional, fallback)
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(base64));
    } catch { return null; }
  }

  const token = localStorage.getItem("authToken");
  const decoded = parseJwt(token);
  const redirectSource = sessionStorage.getItem("redirectSource"); // ✅ sessionStorage

  // Populate identity rows from localStorage
  document.addEventListener("DOMContentLoaded", () => {
    const projectId = localStorage.getItem("activeProjectId");
    const projectName = localStorage.getItem("activeProjectName");
    const email = localStorage.getItem("verifiedEmail") || (decoded?.role === "Client" ? decoded?.companyEmail : decoded?.email);
    const role = localStorage.getItem("verifiedRole") || decoded?.role;

    document.getElementById("projectInfo").textContent = `${projectName} (ID: ${projectId})`;
    document.getElementById("roleInfo").textContent = role;
    document.getElementById("repInfo").textContent = "Representative not cached";
    document.getElementById("emailInfo").textContent = email;
  });

  // Password verification + PM check
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = localStorage.getItem("verifiedEmail");
    const role = localStorage.getItem("verifiedRole");
    const projectId = localStorage.getItem("activeProjectId");
    const password = document.getElementById("passwordInput").value;

    // Password rule
    const validPassword = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(password);
    if (!validPassword) {
      document.getElementById("loginMessage").textContent =
        "Password must be at least 6 characters and include letters and numbers.";
      return;
    }

    const payload = role === "Client"
      ? { role, company_email: email, password }
      : { role, email, password };

    try {
      const response = await fetch("https://oneprojectapp-backend.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(res => res.json());

      if (!response.success) {
        document.getElementById("loginMessage").textContent = response.error || "Login failed.";
        return;
      }

      // ✅ Password verified → move to Page Two
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("optionsPage").style.display = "block";
      document.getElementById("contextEmail").textContent = email;
      document.getElementById("contextProject").textContent = localStorage.getItem("activeProjectName");
      document.getElementById("contextRole").textContent = role;

      // Immediately check PM status
      let endpoint;
      if (role === "Contractor") endpoint = "/contractor-project-manager/status";
      else if (role === "Consultant") endpoint = "/consultant-project-manager/status";
      else if (role === "Client") endpoint = "/client-project-manager/status";

      const res = await fetch(`https://oneprojectapp-backend.onrender.com${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ projectId })
      }).then(r => r.json());

      if (res.hasPM) {
        document.getElementById("pmBtn").disabled = true;
        document.getElementById("pmMessage").innerHTML =
          `Project Manager already assigned. Go back to dashboard to choose edit information option 
           or <a href="edit-information.html">click here</a>.`;
      }
    } catch (err) {
      console.error("Login/PM check error:", err);
      document.getElementById("loginMessage").textContent = "Server error. Please try again.";
    }
  });

  // PM button
  document.getElementById("pmBtn").addEventListener("click", () => {
    if (!document.getElementById("pmBtn").disabled) {
      window.location.href = "pm-form.html";
    }
  });

  // Team button
  document.getElementById("teamBtn").addEventListener("click", () => {
    window.location.href = "team-form.html";
  });

  // Back redirect (used on both pages)
  function redirectBack() {
    localStorage.removeItem("verifiedEmail");
    localStorage.removeItem("verifiedRole");

    const source = sessionStorage.getItem("redirectSource"); // ✅ sessionStorage
    switch (source) {
      case "client-dashboard": window.location.href = "client-dashboard.html"; break;
      case "consultant-dashboard": window.location.href = "consultant-dashboard.html"; break;
      case "contractor-dashboard": window.location.href = "contractor-dashboard.html"; break;
      case "consultant-project-manager": window.location.href = "consultant-project-manager.html"; break;
      case "contractor-project-manager": window.location.href = "contractor-project-manager.html"; break;
      default: window.location.href = "home.html";
    }
  }

  document.getElementById("backLogin").addEventListener("click", redirectBack);
  document.getElementById("backOptions").addEventListener("click", redirectBack);
</script>
</body>
</html>
