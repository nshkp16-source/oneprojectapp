<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Project</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100%;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #007BFF; font-size: 24px; text-align: center; }
    h3 { margin-top: 30px; color: #333; font-size: 18px; }
    .profile-block { display: flex; align-items: center; margin-bottom: 20px; }
    .profile-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background-size: cover; background-position: center;
      margin-right: 15px;
      font-size: 24px; display:flex; align-items:center; justify-content:center;
      background-color:#007BFF; color:#fff;
    }
    .profile-info p { margin: 2px 0; font-size: 15px; }
    input {
      display: block; width: 100%; margin: 10px 0;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 14px; width: 48%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
    .button-row { display:flex; justify-content:space-between; align-items:center; }
    .back-link {
      color: #007BFF; text-decoration: none; font-size: 15px;
    }
    #formMessage {
      margin-top: 10px;
      font-size: 14px;
      min-height: 22px;
      display: none;
      padding: 12px;
      border-radius: 6px;
    }
    #formMessage.error {
      display: block;
      background-color: #ffe6e6;
      border: 1px solid #ff6b6b;
      color: #cc0000;
      font-weight: 600;
    }
    #formMessage.success {
      display: block;
      background-color: #e6ffed;
      border: 1px solid #4caf50;
      color: #1f7a20;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add Project</h2>

    <!-- Client Info -->
    <div class="profile-block">
      <div id="profileIcon" class="profile-icon"></div>
      <div class="profile-info">
        <p id="clientEmail"></p>
      </div>
    </div>

    <!-- Project Form -->
    <form id="verifyProjectForm" onsubmit="handleVerifyProject(event)">

      <!-- PROJECT INFO -->
      <!-- Maps to: projects(name, location, contract_reference) -->
      <h3>Project Information</h3>
      <input type="text"  id="projectName"        placeholder="Project Name"         required />
      <input type="text"  id="projectLocation"    placeholder="Project Location"     required />
      <input type="text"  id="contractReference"  placeholder="Contract Reference"   required />

      <!-- CONTRACTOR INFO -->
      <!--
        contractors table:   email only (looked up or created by backend)
        contractor_assignments: company_name, telephone, representative, title_position, task
        NOTE: "position" field removed — schema uses single "title_position" column
      -->
      <h3>Contractor Information</h3>
      <input type="text"  id="contractorCompany"          placeholder="Contractor Company Name"           required />
      <input type="email" id="contractorEmail"            placeholder="Contractor Email"                  required />
      <input type="tel"   id="contractorTel"              placeholder="Contractor Telephone Number"       required />
      <input type="text"  id="contractorRepName"          placeholder="Contractor Representative Name"    required />
      <input type="text"  id="contractorTitlePosition"    placeholder="Contractor Position / Title"       required />
      <input type="text"  id="contractorTask"             placeholder="Contractor Task (optional)" />

      <!-- CONSULTANT INFO -->
      <!--
        consultants table:   email only (looked up or created by backend)
        consultant_assignments: company_name, telephone, representative, title_position, task
        NOTE: "position" field removed — schema uses single "title_position" column
      -->
      <h3>Consultant Information</h3>
      <input type="text"  id="consultantCompany"          placeholder="Consultant Company Name"           required />
      <input type="email" id="consultantEmail"            placeholder="Consultant Email"                  required />
      <input type="tel"   id="consultantTel"              placeholder="Consultant Telephone Number"       required />
      <input type="text"  id="consultantRepName"          placeholder="Consultant Representative Name"    required />
      <input type="text"  id="consultantTitlePosition"    placeholder="Consultant Position / Title"       required />
      <input type="text"  id="consultantTask"             placeholder="Consultant Task (optional)" />

      <div class="button-row">
        <a href="create-project-account.html" class="back-link" onclick="handleBack()">&#8592; Back</a>
        <button type="submit">Save Project</button>
      </div>
      <p id="formMessage"></p>
    </form>
  </div>

<script>
  // Show client info from localStorage
  const BACKEND_URL = "https://oneprojectapp-backend.onrender.com";

  document.addEventListener("DOMContentLoaded", async () => {
    const loggedInEmail = localStorage.getItem("clientEmail") || localStorage.getItem("userEmail");

    if (loggedInEmail) {
      try {
        const res = await fetch("https://oneprojectapp-backend.onrender.com/client/profile-picture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: loggedInEmail })
        });
        const data = await res.json();

        if (data.success && data.profile_picture) {
          document.getElementById("profileIcon").style.backgroundImage = `url("${data.profile_picture}")`;
          document.getElementById("profileIcon").textContent = "";
        } else {
          document.getElementById("profileIcon").textContent = loggedInEmail.charAt(0).toUpperCase();
        }
        document.getElementById("clientEmail").textContent = loggedInEmail.trim();
      } catch (err) {
        document.getElementById("profileIcon").textContent = loggedInEmail.charAt(0).toUpperCase();
        document.getElementById("clientEmail").textContent = loggedInEmail.trim();
      }
    }
  });

  function showFormMessage(message, type = "error") {
    const messageEl = document.getElementById("formMessage");
    messageEl.textContent = message;
    messageEl.classList.remove("error", "success");
    messageEl.classList.add(type);
  }

  async function handleVerifyProject(e) {
    e.preventDefault();
    const email = localStorage.getItem("clientEmail");
    const projectName = document.getElementById("projectName").value.trim();
    const projectLocation = document.getElementById("projectLocation").value.trim();
    const contractReference = document.getElementById("contractReference").value.trim();
    const contractorCompany = document.getElementById("contractorCompany").value.trim();
    const contractorEmail = document.getElementById("contractorEmail").value.trim().toLowerCase();
    const contractorTel = document.getElementById("contractorTel").value.trim();
    const contractorRepName = document.getElementById("contractorRepName").value.trim();
    const contractorTitlePosition = document.getElementById("contractorTitlePosition").value.trim();

    if (!email) {
      showFormMessage("Client email is missing. Please return to the previous step and sign in or create an account.");
      return;
    }

    if (!projectName || !projectLocation || !contractReference) {
      showFormMessage("Please complete all project information fields, including project name, location, and contract reference.");
      return;
    }

    if (!contractorCompany || !contractorEmail || !contractorTel || !contractorRepName || !contractorTitlePosition) {
      showFormMessage("Please complete all contractor details, including contractor company name, email, telephone, representative name, and position/title.");
      return;
    }

    const projectDetails = {
      project: {
        name:               projectName,
        location:           projectLocation,
        contract_reference: contractReference,
        created_at:         new Date().toISOString()
      },
      contractor: {
        email:          contractorEmail,
        company_name:   contractorCompany,
        telephone:      contractorTel,
        representative: contractorRepName,
        title_position: contractorTitlePosition,
        task:           document.getElementById("contractorTask")?.value.trim() || null,
        created_at:     new Date().toISOString()
      },
      consultant: {
        email:          document.getElementById("consultantEmail").value.trim().toLowerCase(),
        company_name:   document.getElementById("consultantCompany").value.trim(),
        telephone:      document.getElementById("consultantTel").value.trim(),
        representative: document.getElementById("consultantRepName").value.trim(),
        title_position: document.getElementById("consultantTitlePosition").value.trim(),
        task:           document.getElementById("consultantTask")?.value.trim() || null,
        created_at:     new Date().toISOString()
      }
    };

    // Check with backend whether project name or contract reference already exists for this client
    try {
      const checkRes = await fetch(`${BACKEND_URL}/project-check-existence`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clientEmail: email, projectName: projectName, contractReference: contractReference })
      });
      const checkData = await checkRes.json();

      if (checkRes.ok && checkData.exists) {
        // Backend reports name/reference already used for this client
        showFormMessage(checkData.message || "A project with this name or contract reference already exists for your account. Please change them and try again.");
        return;
      }
    } catch (err) {
      // If backend check fails, inform user and abort
      showFormMessage("Could not verify project uniqueness at this time. Please try again later.");
      return;
    }

    // Persist and continue with existing flow
    localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
    localStorage.setItem("clientEmail", email);

    window.location.href = "existclient-project-verification.html";
  }

  function handleBack() {
    localStorage.clear();
    window.location.href = "create-project-account.html";
  }
</script>
</body>
</html>
