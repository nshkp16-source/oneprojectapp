<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Project</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100%;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #007BFF; font-size: 24px; text-align: center; }
    h3 { margin-top: 30px; color: #333; font-size: 18px; }
    .profile-block { display: flex; align-items: center; margin-bottom: 20px; }
    .profile-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background-size: cover; background-position: center;
      margin-right: 15px;
      font-size: 24px; display:flex; align-items:center; justify-content:center;
      background-color:#007BFF; color:#fff;
    }
    .profile-info p { margin: 2px 0; font-size: 15px; }
    input {
      display: block; width: 100%; margin: 10px 0;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 14px; width: 48%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
    .button-row { display:flex; justify-content:space-between; }
    #formMessage { margin-top: 10px; color: #cc0000; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add Project</h2>

    <!-- Client Info -->
    <div class="profile-block">
      <div id="profileIcon" class="profile-icon"></div>
      <div class="profile-info">
        <p id="clientName"></p>
        <p id="clientEmail"></p>
      </div>
    </div>

    <!-- Project Form -->
    <form id="verifyProjectForm" onsubmit="handleVerifyProject(event)">
      <h3>Project Information</h3>
      <input type="text" id="projectName" placeholder="Project Name" required />
      <input type="text" id="projectLocation" placeholder="Project Location" required />
      <input type="text" id="contractReference" placeholder="Contract Reference" required />

      <h3>Contractor Information</h3>
      <input type="text" id="contractorCompany" placeholder="Contractor Company Name" required />
      <input type="email" id="contractorEmail" placeholder="Contractor Email" required />
      <input type="tel" id="contractorTel" placeholder="Contractor Telephone Number" required />
      <input type="text" id="contractorRepName" placeholder="Contractor Representative Name" required />
      <input type="text" id="contractorRepTitle" placeholder="Contractor Representative Title" required />

      <h3>Consultant Information</h3>
      <input type="text" id="consultantCompany" placeholder="Consultant Company Name" required />
      <input type="email" id="consultantEmail" placeholder="Consultant Email" required />
      <input type="tel" id="consultantTel" placeholder="Consultant Telephone Number" required />
      <input type="text" id="consultantRepName" placeholder="Consultant Representative Name" required />
      <input type="text" id="consultantRepTitle" placeholder="Consultant Representative Title" required />

      <div class="button-row">
        <a href="create-project-account.html" class="back-link">&#8592; Back</a>
        <button type="submit">Save Project</button>
      </div>
      <p id="formMessage"></p>
    </form>
  </div>

  <script>
    // Show client info from local email
    document.addEventListener("DOMContentLoaded", async () => {
      const email = localStorage.getItem("clientEmail");
      if (email) {
        try {
          const res = await fetch("/client/profile-picture", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (data.success) {
            if (data.profile_picture) {
              document.getElementById("profileIcon").style.backgroundImage = `url("${data.profile_picture}")`;
              document.getElementById("profileIcon").textContent = "";
            } else {
              document.getElementById("profileIcon").textContent = email.charAt(0).toUpperCase();
            }
            document.getElementById("clientName").textContent = data.company_name || "";
            document.getElementById("clientEmail").textContent = email;
          } else {
            document.getElementById("clientName").textContent = "Error loading profile";
          }
        } catch (err) {
          document.getElementById("clientName").textContent = "Error loading profile";
        }
      }
    });

    async function handleVerifyProject(e) {
      e.preventDefault();
      const email = localStorage.getItem("clientEmail");

      const projectDetails = {
        project: {
          name: document.getElementById("projectName").value.trim(),
          location: document.getElementById("projectLocation").value.trim(),
          contract_reference: document.getElementById("contractReference").value.trim(),
          created_at: new Date().toISOString(),
          verified: false
        },
        contractor: {
          company: document.getElementById("contractorCompany").value.trim(),
          email: document.getElementById("contractorEmail").value.trim().toLowerCase(),
          telephone: document.getElementById("contractorTel").value.trim(),
          representative: document.getElementById("contractorRepName").value.trim(),
          title: document.getElementById("contractorRepTitle").value.trim(),
          verified: false,
          created_at: new Date().toISOString()
        },
        consultant: {
          company: document.getElementById("consultantCompany").value.trim(),
          email: document.getElementById("consultantEmail").value.trim().toLowerCase(),
          telephone: document.getElementById("consultantTel").value.trim(),
          representative: document.getElementById("consultantRepName").value.trim(),
          title: document.getElementById("consultantRepTitle").value.trim(),
          verified: false,
          created_at: new Date().toISOString()
        }
      };

      // Check project reference uniqueness
      try {
        const res = await fetch("/project-check-reference", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference: projectDetails.project.contract_reference })
        });
        const data = await res.json();
        if (!data.success) {
          document.getElementById("formMessage").textContent = data.error || "Project reference already exists.";
          return; // stop here, no redirect
        }
      } catch (err) {
        document.getElementById("formMessage").textContent = "Error checking project reference.";
        return;
      }

      // Save project details locally
      localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
      // Save client email only
      localStorage.setItem("clientEmail", email);

      // Redirect to verification page
      window.location.href = "existclient-project-verification.html";
    }
  </script>
</body>
</html>
