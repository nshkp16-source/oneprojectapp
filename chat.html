<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --green:       #25d366;
            --green-dark:  #128c7e;
            --green-light: #d9fdd3;
            --green-mid:   #e8f5e9;
            --blue:        #0550ae;
            --blue-read:   #53bdeb;
            --purple:      #7c3aed;
            --amber:       #b45309;
            --teal:        #0f766e;
            --red:         #e11d48;
            --bg-chat:     #efeae2;
            --bg-white:    #ffffff;
            --bg-surface:  #f0f2f5;
            --border:      #e6e9ee;
            --text-main:   #111827;
            --text-muted:  #667781;
            --text-sub:    #5c6670;
            --shadow-sm:   0 1px 2px rgba(0,0,0,0.10);
            --shadow-md:   0 4px 16px rgba(0,0,0,0.12);
            --radius-lg:   16px;
            --radius-full: 999px;
            --sidebar-w:   340px;
            --header-h:    60px;
            --input-h:     64px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%; height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-surface);
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* ══ SIDEBAR ══ */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
            border-right: 1px solid var(--border);
            height: 100dvh;
            position: relative;
            z-index: 10;
        }
        .sidebar-header {
            height: var(--header-h);
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 10px;
        }
        .sidebar-title-group { min-width: 0; flex: 1; }
        .sidebar-title { font-size: 17px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .sidebar-sub   { font-size: 11.5px; color: var(--text-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: transparent;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .icon-btn:hover  { background: var(--bg-surface); }
        .icon-btn:active { background: var(--border); }

        .search-wrap {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .search-input {
            width: 100%;
            padding: 8px 14px;
            border: none;
            border-radius: var(--radius-full);
            background: var(--bg-surface);
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { background: #e8ebef; }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }

        /* Contact row */
        .contact-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
            min-width: 0;
            position: relative;
        }
        .contact-item:hover  { background: #f5f8ff; }
        .contact-item.active { background: #e8f2ff; }
        /* Unread: highlighted green tint */
        .contact-item.unread {
            background: #f0fff6;
        }
        .contact-item.unread .contact-name { font-weight: 700; }
        .contact-item.unread .contact-msg  { color: var(--text-main); font-weight: 500; }
        .contact-item.unread .contact-time { color: var(--green-dark); font-weight: 600; }

        .contact-info { flex: 1; min-width: 0; }
        .contact-row  { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 2px; }
        .contact-name { font-size: 13.5px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
        .contact-msg  { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Unread badge */
        .unread-badge {
            min-width: 20px; height: 20px;
            border-radius: var(--radius-full);
            background: var(--green);
            color: #fff; font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(37,211,102,0.4);
        }

        /* Avatars */
        .avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 16px;
            flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .avatar.online::after {
            content: '';
            position: absolute; width: 11px; height: 11px;
            background: #31a24c;
            border: 2px solid var(--bg-white);
            border-radius: 50%;
            bottom: 1px; right: 1px;
        }
        .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
        .avatar.lg { width: 42px; height: 42px; font-size: 15px; }

        /* ══ CHAT AREA ══ */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100dvh;
            background: var(--bg-white);
            position: relative;
        }

        .chat-header {
            height: var(--header-h);
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-white);
            flex-shrink: 0;
            z-index: 5;
        }
        .mobile-back-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            color: var(--green-dark);
            padding: 4px 2px;
            flex-shrink: 0;
            line-height: 1;
        }
        .chat-header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .chat-name   { font-size: 15px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-status { font-size: 11.5px; color: var(--text-sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .current-user-chip {
            background: var(--bg-surface);
            border-radius: var(--radius-full);
            padding: 3px 10px;
            font-size: 11.5px;
            color: #444;
            white-space: nowrap;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--bg-chat);
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .date-sep {
            display: flex;
            justify-content: center;
            margin: 8px 0 4px;
        }
        .date-sep span {
            background: #d1f4cc;
            border: 1px solid #c5e8bb;
            border-radius: var(--radius-full);
            padding: 3px 12px;
            font-size: 11.5px;
            font-weight: 500;
            color: #3a5e3e;
            box-shadow: var(--shadow-sm);
        }

        .message {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: 1px;
            animation: msgIn 0.15s ease-out;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(4px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message.sent     { justify-content: flex-end; }
        .message.received { justify-content: flex-start; }

        .msg-avatar-slot { width: 30px; flex-shrink: 0; display: flex; align-items: flex-end; }

        .message-bubble {
            max-width: 72%;
            padding: 7px 11px 5px;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.45;
            position: relative;
            cursor: pointer;
        }
        .message.received .message-bubble {
            background: var(--bg-white);
            color: var(--text-main);
            border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .message.received .message-bubble::before {
            content: ''; position: absolute; left: -6px; top: 0;
            border-top: 7px solid rgba(0,0,0,0.08);
            border-left: 7px solid transparent;
        }
        .message.received .message-bubble::after {
            content: ''; position: absolute; left: -5px; top: 0;
            border-top: 6px solid var(--bg-white);
            border-left: 6px solid transparent;
        }
        .message.sent .message-bubble {
            background: var(--green-light);
            color: var(--text-main);
            border-radius: var(--radius-lg) 0 var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .message.sent .message-bubble::before {
            content: ''; position: absolute; right: -6px; top: 0;
            border-top: 7px solid rgba(0,0,0,0.08);
            border-right: 7px solid transparent;
        }
        .message.sent .message-bubble::after {
            content: ''; position: absolute; right: -5px; top: 0;
            border-top: 6px solid var(--green-light);
            border-right: 6px solid transparent;
        }
        .message.received.consecutive .message-bubble { border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg); }
        .message.received.consecutive .message-bubble::before,
        .message.received.consecutive .message-bubble::after { display: none; }
        .message.sent.consecutive .message-bubble { border-radius: var(--radius-lg) 4px var(--radius-lg) var(--radius-lg); }
        .message.sent.consecutive .message-bubble::before,
        .message.sent.consecutive .message-bubble::after { display: none; }

        .sender-label { font-size: 11px; font-weight: 700; margin-bottom: 3px; }
        .role-contractor   { color: var(--blue); }
        .role-contractorpm { color: #1d6ed8; }
        .role-consultant   { color: var(--purple); }
        .role-consultantpm { color: #9333ea; }
        .role-client       { color: var(--amber); }
        .role-clientpm     { color: #d97706; }
        .role-teammember   { color: var(--teal); }
        .role-default      { color: var(--green-dark); }

        .reply-block {
            background: rgba(0,0,0,0.06);
            border-left: 3px solid var(--green);
            border-radius: 6px;
            padding: 4px 8px;
            margin-bottom: 5px;
        }
        .message.sent .reply-block { background: rgba(0,0,0,0.07); }
        .reply-block-name { font-size: 11px; font-weight: 700; color: var(--green-dark); margin-bottom: 2px; }
        .reply-block-text { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }

        /* Attachments */
        .msg-image {
            display: block; max-width: 240px; max-height: 240px;
            margin-top: 5px; border-radius: 10px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.07);
        }
        /* ── Video player ── */
        .msg-video {
            display: block;
            max-width: 280px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.07);
            background: #000;
            outline: none;
        }
        /* ── Audio player ── */
        .msg-audio-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            background: rgba(0,0,0,0.05);
            border-radius: 22px;
            padding: 6px 10px;
            min-width: 200px;
            max-width: 280px;
        }
        .msg-audio-play {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: var(--green-dark);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #fff;
            flex-shrink: 0;
            transition: background 0.12s;
        }
        .msg-audio-play:hover { background: var(--green); }
        .msg-audio-progress {
            flex: 1;
            height: 3px;
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }
        .msg-audio-bar {
            height: 100%;
            width: 0%;
            background: var(--green-dark);
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        .msg-audio-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; min-width: 30px; text-align: right; }
        .msg-audio-waveform {
            display: flex; align-items: center; gap: 1.5px;
            flex: 1; height: 24px;
        }
        .msg-audio-waveform span {
            display: inline-block;
            width: 2px;
            background: var(--green-dark);
            border-radius: 2px;
            opacity: 0.6;
        }
        .msg-file {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 5px; font-size: 13px; color: var(--green-dark);
            background: rgba(0,0,0,0.04); border-radius: 8px;
            padding: 5px 10px; text-decoration: none;
        }
        .msg-file:hover { background: rgba(0,0,0,0.08); }

        /* ── Ticks: double-tick turns blue when read ── */
        .msg-footer {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 3px; margin-top: 3px;
        }
        .msg-time  { font-size: 10.5px; color: var(--text-muted); }
        .msg-ticks { font-size: 12px; color: var(--text-muted); line-height: 1; }
        .msg-ticks.read { color: var(--blue-read); }  /* blue ✓✓ */

        /* State boxes */
        .state-box {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10px; color: var(--text-muted); font-size: 14px;
            text-align: center; padding: 40px;
        }
        .state-icon { font-size: 44px; opacity: 0.55; }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Typing */
        .typing-row { display: flex; align-items: flex-end; gap: 4px; margin-bottom: 4px; }
        .typing-bubble {
            background: var(--bg-white);
            border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg);
            padding: 10px 14px;
            display: flex; gap: 4px; align-items: center;
            box-shadow: var(--shadow-sm);
        }
        .dot { width: 6px; height: 6px; background: #8696a0; border-radius: 50%; animation: bounce 1.2s infinite; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

        /* ══ REPLY BAR ══ */
        .reply-bar {
            display: none;
            align-items: center;
            padding: 8px 14px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            gap: 10px;
            flex-shrink: 0;
        }
        .reply-bar.visible { display: flex; }
        .reply-bar-body { flex: 1; min-width: 0; border-left: 3px solid var(--green); padding-left: 8px; }
        .reply-bar-name { font-size: 12px; font-weight: 600; color: var(--green-dark); }
        .reply-bar-text { font-size: 12.5px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-bar-close {
            background: none; border: none; cursor: pointer;
            font-size: 18px; color: var(--text-muted);
            padding: 2px 6px; border-radius: 50%;
            transition: background 0.12s; flex-shrink: 0;
        }
        .reply-bar-close:hover { background: var(--border); color: var(--text-main); }

        /* ══ INPUT AREA ══ */
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            padding-bottom: calc(8px + var(--safe-bottom));
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            position: relative;
        }
        .input-pill {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-white);
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            padding: 7px 12px;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }
        .input-icon {
            background: none; border: none; cursor: pointer;
            font-size: 20px; color: #8696a0; padding: 0;
            display: flex; align-items: center;
            flex-shrink: 0;
            transition: color 0.12s;
        }
        .input-icon:hover { color: #444; }
        .msg-input {
            flex: 1; border: none; background: none; outline: none;
            font-size: 14px; color: var(--text-main); font-family: inherit;
            resize: none; max-height: 96px; overflow-y: auto; line-height: 1.4;
        }
        .msg-input::placeholder { color: #8696a0; }

        .attach-pill {
            display: none;
            align-items: center;
            gap: 5px;
            background: var(--green-mid);
            border-radius: var(--radius-full);
            padding: 2px 8px 2px 6px;
            font-size: 12px;
            color: var(--green-dark);
            max-width: 130px;
        }
        .attach-pill.visible { display: flex; }
        .attach-pill-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .attach-pill-rm { background: none; border: none; cursor: pointer; color: var(--green-dark); font-size: 14px; padding: 0; line-height: 1; }

        /* Send / mic button */
        .send-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--green);
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(37,211,102,0.4);
            transition: transform 0.12s, background 0.12s;
            user-select: none;
        }
        .send-btn:hover  { background: #1ebe5d; transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .send-btn.recording {
            background: var(--red);
            animation: pulse-rec 1s ease-in-out infinite;
        }
        @keyframes pulse-rec { 0%,100%{box-shadow:0 2px 8px rgba(225,29,72,0.5)} 50%{box-shadow:0 2px 18px rgba(225,29,72,0.8)} }

        /* Recording indicator bar */
        .rec-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #fff0f3;
            border-top: 1px solid #fecdd3;
            flex-shrink: 0;
            animation: fadeIn 0.2s ease;
        }
        .rec-bar.visible { display: flex; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s ease infinite; flex-shrink:0; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
        .rec-wave {
            display: flex; align-items: center; gap: 2px; flex: 1; height: 22px;
        }
        .rec-wave span {
            display: inline-block; width: 3px; border-radius: 3px;
            background: var(--red); opacity: 0.7;
            animation: wave 0.8s ease-in-out infinite;
        }
        .rec-wave span:nth-child(1){animation-delay:.0s;height:8px}
        .rec-wave span:nth-child(2){animation-delay:.1s;height:14px}
        .rec-wave span:nth-child(3){animation-delay:.2s;height:18px}
        .rec-wave span:nth-child(4){animation-delay:.3s;height:12px}
        .rec-wave span:nth-child(5){animation-delay:.4s;height:16px}
        .rec-wave span:nth-child(6){animation-delay:.3s;height:10px}
        .rec-wave span:nth-child(7){animation-delay:.2s;height:14px}
        @keyframes wave {
            0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.3)}
        }
        .rec-timer { font-size: 12px; color: var(--red); font-weight: 600; min-width: 36px; text-align: right; }
        .rec-cancel { background: none; border: none; cursor: pointer; font-size: 12px; color: var(--text-muted); padding: 2px 6px; border-radius: var(--radius-full); }
        .rec-cancel:hover { background: var(--border); }

        /* Emoji picker */
        #emojiPicker {
            display: none;
            position: absolute;
            bottom: calc(100% + 6px); left: 10px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 10px;
            box-shadow: var(--shadow-md);
            z-index: 100;
            width: 290px;
        }
        #emojiPicker.open { display: block; }
        .ep-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        #emojiGrid { display: flex; flex-wrap: wrap; gap: 2px; }
        #emojiGrid span { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; transition: background 0.1s; line-height: 1; }
        #emojiGrid span:hover { background: var(--bg-surface); }

        /* Scrollbars */
        .contacts-list::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar { width: 3px; }
        .contacts-list::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        /* ══ MOBILE ══ */
        @media (max-width: 767px) {
            :root { --sidebar-w: 100vw; }
            .app { display: block; position: relative; }

<body>

<script>
(function () {
'use strict';

/* ── CONFIG ── */
const API_BASE = window.BACKEND_URL || 'https://oneprojectapp-backend.onrender.com';
const POLL_MS  = 5000;
const EMOJIS   = ['😊','😄','😂','😍','🙏','👍','👎','🔥','✅','❌','⚠️','📌',
                   '📎','📁','📋','💡','🎯','🚀','⏳','✔️','👏','💪','🤝','📞',
                   '📧','🏗️','🗂️','📊','📈','📉','⭐','🔔','💬','🖊️','📝','🧾'];

/* ── JWT ── */
function parseJwt(t) {
    try {
        const b64 = t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
        return JSON.parse(decodeURIComponent(
            atob(b64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')
        ));
    } catch(e) { return null; }
}

/* ── AUTH ── */
let authToken  = localStorage.getItem('authToken');
let refreshTok = localStorage.getItem('refreshToken');
const projectId   = localStorage.getItem('activeProjectId');
const projectName = localStorage.getItem('activeProjectName');

const ROUTES = {
    'dashboard':                  'dashboard.html',
    'client-dashboard':           'dashboard.html',
    'contractor-dashboard':       'dashboard.html',
    'consultant-dashboard':       'dashboard.html',
    'client-project-manager':     'dashboard.html',
    'contractor-project-manager': 'dashboard.html',
    'consultant-project-manager': 'dashboard.html',
};
function goBack() {
    const src = sessionStorage.getItem('redirectSource');
    if (src && ROUTES[src]) { window.location.href = ROUTES[src]; return; }
    if (document.referrer && !document.referrer.includes('chat.html')) { window.location.href = document.referrer; return; }
    if (window.history.length > 1) { window.history.back(); return; }
    window.location.href = 'dashboard.html';
}

if (!authToken && !refreshTok) { window.location.href = 'home.html'; }
if (!projectId) goBack();

const jwt             = parseJwt(authToken);
const currentUserId   = jwt ? Number(jwt.sub) : null;
const currentUserRole = normRole(jwt?.role || '');
const currentUserName = jwt?.name || jwt?.representative || (jwt?.email||'').split('@')[0] || 'You';
const currentUserPos  = jwt?.position || jwt?.title || '';

/* ── DOM ── */
const $ = id => document.getElementById(id);
const sidebar        = $('sidebar');
const chatArea       = $('chatArea');
const projectLabel   = $('projectLabel');
const currentChip    = $('currentUserChip');
const chatAvatar     = $('chatAvatar');
const chatName       = $('chatName');
const chatStatus     = $('chatStatus');
const chatMessages   = $('chatMessages');
const contactsList   = $('contactsList');
const searchInput    = $('searchInput');
const backBtn        = $('backBtn');
const mobileBack     = $('mobileBack');
const groupBtn       = $('groupBtn');
const msgInput       = $('msgInput');
const sendBtn        = $('sendBtn');
const attachBtn      = $('attachBtn');
const fileInput      = $('fileInput');
const attachPill     = $('attachPill');
const attachPillName = $('attachPillName');
const attachPillRm   = $('attachPillRm');
const emojiBtn       = $('emojiBtn');
const emojiPicker    = $('emojiPicker');
const emojiGrid      = $('emojiGrid');
const replyBar       = $('replyBar');
const replyBarName   = $('replyBarName');
const replyBarText   = $('replyBarText');
const replyBarClose  = $('replyBarClose');
const recBar         = $('recBar');
const recTimer       = $('recTimer');
const recCancel      = $('recCancel');

/* ── STATE ── */
let currentChat  = null;
let contacts     = [];
let pendingFile  = null;
let pollTimer    = null;
let replyTarget  = null;
let isMobile     = () => window.innerWidth < 768;

/* ── AUDIO RECORDING STATE ── */
let mediaRecorder   = null;
let audioChunks     = [];
let recTimerInt     = null;
let recSeconds      = 0;
let isRecording     = false;
let longPressTimer  = null;
let audioCtx        = null;

/* ── INIT ── */
projectLabel.textContent = projectName ? 'Project: ' + projectName : 'ID: ' + projectId;
currentChip.textContent  = currentUserName + (currentUserRole ? ' · ' + currentUserRole : '');

/* ── EMOJI PICKER ── */
EMOJIS.forEach(em => {
    const s = document.createElement('span');
    s.textContent = em;
    s.addEventListener('click', () => {
        msgInput.value += em;
        msgInput.focus();
        emojiPicker.classList.remove('open');
    });
    emojiGrid.appendChild(s);
});
emojiBtn.addEventListener('click', e => { e.stopPropagation(); emojiPicker.classList.toggle('open'); });
document.addEventListener('click', () => emojiPicker.classList.remove('open'));
emojiPicker.addEventListener('click', e => e.stopPropagation());

/* ══════════════════════════════════════
   SEND-BTN DUAL MODE: text → send, empty → mic
══════════════════════════════════════ */
function updateSendBtn() {
    if (isRecording) {
        console.log('[updateSendBtn] Skipping update - currently recording');
        return;
    }
    if (msgInput.value.trim() || pendingFile) {
        sendBtn.innerHTML = '➤';
        sendBtn.title = 'Send';
        sendBtn.setAttribute('data-mode','send');
        console.log('[updateSendBtn] Set mode to SEND (has text or file)');
    } else {
        sendBtn.innerHTML = '🎤';
        sendBtn.title = 'Hold to record voice message';
        sendBtn.setAttribute('data-mode','mic');
        console.log('[updateSendBtn] Set mode to MIC (empty input, no file)');
    }
}
msgInput.addEventListener('input', updateSendBtn);

sendBtn.addEventListener('click', e => {
    const mode = sendBtn.getAttribute('data-mode');
    if (mode === 'send') { sendMessage(); return; }
    // mic: single click = nothing (need hold) but show hint
});

/* Long-press mic on desktop/touch */
function startLongPress() {
    const mode = sendBtn.getAttribute('data-mode');
    console.log('[startLongPress] Button mode:', mode, 'isRecording:', isRecording);
    if (mode !== 'mic') {
        console.log('[startLongPress] Not in mic mode, ignoring');
        return;
    }
    console.log('[startLongPress] Starting 200ms timer before recording...');
    longPressTimer = setTimeout(() => {
        console.log('[startLongPress] Timer fired, calling startRecording()');
        startRecording();
    }, 200);
}
function endLongPress() {
    console.log('[endLongPress] Button released. isRecording:', isRecording);
    clearTimeout(longPressTimer);
    if (isRecording) {
        console.log('[endLongPress] Recording active, stopping and sending...');
        stopRecording(true);
    }
}

sendBtn.addEventListener('mousedown', e => {
    console.log('[sendBtn.mousedown] Event triggered');
    startLongPress();
});
sendBtn.addEventListener('mouseup', e => {
    console.log('[sendBtn.mouseup] Event triggered');
    endLongPress();
});
sendBtn.addEventListener('mouseleave', () => {
    console.log('[sendBtn.mouseleave] Event triggered');
    if (isRecording) stopRecording(true);
    clearTimeout(longPressTimer);
});
sendBtn.addEventListener('touchstart', e => {
    console.log('[sendBtn.touchstart] Event triggered');
    e.preventDefault();
    startLongPress();
}, {passive:false});
sendBtn.addEventListener('touchend', e => {
    console.log('[sendBtn.touchend] Event triggered');
    e.preventDefault();
    endLongPress();
}, {passive:false});

/* ══════════════════════════════════════
   AUDIO RECORDING
══════════════════════════════════════ */
async function startRecording() {
    if (isRecording) return;
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        const supportedMime = getSupportedMime();
        console.log('[startRecording] Using MIME type:', supportedMime);
        mediaRecorder = new MediaRecorder(stream, { mimeType: supportedMime });
        let chunkCount = 0;
        mediaRecorder.addEventListener('dataavailable', e => {
            if(e.data.size>0) {
                audioChunks.push(e.data);
                chunkCount++;
                console.log('[startRecording] dataavailable event', chunkCount, '- chunk size:', e.data.size, 'bytes. total chunks:', audioChunks.length);
            }
        });
        mediaRecorder.start(100);
        console.log('[startRecording] MediaRecorder started, timeslice=100ms');

        isRecording = true;
        recSeconds  = 0;
        recBar.classList.add('visible');
        sendBtn.classList.add('recording');
        sendBtn.innerHTML = '⏹';
        sendBtn.title = 'Release to send';

        recTimerInt = setInterval(() => {
            recSeconds++;
            const m = Math.floor(recSeconds/60), s = recSeconds%60;
            recTimer.textContent = m+':'+(s<10?'0':'')+s;
        }, 1000);
    } catch(err) {
        console.error('[startRecording] FAILED to get microphone access:', {
            name: err.name,
            message: err.message,
            code: err.code
        });
        alert('[ERROR] Microphone access failed: ' + err.message + '\n\nMake sure:\n1. You granted microphone permission\n2. Another app isn\'t using the mic\n3. Try a different browser');
    }
}

function stopRecording(send) {
    if (!mediaRecorder || !isRecording) return;
    clearInterval(recTimerInt);
    isRecording = false;
    recBar.classList.remove('visible');
    sendBtn.classList.remove('recording');
    updateSendBtn();

    mediaRecorder.addEventListener('stop', async () => {
        const stream = mediaRecorder.stream;
        stream.getTracks().forEach(t => t.stop());

        console.log('[stopRecording] audioChunks.length:', audioChunks.length, 'send:', send);
        
        if (!send || audioChunks.length === 0) {
            console.warn('[stopRecording] No audio data captured or send=false. Discarding.');
            audioChunks = [];
            return;
        }

        const mime = getSupportedMime();
        const blob = new Blob(audioChunks, { type: mime });
        console.log('[stopRecording] blob created. size:', blob.size, 'bytes. mime:', mime);
        audioChunks = [];

        const ext  = mime.includes('ogg') ? 'ogg' : mime.includes('webm') ? 'webm' : 'm4a';
        const file = new File([blob], 'voice-'+Date.now()+'.'+ext, { type: mime });
        console.log('[stopRecording] File created:', file.name, 'size:', file.size, 'type:', file.type);

        // Upload then send
        await uploadAndSendFile(file, true);
    }, {once:true});

    mediaRecorder.stop();
}

function cancelRecording() {
    if (!mediaRecorder || !isRecording) return;
    clearInterval(recTimerInt);
    isRecording = false;
    audioChunks = [];
    recBar.classList.remove('visible');
    sendBtn.classList.remove('recording');
    updateSendBtn();
    try {
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        mediaRecorder.stop();
    } catch(e){}
}

function getSupportedMime() {
    const types = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
    for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
    return 'audio/webm';
}

recCancel.addEventListener('click', () => cancelRecording());

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function normRole(r) {
    if (!r) return '';
    return ({
        Client:'Client', Contractor:'Contractor', Consultant:'Consultant',
        ClientPM:'ClientPM','Client Project Manager':'ClientPM',
        ContractorPM:'ContractorPM','Contractor Project Manager':'ContractorPM',
        ConsultantPM:'ConsultantPM','Consultant Project Manager':'ConsultantPM',
        TeamMember:'TeamMember','Team Member':'TeamMember',
    })[r] || r;
}

function roleClass(role) {
    const map = {
        Contractor:'role-contractor', ContractorPM:'role-contractorpm',
        Consultant:'role-consultant', ConsultantPM:'role-consultantpm',
        Client:'role-client',         ClientPM:'role-clientpm',
        TeamMember:'role-teammember',
    };
    return map[normRole(role)] || 'role-default';
}

function humanRole(r) {
    return ({ContractorPM:'Contractor PM',ConsultantPM:'Consultant PM',ClientPM:'Client PM',TeamMember:'Team Member'})[r]||r;
}

function initial(s) { return s ? s.trim().charAt(0).toUpperCase() : '?'; }

function esc(t) {
    return (t||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]);
}

function friendlyDate(iso) {
    const d = new Date(iso), now = new Date();
    const yd = new Date(now); yd.setDate(now.getDate()-1);
    if (d.toDateString() === now.toDateString()) return 'Today';
    if (d.toDateString() === yd.toDateString())  return 'Yesterday';
    return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}

function strColor(s) {
    const p=['#25d366','#128c7e','#0550ae','#7c3aed','#b45309','#e11d48','#0f766e','#c2410c'];
    let h=0; for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h);
    return p[Math.abs(h)%p.length];
}

function buildDisplayName(m) {
    const role = normRole(m.role);
    if (role === 'Client') return [m.representative,m.title,'Client'].filter(Boolean).join(' - ');
    else if (role==='Contractor'||role==='Consultant') return [m.representative,m.title_position,role].filter(Boolean).join(' - ');
    else if (role==='ContractorPM'||role==='ConsultantPM'||role==='ClientPM') return [m.name||m.title,humanRole(role)].filter(Boolean).join(' - ');
    else if (role==='TeamMember') return [m.name||m.title,m.position,m.assigned_part,'Team Member'].filter(Boolean).join(' - ');
    return m.name||m.representative||m.email||'Unknown';
}

function buildSenderLabel(m) {
    const sRole = normRole(m.senderRole);
    if (sRole==='TeamMember') return [m.senderName,m.senderPosition,m.senderAssignedByName?'assigned by '+m.senderAssignedByName:(m.senderAssignedPart?'assigned by '+m.senderAssignedPart:''),'Team Member'].filter(Boolean).join(' - ');
    else if (sRole==='ContractorPM'||sRole==='ConsultantPM'||sRole==='ClientPM') return [m.senderName,humanRole(sRole)].filter(Boolean).join(' - ');
    else return [m.senderName,m.senderPosition,sRole].filter(Boolean).join(' - ');
}

function buildAvatarContent(contact) {
    if (contact.pictureUrl) return '<img src="'+esc(contact.pictureUrl)+'" alt="'+esc(contact.name)+'">';
    return esc(contact.initial || initial(contact.email));
}

/* ── Detect media types ── */
function isImageMime(mime, name) {
    return (mime && mime.startsWith('image/')) || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(name||'');
}
function isVideoMime(mime, name) {
    return (mime && mime.startsWith('video/')) || /\.(mp4|mov|webm|avi|mkv|ogg)$/i.test(name||'');
}
function isAudioMime(mime, name) {
    return (mime && mime.startsWith('audio/')) || /\.(mp3|wav|ogg|webm|m4a|aac|flac)$/i.test(name||'');
}

/* ══════════════════════════════════════
   AUDIO PLAYER WIDGET
══════════════════════════════════════ */
function buildAudioWidget(url, durationHint) {
    const wrap  = document.createElement('div');
    wrap.className = 'msg-audio-wrap';

    const playBtn = document.createElement('button');
    playBtn.className = 'msg-audio-play';
    playBtn.innerHTML = '▶';

    // Waveform bars (decorative, random heights)
    const waveWrap = document.createElement('div');
    waveWrap.className = 'msg-audio-waveform';
    const heights = [8,12,18,14,20,10,16,9,15,12,18,14,20,8,12,18,14,10,16];
    heights.forEach(h => {
        const b = document.createElement('span');
        b.style.height = h+'px';
        waveWrap.appendChild(b);
    });

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-audio-time';
    timeEl.textContent = '0:00';

    wrap.appendChild(playBtn);
    wrap.appendChild(waveWrap);
    wrap.appendChild(timeEl);

    const audio = new Audio(url);
    let playing = false;

    function fmt(s) { s=Math.floor(s||0); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

    audio.addEventListener('timeupdate', () => {
        timeEl.textContent = fmt(audio.currentTime);
        // Animate waveform bars based on progress
        const pct = audio.duration ? audio.currentTime / audio.duration : 0;
        waveWrap.querySelectorAll('span').forEach((b, i) => {
            b.style.opacity = i/heights.length <= pct ? '1' : '0.35';
        });
    });
    audio.addEventListener('ended', () => {
        playing = false;
        playBtn.innerHTML = '▶';
        timeEl.textContent = fmt(audio.duration);
        waveWrap.querySelectorAll('span').forEach(b => b.style.opacity = '0.35');
    });

    audio.addEventListener('error', () => {
        console.warn('[buildAudioWidget] audio playback error', url, audio.error);
        playBtn.innerHTML = '⚠';
        timeEl.textContent = 'Error';
    });

    playBtn.addEventListener('click', () => {
        if (playing) { audio.pause(); playBtn.innerHTML = '▶'; playing = false; }
        else { audio.play(); playBtn.innerHTML = '⏸'; playing = true; }
    });

    return wrap;
}

/* ══════════════════════════════════════
   NORMALIZE MEMBER
══════════════════════════════════════ */
function normMember(m) {
    const role = normRole(m.role);
    return {
        id:          role+'-'+m.role_id,
        name:        buildDisplayName(m),
        email:       m.email||'',
        role,
        pictureUrl:  m.profile_picture||null,
        initial:     initial(m.name||m.display_name||m.representative||m.email||''),
        online:      true,
        isGroup:     false,
        recipientRole: role,
        recipientId: m.role_id,
        lastMessage: m.lastMessage||'Tap to chat',
        time:        m.time||'',
        sortAt:      m.sortAt||null,
        unreadCount: m.unreadCount||0,
        messages:    [],
    };
}

/* ══════════════════════════════════════
   REPLY STATE
══════════════════════════════════════ */
function setReply(msg) {
    if (!msg?.id) return;
    replyTarget = msg;
    replyBarName.textContent = msg.senderName||'Unknown';
    replyBarText.textContent = msg.text||(msg.attachmentName?'📎 '+msg.attachmentName:'');

    msgInput.focus();
}
function clearReply() {
    replyTarget = null;
    replyBar.classList.remove('visible');
    replyBarName.textContent = '';
    replyBarText.textContent = '';
}

/* ══════════════════════════════════════
   MOBILE NAVIGATION
══════════════════════════════════════ */
function showChatPanel() {
    if (!isMobile()) return;
    sidebar.classList.add('hidden');
    chatArea.classList.add('visible');
}
function showSidebarPanel() {

    }
});

/* ══════════════════════════════════════
   POLLING — also re-checks read receipts
══════════════════════════════════════ */
function stopPoll() { if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
function startPoll() {
    stopPoll();
    pollTimer = setInterval(async () => {
        if (!currentChat) return;
        try {
            const prevLen   = currentChat.messages.length;
            const prevTicks = JSON.stringify(currentChat.messages.map(m=>m.readBy));
            await fetchMessages(currentChat);
            const newTicks  = JSON.stringify(currentChat.messages.map(m=>m.readBy));
            if (currentChat.messages.length !== prevLen || newTicks !== prevTicks) renderMessages();
            renderContacts(searchInput.value);
        } catch(e){ console.warn('poll',e); }
    }, POLL_MS);
}

/* ══════════════════════════════════════
   API
══════════════════════════════════════ */
async function refreshAuth() {
    const rt = localStorage.getItem('refreshToken');
    if (!rt) return null;
    try {
        const r = await fetch(API_BASE+'/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:rt})});
        if (!r.ok) return null;
        const d = await r.json();
        if (!d?.accessToken) return null;
        authToken = d.accessToken;
        localStorage.setItem('authToken', authToken);
        if (d.refreshToken) localStorage.setItem('refreshToken', d.refreshToken);
        return authToken;
    } catch(e){ return null; }
}

async function api(path, opts={}) {
    const tok = authToken||localStorage.getItem('authToken');
    const headers = {'Authorization':'Bearer '+tok,'Accept':'application/json'};
    let body = null;
    if (opts.body!=null && !(opts.body instanceof FormData)) {
        headers['Content-Type']='application/json';
        body=JSON.stringify(opts.body);
    } else { body=opts.body||null; }
    const url = path.startsWith('http') ? path : API_BASE+path;
    const res  = await fetch(url,{method:opts.method||'GET',headers,body});
    if ((res.status===401||res.status===403)&&!opts._retry) {
        const nt = await refreshAuth();
        if (nt) return api(path,{...opts,_retry:true});
        localStorage.removeItem('authToken'); localStorage.removeItem('refreshToken');
        window.location.href='home.html'; return;
    }
    const ct = res.headers.get('content-type')||'';
    if (!ct.includes('application/json')){const t=await res.text();throw new Error(t.trim().slice(0,200)||'Server error '+res.status);}
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error||data?.message||'Request failed');
    return data;
}

/* ══════════════════════════════════════
   FETCH MESSAGES
══════════════════════════════════════ */
async function fetchMessages(contact) {
    const ep = contact.isGroup
        ? '/chat/messages?projectId='+encodeURIComponent(projectId)+'&isGroup=true'
        : '/chat/messages?projectId='+encodeURIComponent(projectId)
          +'&recipientRole='+encodeURIComponent(contact.recipientRole)
          +'&recipientId='+encodeURIComponent(contact.recipientId);

    const data = await api(ep);
    if (!data) return;

    contact.messages = (data.messages||[]).map(msg => {
        let readBy = [];
        if (Array.isArray(msg.read_by)) readBy = msg.read_by;
        else if (msg.read_by) { try{readBy=JSON.parse(msg.read_by);}catch(e){readBy=[];} }
        let deliveredTo = [];
        if (Array.isArray(msg.delivered_to)) deliveredTo = msg.delivered_to;
        else if (msg.delivered_to) { try{deliveredTo = JSON.parse(msg.delivered_to);}catch(e){deliveredTo = []; } }
        const deliveredFromRecipients = Array.isArray(deliveredTo) ? deliveredTo.map(Number).filter(Boolean) : [];
        
        // Log attachment data from server
        if (msg.attachment_url) {
            console.log('[fetchMessages] Message with attachment:', {id: msg.id, url: msg.attachment_url, mime: msg.attachment_mime, name: msg.attachment_name});
        }
        
        return {
            id:                 msg.id,
            text:               msg.content||'',
            attachmentUrl:      msg.attachment_url||null,
            attachmentName:     msg.attachment_name||null,
            attachmentMime:     msg.attachment_mime||msg.attachmentMime||null,
                delivered:          (deliveredFromRecipients.length > 0 && deliveredFromRecipients.some(id=>Number(id)!==Number(currentUserId))) || !!msg.delivered,
            sent:               String(msg.sender_id)===String(currentUserId) && normRole(String(msg.sender_role))===currentUserRole,
            senderName:         msg.sender_display_name||msg.sender_email||'Unknown',
            senderRole:         msg.sender_role||'',
            senderPosition:     msg.sender_position||msg.sender_title||'',
            senderAssignedPart: msg.sender_assigned_part||msg.assigned_part||'',
            senderAssignedByName: msg.sender_assigned_by_name||'',
            time:               new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
            createdAt:          msg.created_at,
            readBy,
            replyToMessageId:  msg.reply_to_message_id||null,
            replyToText:       msg.reply_to_content||null,
            replyToSenderName: msg.reply_to_sender_email?(msg.reply_to_sender_email.split('@')[0]):null,
        };
    });

    if (contact.messages.length) {
        const last = contact.messages[contact.messages.length-1];
        contact.lastMessage = last.text||(last.attachmentName?'📎 '+last.attachmentName:'Message');
        contact.time   = last.time;
        contact.sortAt = last.createdAt;
    }

    const toMark = contact.messages.filter(m=>!m.sent&&!m.readBy.includes(currentUserId)).map(m=>m.id);
    if (toMark.length) api('/chat/mark-read',{method:'POST',body:{messageIds:toMark,projectId}}).catch(()=>{});
    contact.unreadCount = 0;
}

/* ══════════════════════════════════════
   RENDER CONTACTS
   Sorting: unread first → group → by time
══════════════════════════════════════ */
function renderContacts(filter) {
    filter = (filter||'').trim().toLowerCase();
    const list = contacts
        .filter(c=>!filter||[c.name,c.role,c.email,c.lastMessage].filter(Boolean).some(t=>t.toLowerCase().includes(filter)))
        .sort((a,b) => {
            // Unread contacts float to top, sorted by unread count desc
            const ud = (b.unreadCount||0)-(a.unreadCount||0);
            if (ud) return ud;
            if (a.isGroup&&!b.isGroup) return -1;
            if (!a.isGroup&&b.isGroup) return 1;
            return new Date(b.sortAt||b.time||0)-new Date(a.sortAt||a.time||0);
        });

    contactsList.innerHTML = '';
    if (!list.length) {
        contactsList.innerHTML='<div style="padding:24px;text-align:center;color:#8696a0;font-size:13px">'+(filter?'No matches':'No contacts')+'</div>';
        return;
    }

    list.forEach(c => {
        const div = document.createElement('div');
        div.className = 'contact-item'
            +(currentChat?.id===c.id?' active':'')
            +(c.unreadCount?' unread':'');
        div.innerHTML =
            '<div class="avatar '+(c.online?'online':'')+'" style="'+(c.pictureUrl?'':'background:'+strColor(c.name)+';')+'">'+buildAvatarContent(c)+'</div>'+
            '<div class="contact-info">'+
                '<div class="contact-row">'+
                    '<div class="contact-name">'+esc(c.name)+'</div>'+
                    '<div class="contact-time">'+esc(c.time||'')+'</div>'+
                '</div>'+
                '<div class="contact-msg">'+esc(c.lastMessage||'Tap to chat')+'</div>'+
            '</div>'+
            (c.unreadCount?'<div class="unread-badge">'+c.unreadCount+'</div>':'');
        div.addEventListener('click', ()=>selectChat(c));
        contactsList.appendChild(div);
    });
}

/* ══════════════════════════════════════
   RENDER MESSAGES
   — blue ✓✓ when read_by contains any non-self ID
   — inline video player
   — custom audio player
══════════════════════════════════════ */
function renderMessages() {
    chatMessages.innerHTML = '';
    if (!currentChat) {
        chatMessages.innerHTML='<div class="state-box"><div class="state-icon">💬</div><div>Select a conversation</div></div>';
        return;
    }
    if (!currentChat.messages.length) {
        chatMessages.innerHTML='<div class="state-box"><div class="state-icon">👋</div><div>No messages yet — say hello!</div></div>';
        return;
    }

    let lastDateKey  = null;
    let lastSenderId = null;

    currentChat.messages.forEach(m => {
        const dk = new Date(m.createdAt).toDateString();
        if (dk !== lastDateKey) {
            lastDateKey = dk;
            const sep = document.createElement('div');
            sep.className = 'date-sep';
            sep.innerHTML = '<span>'+esc(friendlyDate(m.createdAt))+'</span>';
            chatMessages.appendChild(sep);
            lastSenderId = null;
        }

        const senderId  = m.sent ? '__me__' : (m.senderName+m.senderRole);
        const consecutive = senderId === lastSenderId;
        lastSenderId = senderId;

        const row = document.createElement('div');
        row.className = 'message '+(m.sent?'sent':'received')+(consecutive?' consecutive':'');

        if (!m.sent) {
            const slot = document.createElement('div');
            slot.className = 'msg-avatar-slot';
            if (currentChat.isGroup && !consecutive) {
                const av = document.createElement('div');
                av.className = 'avatar sm';
                av.title = m.senderName;
                av.style.background = strColor(m.senderName+m.senderRole);
                av.textContent = initial(m.senderName);
                slot.appendChild(av);
            }
            row.appendChild(slot);
        }

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.title = 'Tap to reply';
        bubble.addEventListener('click', e => {
            if (e.target.closest('a')||e.target.closest('img')||e.target.closest('video')||e.target.closest('.msg-audio-play')) return;
            setReply(m);
        });

        if (currentChat.isGroup && !m.sent && !consecutive) {
            const lbl = document.createElement('div');
            lbl.className = 'sender-label '+roleClass(m.senderRole);
            lbl.textContent = buildSenderLabel(m);
            bubble.appendChild(lbl);
        }

        if (m.replyToText) {
            const rb = document.createElement('div');
            rb.className = 'reply-block';
            rb.innerHTML = '<div class="reply-block-name">↩ '+esc(m.replyToSenderName||'Unknown')+'</div>'
                +'<div class="reply-block-text">'+esc(m.replyToText)+'</div>';
            bubble.appendChild(rb);
        }

        if (m.text) {
            const t = document.createElement('div');
            t.textContent = m.text;
            bubble.appendChild(t);
        }

        /* ── ATTACHMENT rendering ── */
        if (m.attachmentUrl) {
            const mime = m.attachmentMime || '';
            const name = m.attachmentName || '';

            if (isAudioMime(mime, name)) {
                /* Custom audio player */
                bubble.appendChild(buildAudioWidget(m.attachmentUrl));
            } else if (isVideoMime(mime, name)) {
                /* Inline video player */
                const vid = document.createElement('video');
                vid.src = m.attachmentUrl;
                vid.className = 'msg-video';
                vid.controls = true;
                vid.preload = 'metadata';
                vid.playsInline = true;
                bubble.appendChild(vid);
            } else if (isImageMime(mime, name)) {
                const img = document.createElement('img');
                img.src = m.attachmentUrl; img.className = 'msg-image';
                img.alt = name||'Image'; img.loading = 'lazy';
                img.addEventListener('click',()=>window.open(m.attachmentUrl,'_blank'));
                bubble.appendChild(img);
            } else {
                const a = document.createElement('a');
                a.href = m.attachmentUrl; a.target='_blank'; a.rel='noopener noreferrer';
                a.className = 'msg-file';
                a.textContent = '📎 '+(name||'Attachment');
                bubble.appendChild(a);
            }
        }

        /* Footer with read receipts */
        const footer = document.createElement('div');
        footer.className = 'msg-footer';
        const tEl = document.createElement('span');
        tEl.className = 'msg-time'; tEl.textContent = m.time||'';
        footer.appendChild(tEl);

        if (m.sent) {
            const tk = document.createElement('span');
            /* readBy contains IDs of everyone who read it.
               If any ID other than currentUserId is in the list → blue double tick */
            const others = (m.readBy||[]).filter(id=>Number(id)!==currentUserId);
            const isRead = others.length > 0;
            const isDelivered = !isRead && !!m.delivered;
            tk.className = 'msg-ticks' + (isRead ? ' read' : '');
            tk.textContent = isRead ? '✓✓' : (isDelivered ? '✓✓' : '✓');
            tk.title = isRead ? 'Read' : (isDelivered ? 'Delivered' : 'Sent');
            footer.appendChild(tk);
        }
        bubble.appendChild(footer);
        row.appendChild(bubble);

        if (m.sent) {
            const sp = document.createElement('div');
            sp.className = 'msg-avatar-slot';
            row.appendChild(sp);
        }

        chatMessages.appendChild(row);
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* ══════════════════════════════════════
   SELECT CHAT
══════════════════════════════════════ */
async function selectChat(contact) {
    clearReply();
    stopPoll();
    currentChat = contact;
    currentChat.unreadCount = 0;

    chatName.textContent = contact.name;
    chatStatus.textContent = contact.isGroup
        ? 'Group chat · '+(contact.membersCount||(contacts.length-1))+' members'
        : contact.email||'';
    chatAvatar.innerHTML  = buildAvatarContent(contact);
    chatAvatar.className  = 'avatar lg'+(contact.online?' online':'');
    chatAvatar.style.background = contact.pictureUrl ? '' : strColor(contact.name);

    chatMessages.innerHTML = '<div class="state-box"><div class="spinner"></div><div>Loading…</div></div>';
    showChatPanel();

    try {
        await fetchMessages(contact);
    } catch(err) {
        chatMessages.innerHTML='<div class="state-box"><div class="state-icon">⚠️</div><div>Could not load messages. Tap to retry.</div></div>';
        chatMessages.addEventListener('click',()=>selectChat(contact),{once:true});
        return;
    }

    renderContacts(searchInput.value);
    renderMessages();
    msgInput.focus();
    startPoll();
}

/* ══════════════════════════════════════
   SEND MESSAGE
══════════════════════════════════════ */
async function sendMessage() {
    const text = msgInput.value.trim();
    if (!currentChat) return;
    if (!text && !pendingFile?.url) return;

    sendBtn.disabled = true;
    const payload = {
        projectId,
        content:          text,
        isGroup:          currentChat.isGroup,
        replyToMessageId: replyTarget?.id||null,
    };
    if (!currentChat.isGroup) {
        payload.recipientRole = currentChat.recipientRole;
        payload.recipientId   = currentChat.recipientId;
    }
    if (pendingFile?.url) {
        payload.attachmentUrl  = pendingFile.url;
        payload.attachmentName = pendingFile.name||'';
        if (pendingFile.mime) payload.attachmentMime = pendingFile.mime;
    }

    try {
        console.log('[sendMessage] Sending payload with attachment:', {url: pendingFile?.url, name: pendingFile?.name, mime: pendingFile?.mime});
        const data = await api('/chat/messages',{method:'POST',body:payload});
        if (!data) {
            console.error('[sendMessage] No response from server');
            return;
        }
        const ret    = data.chatMessage||{};
        const nowIso = ret.created_at||new Date().toISOString();
        const msgTime= new Date(nowIso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

        // Validate attachment metadata from server response
        console.log('[sendMessage] Server returned message with attachment:', {url: ret.attachment_url, name: ret.attachment_name, mime: ret.attachment_mime});
        if (pendingFile && !ret.attachment_mime) {
            console.warn('[sendMessage] server missing attachment_mime in response. sent:', pendingFile.mime, 'url:', ret.attachment_url);
        }

        currentChat.messages.push({
            id: ret.id||Date.now()+'-'+Math.random(),
            text, sent:true, time:msgTime, createdAt:nowIso,
            attachmentUrl:  ret.attachment_url||pendingFile?.url||null,
            attachmentName: ret.attachment_name||pendingFile?.name||null,
            attachmentMime: ret.attachment_mime||pendingFile?.mime||null,
            senderName: currentUserName, senderRole: currentUserRole,
            senderPosition: currentUserPos,
            readBy: [currentUserId],
            replyToMessageId: replyTarget?.id||null,
            replyToText:      replyTarget?.text||null,
            replyToSenderName: replyTarget?.senderName||null,
        });

        currentChat.lastMessage = text||(pendingFile?.name?'📎 '+pendingFile.name:'Sent');
        currentChat.time   = msgTime;
        currentChat.sortAt = nowIso;

        msgInput.value = '';
        pendingFile = null;
        attachPill.classList.remove('visible');
        attachPillName.textContent = '';
        clearReply();
        updateSendBtn();

        renderContacts(searchInput.value);
        renderMessages();
    } catch(err) {
        alert('Send failed: '+err.message);
    } finally {
        sendBtn.disabled = false;
    }
}

/* ══════════════════════════════════════
   FILE UPLOAD (images, video, audio, docs)
══════════════════════════════════════ */
async function uploadAndSendFile(file, sendImmediately) {
    const fd = new FormData();
    fd.append('attachment', file);
    console.log('[uploadAndSendFile] Uploading file:', file.name, 'type:', file.type, 'size:', file.size);
    try {
        const res = await fetch(API_BASE+'/api/upload-attachment',{
            method:'POST',
            headers:{'Authorization':'Bearer '+(authToken||localStorage.getItem('authToken'))},
            body: fd
        });
        const d = await res.json();
        console.log('[uploadAndSendFile] Upload response:', d);
        if (d?.url) {
            console.log('[uploadAndSendFile] Stored pendingFile with url:', d.url, 'mime:', d.mime, 'name:', d.name);
            pendingFile = {url:d.url, name:file.name, mime:file.type};
            if (sendImmediately) {
                await sendMessage();
            } else {
                attachPillName.textContent = file.name;
                attachPill.classList.add('visible');
                updateSendBtn();
            }
        } else {
            console.error('[uploadAndSendFile] Upload failed:', d);
            alert('Upload failed: '+(d?.error||'Unknown'));
        }
    } catch(err) {
        console.error('[uploadAndSendFile] Exception:', err);
        alert('Upload failed: '+err.message);
    }
}

/* ══════════════════════════════════════
   EVENT LISTENERS
══════════════════════════════════════ */
backBtn.addEventListener('click', goBack);
mobileBack.addEventListener('click', showSidebarPanel);
groupBtn.addEventListener('click', ()=>{ const g=contacts.find(c=>c.isGroup); if(g) selectChat(g); });
searchInput.addEventListener('input', e=>renderContacts(e.target.value));
replyBarClose.addEventListener('click', clearReply);
msgInput.addEventListener('keypress', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });

/* Attach: supports images, video, and other files */
attachBtn.addEventListener('click', ()=>fileInput.click());
fileInput.addEventListener('change', async e => {
    const file = e.target.files?.[0];
    if (!file) return;
    fileInput.value = '';
    await uploadAndSendFile(file, false);
});
attachPillRm.addEventListener('click', ()=>{
    pendingFile = null;
    attachPill.classList.remove('visible');
    attachPillName.textContent = '';
    updateSendBtn();
});

/* Kick off */
updateSendBtn();
loadContacts().catch(err=>{
    console.error('Fatal',err);
    chatStatus.textContent = 'Unable to load chat. Please refresh.';
    contactsList.innerHTML = '<div style="padding:20px;text-align:center;color:#e11d48;font-size:13px">Failed to load contacts.</div>';
});

/* ══════════════════════════════════════
   LOAD CONTACTS
══════════════════════════════════════ */
async function loadContacts() {
    const data = await api('/chat/conversations?projectId='+encodeURIComponent(projectId));
    if (!data?.success) throw new Error(data?.error||'Failed to load');

    const members = Array.isArray(data.members)?data.members:[];
    const group = {
        id:          'group-'+projectId,
        name:        (projectName||'Project')+' Group',
        email:       '',
        role:        'Group',
        pictureUrl:  null,
        initial:     'G',
        online:      true,
        isGroup:     true,
        membersCount:data.group?.membersCount||members.length,
        lastMessage: data.group?.lastMessage||'Group chat for the project',
        time:        data.group?.time||'',
        sortAt:      data.group?.lastAt||null,
        unreadCount: data.group?.unreadCount||0,
        messages:    [],
    };

    contacts = [
        group,
        ...members
            .filter(m=>!(String(m.role_id)===String(currentUserId)&&normRole(m.role)===currentUserRole))
            .map(normMember)
    ];

    renderContacts();
    await selectChat(contacts[0]);
}

})();
