<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 360px;
            background: #ffffff;
            border-right: 1px solid #e6e9ee;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #e6e9ee;
        }

        .chat-title {
            font-size: 24px;
            font-weight: 700;
            color: #141414;
        }

        .project-label {
            margin-top: 4px;
            color: #5c6670;
            font-size: 13px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s, transform 0.2s;
        }

        .icon-btn:hover {
            background: #e8ebef;
            transform: translateY(-1px);
        }

        .search-box {
            padding: 14px 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dbe1e8;
            border-radius: 999px;
            outline: none;
            background: #f6f8fb;
            font-size: 14px;
            color: #212a33;
        }

        .search-input:focus {
            background: #ffffff;
            border-color: #b9c2cc;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            margin: 0 12px 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            background: #ffffff;
        }

        .contact-item:hover {
            background: #f0f6ff;
        }

        .contact-item.active {
            background: #e8f2ff;
        }

        .contact-item.unread {
            box-shadow: inset 0 0 0 1px rgba(37, 211, 102, 0.18);
            border: 1px solid #25d366;
        }

        .unread-badge {
            min-width: 20px;
            padding: 0 8px;
            border-radius: 999px;
            background: #25d366;
            color: #ffffff;
            font-size: 11px;
            line-height: 20px;
            text-align: center;
            margin-left: auto;
            margin-top: 4px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar.online::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #31a24c;
            border: 2px solid #ffffff;
            border-radius: 50%;
            bottom: 0;
            right: 0;
        }

        .contact-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }

        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .contact-name {
            font-weight: 600;
            color: #121212;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: #828a94;
        }

        .contact-meta {
            font-size: 13px;
            color: #58606a;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .contact-message {
            font-size: 13px;
            color: #58606a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid #e6e9ee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .chat-header-info .avatar {
            width: 62px;
            height: 62px;
        }

        .chat-header-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            color: #33333b;
            font-size: 14px;
            white-space: nowrap;
        }

        .chat-name {
            font-size: 20px;
            font-weight: 700;
            color: #111111;
        }

        .chat-status {
            margin-top: 4px;
            font-size: 14px;
            color: #5f6570;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f7fb;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.22s ease-out;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            max-width: 70%;
            padding: 14px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            font-size: 14.4px;
            line-height: 1.5;
            position: relative;
        }

        .message.received .message-bubble {
            background: #ffffff;
            border: 1px solid #e4e8ed;
            color: #141414;
        }

        .message.sent .message-bubble {
            background: #dcf8c6;
            color: #141414;
        }

        .message-time {
            font-size: 12px;
            color: #7c858f;
            margin-top: 6px;
            min-width: 50px;
            text-align: right;
        }

        .reply-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            gap: 12px;
            background: #eef7ff;
            border-top: 1px solid #e6e9ee;
            border-bottom: 1px solid #e6e9ee;
        }

        .reply-preview-main {
            flex: 1;
            min-width: 0;
        }

        .reply-label {
            font-size: 12px;
            color: #4b5563;
            margin-bottom: 4px;
        }

        .reply-text {
            font-size: 14px;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reply-cancel-btn {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: #ffffff;
            border-top: 1px solid #e6e9ee;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f3f6f9;
            border-radius: 999px;
            padding: 12px 16px;
        }

        .message-input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 15px;
            color: #22272b;
            font-family: inherit;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #25d366;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.04);
        }

        @media (max-width: 860px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #e6e9ee;
            }

            .chat-area {
                min-height: calc(100vh - 230px);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>
                <div class="chat-title">Project Chat</div>
                <div class="project-label" id="projectLabel">Loading project...</div>
            </div>
            <button class="icon-btn" id="backBtn" title="Back">←</button>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search teammates or group">
        </div>

        <div class="contacts-list" id="contactsList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="avatar online" id="chatAvatar">P</div>
                <div>
                    <div class="chat-name" id="chatName">Select a chat</div>
                    <div class="chat-status" id="chatStatus">Messages with project teammates appear here</div>
                </div>
            </div>
            <div class="chat-header-meta">
                <div id="currentUserLabel">Unknown user</div>
                <button class="icon-btn" id="groupBtn" title="Open group chat">👥</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="reply-preview" id="replyPreview" style="display:none">
            <div class="reply-preview-main">
                <div class="reply-label">Replying to <span id="replyName"></span></div>
                <div class="reply-text" id="replyText"></div>
            </div>
            <button class="reply-cancel-btn" id="cancelReplyBtn" title="Cancel reply">×</button>
        </div>

        <div class="chat-input-area">
            <div class="message-input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
            </div>
            <input type="file" id="attachmentInput" style="display:none" />
            <button class="icon-btn" id="attachBtn" title="Attach file">📎</button>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const API_BASE = window.BACKEND_URL || 'https://oneprojectapp-backend.onrender.com';

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('')));
            } catch (e) {
                console.error('JWT parse error:', e);
                return null;
            }
        }

        let authToken = localStorage.getItem('authToken');
        let refreshToken = localStorage.getItem('refreshToken');
        const activeProjectId = localStorage.getItem('activeProjectId');
        const activeProjectName = localStorage.getItem('activeProjectName');

        const routes = {
            'client-dashboard': 'client-dashboard.html',
            'contractor-dashboard': 'contractor-dashboard.html',
            'consultant-dashboard': 'consultant-dashboard.html',
            'client-project-manager': 'client-project-manager.html',
            'contractor-project-manager': 'contractor-project-manager.html',
            'consultant-project-manager': 'consultant-project-manager.html'
        };

        function getRedirectSource() {
            return sessionStorage.getItem('redirectSource');
        }

        function goBack() {
            const source = getRedirectSource();
            if (source && routes[source]) {
                window.location.href = routes[source];
                return;
            }

            if (document.referrer && !document.referrer.includes('chat.html')) {
                window.location.href = document.referrer;
                return;
            }

            if (window.history.length > 1) {
                window.history.back();
                return;
            }

            window.location.href = 'home.html';
        }

        if (!authToken && !refreshToken) {
            window.location.href = 'home.html';
        }

        if (!activeProjectId) {
            goBack();
        }

        const jwt = parseJwt(authToken);
        const currentUserId = jwt ? Number(jwt.sub) : null;
        const currentUserRole = normalizeRole(jwt?.role || 'Unknown role');
        const currentUserEmail = jwt?.email || jwt?.company_email || jwt?.companyEmail || '';
        const currentUserName = jwt?.representative || jwt?.name || currentUserEmail.split('@')[0] || 'You';
        const currentUserPosition = jwt?.position || jwt?.title || '';

        const projectLabel = document.getElementById('projectLabel');
        const currentUserLabel = document.getElementById('currentUserLabel');
        const chatAvatar = document.getElementById('chatAvatar');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const contactsList = document.getElementById('contactsList');
        const searchInput = document.getElementById('searchInput');
        const backBtn = document.getElementById('backBtn');
        const groupBtn = document.getElementById('groupBtn');
        const attachBtn = document.getElementById('attachBtn');
        const attachmentInput = document.getElementById('attachmentInput');

        let currentChat = null;
        let contacts = [];
        let pendingAttachment = null;
        let chatRefreshTimer = null;
        let replyTarget = null;

        const replyPreview = document.getElementById('replyPreview');
        const replyNameEl = document.getElementById('replyName');
        const replyTextEl = document.getElementById('replyText');
        const cancelReplyBtn = document.getElementById('cancelReplyBtn');

        projectLabel.textContent = activeProjectName
            ? `Project: ${activeProjectName}`
            : `Project ID: ${activeProjectId}`;

        currentUserLabel.textContent = `${currentUserName} · ${currentUserRole}`;

        function getInitialFromEmail(email) {
            return email ? email.trim().charAt(0).toUpperCase() : '?';
        }

        function buildAvatar(contact) {
            if (contact.pictureUrl) {
                return `<img src="${contact.pictureUrl}" alt="${contact.name || contact.email}">`;
            }
            return contact.initial || getInitialFromEmail(contact.email);
        }

        function normalizeRole(role) {
            if (!role) return role;
            return {
                Client: 'Client',
                Contractor: 'Contractor',
                Consultant: 'Consultant',
                ClientPM: 'ClientPM',
                'Client Project Manager': 'ClientPM',
                ContractorPM: 'ContractorPM',
                'Contractor Project Manager': 'ContractorPM',
                ConsultantPM: 'ConsultantPM',
                'Consultant Project Manager': 'ConsultantPM',
                TeamMember: 'TeamMember',
                'Team Member': 'TeamMember',
            }[role] || role;
        }

        function parseReplySender(senderEmail) {
            if (!senderEmail) return 'Unknown';
            return senderEmail.split('@')[0] || senderEmail;
        }

        function setReplyTarget(message) {
            if (!message || !message.id) return;
            replyTarget = message;
            replyNameEl.textContent = message.senderName || message.senderRole || 'Unknown';
            replyTextEl.textContent = message.text || (message.attachmentName ? `Attachment: ${message.attachmentName}` : '');
            replyPreview.style.display = 'flex';
            messageInput.focus();
        }

        function clearReplyTarget() {
            replyTarget = null;
            replyPreview.style.display = 'none';
            replyNameEl.textContent = '';
            replyTextEl.textContent = '';
        }

        function updateReplyPreview() {
            if (!replyTarget) {
                clearReplyTarget();
                return;
            }
            replyNameEl.textContent = replyTarget.senderName || replyTarget.senderRole || 'Unknown';
            replyTextEl.textContent = replyTarget.text || (replyTarget.attachmentName ? `Attachment: ${replyTarget.attachmentName}` : '');
            replyPreview.style.display = 'flex';
        }

        function stopChatRefresh() {
            if (chatRefreshTimer) {
                clearInterval(chatRefreshTimer);
                chatRefreshTimer = null;
            }
        }

        function startChatRefresh() {
            stopChatRefresh();
            chatRefreshTimer = setInterval(async () => {
                if (!currentChat) return;
                try {
                    await fetchMessagesFor(currentChat);
                    renderMessages();
                } catch (err) {
                    console.error('Chat refresh failed:', err);
                }
            }, 5000);
        }

        function createContactItem(contact) {
            const item = document.createElement('div');
            item.className = `contact-item ${currentChat?.id === contact.id ? 'active' : ''}${contact.unreadCount ? ' unread' : ''}`;
            item.innerHTML = `
                <div class="avatar ${contact.online ? 'online' : ''}">${buildAvatar(contact)}</div>
                <div class="contact-info">
                    <div class="contact-header">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-time">${contact.time || ''}</div>
                    </div>
                    <div class="contact-meta">${contact.title || ''} · ${contact.role}${contact.position ? ' · ' + contact.position : ''}</div>
                    <div class="contact-message">${contact.lastMessage || 'Tap to chat'}</div>
                </div>
                ${contact.unreadCount ? `<div class="unread-badge">${contact.unreadCount}</div>` : ''}
            `;
            item.addEventListener('click', () => selectChat(contact));
            return item;
        }

        function renderContacts(filter = '') {
            contactsList.innerHTML = '';
            const normalizedFilter = filter.trim().toLowerCase();
            const visible = contacts
                .filter(contact => {
                    if (!normalizedFilter) return true;
                    return [contact.name, contact.role, contact.title, contact.position, contact.email, contact.lastMessage]
                        .filter(Boolean)
                        .some(text => text.toLowerCase().includes(normalizedFilter));
                })
                .sort((a, b) => {
                    if ((b.unreadCount || 0) !== (a.unreadCount || 0)) return (b.unreadCount || 0) - (a.unreadCount || 0);
                    if (a.isGroup && !b.isGroup) return -1;
                    if (!a.isGroup && b.isGroup) return 1;
                    return (new Date(b.sortAt || b.time || 0) - new Date(a.sortAt || a.time || 0));
                });

            visible.forEach(contact => contactsList.appendChild(createContactItem(contact)));
            if (visible.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'contact-item';
                empty.innerHTML = '<div class="contact-info"><div class="contact-name">No matches found</div></div>';
                contactsList.appendChild(empty);
            }
        }

        async function refreshAuthToken() {
            const currentRefreshToken = localStorage.getItem('refreshToken');
            if (!currentRefreshToken) return null;

            const response = await fetch(`${API_BASE}/refresh`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken: currentRefreshToken }),
            });

            if (!response.ok) {
                return null;
            }

            const data = await response.json();
            if (!data?.accessToken) return null;

            authToken = data.accessToken;
            localStorage.setItem('authToken', authToken);
            if (data.refreshToken) {
                refreshToken = data.refreshToken;
                localStorage.setItem('refreshToken', refreshToken);
            }
            return authToken;
        }

        async function apiRequest(path, options = {}) {
            const headers = { 'Authorization': `Bearer ${authToken || localStorage.getItem('authToken')}` };
            let body = null;
            if (options.body != null && !(options.body instanceof FormData)) {
                headers['Content-Type'] = 'application/json';
                body = JSON.stringify(options.body);
            } else {
                body = options.body;
            }

            const response = await fetch(path.startsWith('http') ? path : `${API_BASE}${path}`, {
                method: options.method || 'GET',
                headers: { Accept: 'application/json', ...headers },
                body,
            });

            if ((response.status === 401 || response.status === 403) && !options._retry) {
                const newToken = await refreshAuthToken();
                if (newToken) {
                    return apiRequest(path, { ...options, _retry: true });
                }
                localStorage.removeItem('authToken');
                localStorage.removeItem('refreshToken');
                window.location.href = 'home.html';
                return;
            }

            const contentType = response.headers.get('content-type') || '';
            let data;
            if (contentType.includes('application/json')) {
                data = await response.json();
            } else {
                const text = await response.text();
                console.error('Non-JSON response from API:', path, response.status, text);
                const message = text.trim().slice(0, 200) || 'Request failed';
                throw new Error(message);
            }

            if (!response.ok) {
                throw new Error(data?.error || data?.message || 'Request failed');
            }
            return data;
        }

        function normalizeMember(member) {
            const normalizedRole = normalizeRole(member.role);
            return {
                id: `${normalizedRole}-${member.role_id}`,
                name: member.display_name || member.email || member.role,
                email: member.email || '',
                role: normalizedRole,
                title: member.company_name || member.title || member.role,
                position: member.position || '',
                pictureUrl: member.profile_picture || null,
                initial: member.display_name ? member.display_name.trim().charAt(0).toUpperCase() : getInitialFromEmail(member.email),
                online: true,
                isGroup: false,
                recipientRole: normalizedRole,
                recipientId: member.role_id,
                lastMessage: member.lastMessage || 'Tap to chat',
                time: member.time || '',
                sortAt: member.sortAt || null,
                unreadCount: member.unreadCount || 0,
                messages: [],
            };
        }

        async function fetchMessagesFor(contact) {
            if (!contact) return;
            const endpoint = contact.isGroup
                ? `/chat/messages?projectId=${encodeURIComponent(activeProjectId)}&isGroup=true`
                : `/chat/messages?projectId=${encodeURIComponent(activeProjectId)}&recipientRole=${encodeURIComponent(contact.recipientRole)}&recipientId=${encodeURIComponent(contact.recipientId)}`;
            const data = await apiRequest(endpoint);
            if (!data) return;
            contact.messages = data.messages.map(message => ({
                id: message.id,
                raw: message,
                text: message.content,
                attachmentUrl: message.attachment_url || null,
                attachmentName: message.attachment_name || null,
                attachmentMime: message.attachment_mime || message.attachmentMime || null,
                sent: String(message.sender_id) === String(currentUserId) && normalizeRole(String(message.sender_role)) === currentUserRole,
                senderName: message.sender_display_name || message.sender_email || 'Unknown',
                senderRole: message.sender_role || '',
                senderPosition: message.sender_position || message.sender_title || '',
                time: new Date(message.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                readBy: Array.isArray(message.read_by) ? message.read_by : (message.read_by ? JSON.parse(message.read_by) : []),
                replyToMessageId: message.reply_to_message_id || null,
                replyToText: message.reply_to_content || null,
                replyToSenderName: message.reply_to_sender_email ? parseReplySender(message.reply_to_sender_email) : null,
            }));
            if (contact.messages.length) {
                const last = contact.messages[contact.messages.length - 1];
                contact.lastMessage = last.text;
                contact.time = last.time;
            }

            // mark unread messages as read for this user
            const toMark = contact.messages.filter(m => !m.sent && !m.readBy.includes(currentUserId)).map(m => m.id);
            if (toMark.length) {
                apiRequest('/chat/mark-read', { method: 'POST', body: { messageIds: toMark, projectId: activeProjectId } }).catch(()=>{});
            }
            updateReplyPreview();
        }

        function renderMessages() {
            chatMessages.innerHTML = '';
            if (!currentChat) return;
            for (const m of currentChat.messages) {
                const el = document.createElement('div');
                el.className = `message ${m.sent ? 'sent' : 'received'}`;
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                
                // Show sender name and position in group chats
                if (currentChat.isGroup && !m.sent) {
                    const senderNameEl = document.createElement('div');
                    senderNameEl.style.fontSize = '11px';
                    senderNameEl.style.fontWeight = 'bold';
                    senderNameEl.style.color = '#6b7280';
                    senderNameEl.style.marginBottom = '4px';
                    senderNameEl.textContent = m.senderName + (m.senderPosition ? ' · ' + m.senderPosition : '');
                    bubble.appendChild(senderNameEl);
                }

                if (m.replyToText) {
                    const replyBlock = document.createElement('div');
                    replyBlock.className = 'message-reply-preview';
                    replyBlock.innerHTML = `<div class="reply-preview-label">Replying to ${escapeHtml(m.replyToSenderName || 'Unknown')}</div>
                                            <div class="reply-preview-text">${escapeHtml(m.replyToText)}</div>`;
                    bubble.appendChild(replyBlock);
                }
                const textBlock = document.createElement('div');
                textBlock.textContent = m.text || '';
                bubble.appendChild(textBlock);
                bubble.style.cursor = 'pointer';
                bubble.title = 'Click to reply';
                bubble.addEventListener('click', (event) => {
                    if (event.target.closest('a') || event.target.closest('img')) return;
                    setReplyTarget(m);
                });
                if (m.attachmentUrl) {
                    const isImage = (m.attachmentMime && m.attachmentMime.startsWith && m.attachmentMime.startsWith('image/'))
                        || /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(m.attachmentName || '');
                    if (isImage) {
                        const img = document.createElement('img');
                        img.src = m.attachmentUrl;
                        img.style.maxWidth = '320px';
                        img.style.maxHeight = '320px';
                        img.style.display = 'block';
                        img.style.marginTop = '8px';
                        img.style.borderRadius = '6px';
                        img.style.cursor = 'pointer';
                        img.addEventListener('click', () => window.open(m.attachmentUrl, '_blank'));
                        bubble.appendChild(img);
                    } else {
                        const a = document.createElement('a');
                        a.href = m.attachmentUrl;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = m.attachmentName || 'Attachment';
                        a.style.display = 'block';
                        a.style.marginTop = '8px';
                        bubble.appendChild(a);
                    }
                }
                const timeEl = document.createElement('div');
                timeEl.className = 'message-time';
                timeEl.textContent = m.time || '';
                el.appendChild(bubble);
                el.appendChild(timeEl);

                if (m.sent) {
                    const status = document.createElement('div');
                    status.style.fontSize = '12px';
                    status.style.color = '#6b7280';
                    status.style.marginLeft = '8px';
                    // show double-tick when read by recipient(s)
                    if (Array.isArray(m.readBy) && m.readBy.length > 0) status.textContent = '✓✓';
                    else status.textContent = '✓';
                    el.appendChild(status);
                }
                chatMessages.appendChild(el);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            return (text || '').replace(/[&<>"]+/g, function (s) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[s]; });
        }

        async function selectChat(contact) {
            clearReplyTarget();
            currentChat = contact;
            currentChat.unreadCount = 0;
            chatName.textContent = contact.name;
            chatStatus.textContent = contact.isGroup
                ? `Group chat · ${contact.membersCount || contacts.length - 1} members`
                : `${contact.title || ''}${contact.position ? ' · ' + contact.position : ''}`;
            chatAvatar.innerHTML = buildAvatar(contact);
            await fetchMessagesFor(contact);
            renderContacts(searchInput.value);
            renderMessages();
            messageInput.focus();
            startChatRefresh();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!currentChat) return;
            if (!text && !pendingAttachment?.url) return;

            const payload = {
                projectId: activeProjectId,
                content: text,
                isGroup: currentChat.isGroup,
                replyToMessageId: replyTarget?.id || null,
            };
            if (!currentChat.isGroup) {
                payload.recipientRole = currentChat.recipientRole;
                payload.recipientId = currentChat.recipientId;
            }

            if (pendingAttachment && pendingAttachment.url) {
                payload.attachmentUrl = pendingAttachment.url;
                payload.attachmentName = pendingAttachment.name || '';
                if (pendingAttachment.mime) payload.attachmentMime = pendingAttachment.mime;
            }

            const data = await apiRequest('/chat/messages', { method: 'POST', body: payload });
            if (!data) return;

            const returned = data.chatMessage || {};
            const messageTime = returned.created_at
                ? new Date(returned.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const message = {
                id: returned.id || `${Date.now()}-${Math.random()}`,
                text,
                sent: true,
                time: messageTime,
                attachmentUrl: pendingAttachment?.url || null,
                attachmentName: pendingAttachment?.name || null,
                attachmentMime: pendingAttachment?.mime || null,
                senderName: currentUserName,
                senderPosition: currentUserPosition,
                readBy: [currentUserId],
                replyToMessageId: replyTarget?.id || null,
                replyToText: replyTarget?.text || null,
                replyToSenderName: replyTarget?.senderName || currentUserName,
            };
            currentChat.messages.push(message);
            currentChat.lastMessage = text || (pendingAttachment?.name ? `Attachment: ${pendingAttachment.name}` : 'Sent a message');
            currentChat.time = messageTime;
            messageInput.value = '';
            pendingAttachment = null;
            clearReplyTarget();
            messageInput.placeholder = 'Type a message...';
            renderContacts(searchInput.value);
            renderMessages();
        }

        async function loadProjectContacts() {
            const data = await apiRequest(`/chat/conversations?projectId=${encodeURIComponent(activeProjectId)}`);
            if (!data || !data.success) {
                throw new Error(data?.error || 'Failed to load chat conversations');
            }

            const members = Array.isArray(data.members) ? data.members : [];
            const groupContact = {
                id: `group-${activeProjectId}`,
                name: activeProjectName ? `${activeProjectName} Group` : 'Project Group',
                email: 'group-chat@project.local',
                role: 'Project Group',
                title: 'Group conversation',
                position: '',
                pictureUrl: null,
                initial: 'G',
                online: true,
                isGroup: true,
                membersCount: data.group?.membersCount || members.length,
                lastMessage: data.group?.lastMessage || 'Group chat for the project',
                time: data.group?.time || '',
                sortAt: data.group?.lastAt || null,
                unreadCount: data.group?.unreadCount || 0,
                messages: [],
            };

            contacts = [
                groupContact,
                ...members
                    .filter(member => !(String(member.role_id) === String(currentUserId) && normalizeRole(member.role) === currentUserRole))
                    .map(normalizeMember)
            ];
            renderContacts();
            currentChat = contacts[0];
            try {
                await selectChat(currentChat);
            } catch (err) {
                console.error('Initial group messages load failed:', err);
                chatStatus.textContent = 'Some chat data failed to load; members are available.';
            }
        }

        backBtn.addEventListener('click', goBack);
        groupBtn.addEventListener('click', () => {
            const group = contacts.find(contact => contact.isGroup);
            if (group) selectChat(group);
        });
        attachBtn.addEventListener('click', () => attachmentInput.click());
        attachmentInput.addEventListener('change', async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            const fd = new FormData();
            fd.append('attachment', f);
            try {
                const res = await fetch(`${API_BASE}/api/upload-attachment`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken || localStorage.getItem('authToken')}` },
                    body: fd
                });
                const d = await res.json();
                if (d && d.url) {
                    pendingAttachment = { url: d.url, name: f.name, mime: f.type };
                    messageInput.placeholder = `Attached: ${f.name}`;
                } else {
                    alert('Attachment upload failed: ' + (d?.error || 'Unknown error'));
                }
            } catch (err) { console.error('Attach upload error', err); alert('Attachment upload failed: ' + err.message); }
        });
        sendBtn.addEventListener('click', sendMessage);
        cancelReplyBtn.addEventListener('click', clearReplyTarget);
        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        searchInput.addEventListener('input', (event) => renderContacts(event.target.value));

        loadProjectContacts().catch(err => {
            console.error('Failed to load chat contacts', err);
            chatStatus.textContent = 'Unable to load chat. Please refresh.';
        });
    </script>
</body>
</html>
