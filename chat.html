<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 360px;
            background: #ffffff;
            border-right: 1px solid #e6e9ee;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #e6e9ee;
        }

        .chat-title {
            font-size: 24px;
            font-weight: 700;
            color: #141414;
        }

        .project-label {
            margin-top: 4px;
            color: #5c6670;
            font-size: 13px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s, transform 0.2s;
        }

        .icon-btn:hover {
            background: #e8ebef;
            transform: translateY(-1px);
        }

        .search-box {
            padding: 14px 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dbe1e8;
            border-radius: 999px;
            outline: none;
            background: #f6f8fb;
            font-size: 14px;
            color: #212a33;
        }

        .search-input:focus {
            background: #ffffff;
            border-color: #b9c2cc;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            margin: 0 12px 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s;
            background: #ffffff;
        }

        .contact-item:hover {
            background: #f0f6ff;
        }

        .contact-item.active {
            background: #e8f2ff;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar.online::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #31a24c;
            border: 2px solid #ffffff;
            border-radius: 50%;
            bottom: 0;
            right: 0;
        }

        .contact-info {
            flex: 1;
            margin-left: 14px;
            min-width: 0;
        }

        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .contact-name {
            font-weight: 600;
            color: #121212;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: #828a94;
        }

        .contact-meta {
            font-size: 13px;
            color: #58606a;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .contact-message {
            font-size: 13px;
            color: #58606a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid #e6e9ee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .chat-header-info .avatar {
            width: 62px;
            height: 62px;
        }

        .chat-header-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            color: #33333b;
            font-size: 14px;
            white-space: nowrap;
        }

        .chat-name {
            font-size: 20px;
            font-weight: 700;
            color: #111111;
        }

        .chat-status {
            margin-top: 4px;
            font-size: 14px;
            color: #5f6570;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f7fb;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.22s ease-out;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            max-width: 70%;
            padding: 14px 16px;
            border-radius: 20px;
            word-wrap: break-word;
            font-size: 14.4px;
            line-height: 1.5;
            position: relative;
        }

        .message.received .message-bubble {
            background: #ffffff;
            border: 1px solid #e4e8ed;
            color: #141414;
        }

        .message.sent .message-bubble {
            background: #dcf8c6;
            color: #141414;
        }

        .message-time {
            font-size: 12px;
            color: #7c858f;
            margin-top: 6px;
            min-width: 50px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: #ffffff;
            border-top: 1px solid #e6e9ee;
        }

        .message-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f3f6f9;
            border-radius: 999px;
            padding: 12px 16px;
        }

        .message-input {
            flex: 1;
            border: none;
            background: none;
            outline: none;
            font-size: 15px;
            color: #22272b;
            font-family: inherit;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #25d366;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.04);
        }

        @media (max-width: 860px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #e6e9ee;
            }

            .chat-area {
                min-height: calc(100vh - 230px);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>
                <div class="chat-title">Project Chat</div>
                <div class="project-label" id="projectLabel">Loading project...</div>
            </div>
            <button class="icon-btn" id="backBtn" title="Back">←</button>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search teammates or group">
        </div>

        <div class="contacts-list" id="contactsList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="avatar online" id="chatAvatar">P</div>
                <div>
                    <div class="chat-name" id="chatName">Select a chat</div>
                    <div class="chat-status" id="chatStatus">Messages with project teammates appear here</div>
                </div>
            </div>
            <div class="chat-header-meta">
                <div id="currentUserLabel">Unknown user</div>
                <button class="icon-btn" id="groupBtn" title="Open group chat">👥</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <div class="message-input-wrapper">
                <input type="text" class="message-input" id="messageInput" placeholder="Type a message...">
            </div>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol.startsWith('http')
            ? window.location.origin
            : 'http://localhost:3000';

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('')));
            } catch (e) {
                console.error('JWT parse error:', e);
                return null;
            }
        }

        const authToken = localStorage.getItem('authToken');
        const activeProjectId = localStorage.getItem('activeProjectId');
        const activeProjectName = localStorage.getItem('activeProjectName');
        const redirectSource = sessionStorage.getItem('redirectSource');

        const routes = {
            'client-dashboard': 'client-dashboard.html',
            'contractor-dashboard': 'contractor-dashboard.html',
            'consultant-dashboard': 'consultant-dashboard.html',
            'client-project-manager': 'client-project-manager.html',
            'contractor-project-manager': 'contractor-project-manager.html',
            'consultant-project-manager': 'consultant-project-manager.html'
        };

        function goBack() {
            window.location.href = routes[redirectSource] || 'home.html';
        }

        if (!authToken) {
            window.location.href = 'home.html';
        }

        if (!activeProjectId) {
            goBack();
        }

        const jwt = parseJwt(authToken);
        const currentUserId = jwt ? Number(jwt.sub) : null;
        const currentUserRole = jwt?.role || 'Unknown role';
        const currentUserEmail = jwt?.email || jwt?.company_email || jwt?.companyEmail || '';
        const currentUserName = jwt?.representative || jwt?.name || currentUserEmail.split('@')[0] || 'You';

        const projectLabel = document.getElementById('projectLabel');
        const currentUserLabel = document.getElementById('currentUserLabel');
        const chatAvatar = document.getElementById('chatAvatar');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const contactsList = document.getElementById('contactsList');
        const searchInput = document.getElementById('searchInput');
        const backBtn = document.getElementById('backBtn');
        const groupBtn = document.getElementById('groupBtn');

        let currentChat = null;
        let contacts = [];

        projectLabel.textContent = activeProjectName
            ? `Project: ${activeProjectName}`
            : `Project ID: ${activeProjectId}`;

        currentUserLabel.textContent = `${currentUserName} · ${currentUserRole}`;

        function getInitialFromEmail(email) {
            return email ? email.trim().charAt(0).toUpperCase() : '?';
        }

        function buildAvatar(contact) {
            if (contact.pictureUrl) {
                return `<img src="${contact.pictureUrl}" alt="${contact.name || contact.email}">`;
            }
            return contact.initial || getInitialFromEmail(contact.email);
        }

        function createContactItem(contact) {
            const item = document.createElement('div');
            item.className = `contact-item ${currentChat?.id === contact.id ? 'active' : ''}`;
            item.innerHTML = `
                <div class="avatar ${contact.online ? 'online' : ''}">${buildAvatar(contact)}</div>
                <div class="contact-info">
                    <div class="contact-header">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-time">${contact.time || ''}</div>
                    </div>
                    <div class="contact-meta">${contact.title || ''} · ${contact.role}${contact.position ? ' · ' + contact.position : ''}</div>
                    <div class="contact-message">${contact.lastMessage || 'Tap to chat'}</div>
                </div>
            `;
            item.addEventListener('click', () => selectChat(contact));
            return item;
        }

        function renderContacts(filter = '') {
            contactsList.innerHTML = '';
            const normalizedFilter = filter.trim().toLowerCase();
            const visible = contacts.filter(contact => {
                if (!normalizedFilter) return true;
                return [contact.name, contact.role, contact.title, contact.position, contact.email, contact.lastMessage]
                    .filter(Boolean)
                    .some(text => text.toLowerCase().includes(normalizedFilter));
            });

            visible.forEach(contact => contactsList.appendChild(createContactItem(contact)));
            if (visible.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'contact-item';
                empty.innerHTML = '<div class="contact-info"><div class="contact-name">No matches found</div></div>';
                contactsList.appendChild(empty);
            }
        }

        async function apiRequest(path, options = {}) {
            const headers = { 'Authorization': `Bearer ${authToken}` };
            let body = null;
            if (options.body != null && !(options.body instanceof FormData)) {
                headers['Content-Type'] = 'application/json';
                body = JSON.stringify(options.body);
            } else {
                body = options.body;
            }

            const response = await fetch(path.startsWith('http') ? path : `${API_BASE}${path}`, {
                method: options.method || 'GET',
                headers,
                body,
            });
            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('authToken');
                window.location.href = 'home.html';
                return;
            }
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data?.error || 'Request failed');
            }
            return data;
        }

        function normalizeMember(member) {
            return {
                id: `${member.role}-${member.role_id}`,
                name: member.display_name || member.email || member.role,
                email: member.email || '',
                role: member.role,
                title: member.company_name || member.title || member.role,
                position: member.position || '',
                pictureUrl: member.profile_picture || null,
                initial: member.display_name ? member.display_name.trim().charAt(0).toUpperCase() : getInitialFromEmail(member.email),
                online: true,
                isGroup: false,
                recipientRole: member.role,
                recipientId: member.role_id,
                lastMessage: 'Tap to chat',
                time: '',
                messages: [],
            };
        }

        async function fetchMessagesFor(contact) {
            if (!contact) return;
            const endpoint = contact.isGroup
                ? `/chat/messages?projectId=${encodeURIComponent(activeProjectId)}&isGroup=true`
                : `/chat/messages?projectId=${encodeURIComponent(activeProjectId)}&recipientRole=${encodeURIComponent(contact.recipientRole)}&recipientId=${encodeURIComponent(contact.recipientId)}`;
            const data = await apiRequest(endpoint);
            if (!data) return;
            contact.messages = data.messages.map(message => ({
                text: message.content,
                sent: message.sender_role === currentUserRole && Number(message.sender_id) === currentUserId,
                time: new Date(message.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            }));
            if (contact.messages.length) {
                const last = contact.messages[contact.messages.length - 1];
                contact.lastMessage = last.text;
                contact.time = last.time;
            }
        }

        async function selectChat(contact) {
            currentChat = contact;
            chatName.textContent = contact.name;
            chatStatus.textContent = contact.isGroup
                ? `Group chat · ${contact.membersCount || contacts.length - 1} members`
                : `${contact.title || ''}${contact.position ? ' · ' + contact.position : ''}`;
            chatAvatar.innerHTML = buildAvatar(contact);
            await fetchMessagesFor(contact);
            renderContacts(searchInput.value);
            renderMessages();
            messageInput.focus();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChat) return;

            const payload = {
                projectId: activeProjectId,
                content: text,
                isGroup: currentChat.isGroup,
            };
            if (!currentChat.isGroup) {
                payload.recipientRole = currentChat.recipientRole;
                payload.recipientId = currentChat.recipientId;
            }

            const data = await apiRequest('/chat/messages', { method: 'POST', body: payload });
            if (!data) return;

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const message = { text, sent: true, time: now };
            currentChat.messages.push(message);
            currentChat.lastMessage = text;
            currentChat.time = now;
            messageInput.value = '';
            renderContacts(searchInput.value);
            renderMessages();
        }

        async function loadProjectContacts() {
            const data = await apiRequest(`/chat/members?projectId=${encodeURIComponent(activeProjectId)}`);
            if (!data) return;

            const groupContact = {
                id: `group-${activeProjectId}`,
                name: activeProjectName ? `${activeProjectName} Group` : 'Project Group',
                email: 'group-chat@project.local',
                role: 'Project Group',
                title: 'Group conversation',
                position: '',
                pictureUrl: null,
                initial: 'G',
                online: true,
                isGroup: true,
                membersCount: data.members.length,
                lastMessage: 'Group chat for the project',
                time: '',
                messages: [],
            };

            contacts = [groupContact, ...data.members.map(normalizeMember)];
            currentChat = contacts[0];
            await selectChat(currentChat);
            renderContacts();
        }

        backBtn.addEventListener('click', goBack);
        groupBtn.addEventListener('click', () => {
            const group = contacts.find(contact => contact.isGroup);
            if (group) selectChat(group);
        });
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        searchInput.addEventListener('input', (event) => renderContacts(event.target.value));

        loadProjectContacts().catch(err => {
            console.error('Failed to load chat contacts', err);
            chatStatus.textContent = 'Unable to load chat. Please refresh.';
        });
    </script>
</body>
</html>
