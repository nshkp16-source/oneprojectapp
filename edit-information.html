<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Information</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #007B8A;
      --teal-light: #e0f4f6;
      --teal-dark:  #005f6b;
      --blue:       #2563eb;
      --blue-light: #dbeafe;
      --red:        #dc2626;
      --red-light:  #fee2e2;
      --green:      #16a34a;
      --green-light:#dcfce7;
      --orange:     #d97706;
      --orange-light:#fef3c7;
      --purple:     #7c3aed;
      --purple-light:#ede9fe;
      --gray-50:    #f9fafb;
      --gray-100:   #f3f4f6;
      --gray-200:   #e5e7eb;
      --gray-300:   #d1d5db;
      --gray-500:   #6b7280;
      --gray-700:   #374151;
      --gray-900:   #111827;
      --white:      #ffffff;
      --radius:     10px;
      --shadow:     0 2px 8px rgba(0,0,0,0.08);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.12);
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #eef2f7;
      min-height: 100vh;
      color: var(--gray-900);
    }

    /* ── Loading bar ── */
    #loadingBar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--teal); transition: width 0.8s ease; z-index: 400;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 40px; height: 40px; min-width: 40px;
      border-radius: 50%;
      background: var(--teal); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
      background-size: cover; background-position: center;
    }
    .topbar-meta { flex: 1; min-width: 0; }
    .topbar-meta strong { display: block; font-size: 13px; color: var(--gray-900); }
    .topbar-meta span   { font-size: 12px; color: var(--gray-500); }
    .role-pill {
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; white-space: nowrap;
      background: var(--teal-light); color: var(--teal-dark);
    }
    #backBtn {
      padding: 7px 14px; border-radius: 7px;
      border: 1px solid var(--gray-300);
      background: var(--gray-50); color: var(--gray-700);
      font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: background .15s;
    }
    #backBtn:hover { background: var(--gray-200); }

    /* ── Page layout ── */
    .page { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── Category card ── */
    .cat-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }
    .cat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      border-bottom: 2px solid var(--gray-100);
      cursor: pointer; user-select: none;
    }
    .cat-header:hover { background: var(--gray-50); }
    .cat-icon { font-size: 20px; }
    .cat-title {
      flex: 1; font-size: 15px; font-weight: 700; color: var(--gray-900);
    }
    .cat-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; padding: 2px 8px; border-radius: 20px;
    }
    .badge-project    { background: #e0f2fe; color: #0369a1; }
    .badge-client     { background: var(--blue-light); color: #1d4ed8; }
    .badge-contractor { background: var(--orange-light); color: #92400e; }
    .badge-consultant { background: var(--purple-light); color: #5b21b6; }

    .cat-chevron {
      font-size: 14px; color: var(--gray-500);
      transition: transform .2s;
    }
    .cat-card.open .cat-chevron { transform: rotate(180deg); }

    .cat-body { display: none; }
    .cat-card.open .cat-body { display: block; }

    /* ── Entity block inside a category ── */
    .entity-block {
      border-bottom: 1px solid var(--gray-100);
      padding: 14px 18px 18px;
    }
    .entity-block:last-child { border-bottom: none; }

    .entity-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px;
    }
    .entity-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--gray-500);
      flex: 1;
    }
    .entity-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Field grid ── */
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 540px) { .fields { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 3px; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--gray-500);
    }
    .field .val {
      font-size: 14px; color: var(--gray-900);
      background: var(--gray-100);
      border-radius: 6px; padding: 8px 10px;
      min-height: 36px; word-break: break-all;
    }
    .field .val.empty { color: var(--gray-300); }
    .field input, .field textarea {
      font-size: 14px; color: var(--gray-900);
      background: var(--gray-50);
      border: 1px solid var(--gray-300);
      border-radius: 6px; padding: 8px 10px;
      min-height: 36px; width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus, .field textarea:focus {
      outline: none; border-color: var(--teal);
      box-shadow: 0 0 0 2px rgba(0,123,138,.15);
      background: var(--white);
    }

    /* ── Inline edit form footer ── */
    .edit-footer {
      display: flex; gap: 8px; margin-top: 12px;
    }

    /* ── Buttons ── */
    .btn {
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 6px;
      border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      transition: opacity .15s, background .15s;
      white-space: nowrap;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-edit    { background: var(--blue);   color: #fff; }
    .btn-save    { background: var(--green);  color: #fff; }
    .btn-cancel  { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-danger  { background: var(--red);    color: #fff; }
    .btn-sm      { font-size: 11px; padding: 4px 9px; }

    /* ── Team member rows ── */
    .member-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .member-row {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      overflow: hidden;
    }
    .member-row-top {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
    }
    .member-dot {
      width: 32px; height: 32px; min-width: 32px;
      border-radius: 50%; background: var(--gray-200);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--gray-500);
    }
    .member-info { flex: 1; min-width: 0; }
    .member-info strong { font-size: 13px; display: block; }
    .member-info span   { font-size: 12px; color: var(--gray-500); display: block; }
    .member-btns { display: flex; gap: 5px; flex-shrink: 0; }

    /* Inline member edit form */
    .member-edit-form {
      border-top: 1px solid var(--gray-200);
      background: #fafbfd;
      padding: 12px;
      display: none;
    }
    .member-edit-form.open { display: block; }
    .member-edit-form .fields { margin-bottom: 10px; }

    /* ── Empty state ── */
    .empty { padding: 14px 0; font-size: 13px; color: var(--gray-500); text-align: center; }

    /* ── No party banner ── */
    .no-party {
      padding: 16px 18px;
      font-size: 13px; color: var(--gray-500);
      display: flex; align-items: center; gap: 8px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 11px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      box-shadow: var(--shadow-md); z-index: 999;
      max-width: 90vw; text-align: center;
      display: none; white-space: nowrap;
    }
    #toast.show    { display: block; }
    #toast.success { background: var(--green-light);  color: #166534; border: 1px solid #bbf7d0; }
    #toast.error   { background: var(--red-light);    color: #991b1b; border: 1px solid #fecaca; }
    #toast.info    { background: var(--teal-light);   color: var(--teal-dark); border: 1px solid #a5f3fc; }

    /* ── Confirm modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 500; display: none;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 12px;
      padding: 24px 22px; max-width: 380px; width: 100%;
      box-shadow: var(--shadow-md);
    }
    .modal h4 { font-size: 16px; margin-bottom: 8px; }
    .modal p  { font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 18px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    @media (max-width: 480px) {
      .page { padding: 14px 10px 60px; }
      .topbar { padding: 10px 12px; }
    }
  </style>
</head>
<body>
<div id="loadingBar"></div>

<!-- Top bar -->
<div class="topbar">
  <div class="avatar" id="topAvatar"></div>
  <div class="topbar-meta">
    <strong id="topEmail">Loading…</strong>
    <span id="topProject">—</span>
  </div>
  <span class="role-pill" id="topRole">—</span>
  <button id="backBtn">&#8592; Back</button>
</div>

<div class="page">

  <!-- ═══════════════════════════════════════════════
       CATEGORY 1 · PROJECT INFORMATION
  ════════════════════════════════════════════════ -->
  <div class="cat-card open" id="catProject">
    <div class="cat-header" onclick="toggleCat('catProject')">
      <span class="cat-icon">🏗️</span>
      <span class="cat-title">Project Information</span>
      <span class="cat-badge badge-project">Project</span>
      <span class="cat-chevron">▼</span>
    </div>
    <div class="cat-body">
      <div class="entity-block" id="ebProject">
        <!-- rendered by renderProjectEntity() -->
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       CATEGORY 2 · CLIENT SIDE
  ════════════════════════════════════════════════ -->
  <div class="cat-card open" id="catClient">
    <div class="cat-header" onclick="toggleCat('catClient')">
      <span class="cat-icon">🏢</span>
      <span class="cat-title">Client Side</span>
      <span class="cat-badge badge-client">Client</span>
      <span class="cat-chevron">▼</span>
    </div>
    <div class="cat-body">
      <!-- Client company -->
      <div class="entity-block" id="ebClientCompany"></div>
      <!-- Client PM -->
      <div class="entity-block" id="ebClientPM"></div>
      <!-- Client Team Members -->
      <div class="entity-block" id="ebClientTeam"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       CATEGORY 3 · CONTRACTOR SIDE
  ════════════════════════════════════════════════ -->
  <div class="cat-card open" id="catContractor">
    <div class="cat-header" onclick="toggleCat('catContractor')">
      <span class="cat-icon">🔧</span>
      <span class="cat-title">Contractor Side</span>
      <span class="cat-badge badge-contractor">Contractor</span>
      <span class="cat-chevron">▼</span>
    </div>
    <div class="cat-body">
      <div class="entity-block" id="ebContractorCompany"></div>
      <div class="entity-block" id="ebContractorPM"></div>
      <div class="entity-block" id="ebContractorTeam"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       CATEGORY 4 · CONSULTANT SIDE
  ════════════════════════════════════════════════ -->
  <div class="cat-card open" id="catConsultant">
    <div class="cat-header" onclick="toggleCat('catConsultant')">
      <span class="cat-icon">📐</span>
      <span class="cat-title">Consultant Side</span>
      <span class="cat-badge badge-consultant">Consultant</span>
      <span class="cat-chevron">▼</span>
    </div>
    <div class="cat-body">
      <div class="entity-block" id="ebConsultantCompany"></div>
      <div class="entity-block" id="ebConsultantPM"></div>
      <div class="entity-block" id="ebConsultantTeam"></div>
    </div>
  </div>

</div><!-- /page -->

<div id="toast"></div>

<!-- Confirm modal -->
<div class="modal-backdrop" id="confirmModal">
  <div class="modal">
    <h4 id="modalTitle">Confirm</h4>
    <p  id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="modalOk">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG & STATE
═══════════════════════════════════════════════════════════ */
const API = 'https://oneprojectapp-backend.onrender.com';

let currentRole  = '';
let currentEmail = '';
let currentId    = 0;
let projectId    = '';
let projectData  = null;
let modalCb      = null;

/* ═══════════════════════════════════════════════════════════
   ROLE HELPERS  (mirrors server.js exactly)
═══════════════════════════════════════════════════════════ */
function normalizeRole(r) {
  if (!r) return r;
  return ({
    Client:'Client', Contractor:'Contractor', Consultant:'Consultant',
    ClientPM:'ClientPM', 'Client Project Manager':'ClientPM',
    ContractorPM:'ContractorPM', 'Contractor Project Manager':'ContractorPM',
    ConsultantPM:'ConsultantPM', 'Consultant Project Manager':'ConsultantPM',
    TeamMember:'TeamMember', 'Team Member':'TeamMember',
  })[r] || r;
}

function getSide(role) {
  const n = normalizeRole(role);
  if (n === 'Contractor' || n === 'ContractorPM') return 'contractor';
  if (n === 'Consultant' || n === 'ConsultantPM') return 'consultant';
  if (n === 'Client'     || n === 'ClientPM')     return 'client';
  return null;
}

// Is this role a "leader" (can manage their own side)?
function isLeader(role) {
  return ['Client','Contractor','Consultant'].includes(normalizeRole(role));
}
// Is this role a PM?
function isPM(role) {
  return ['ClientPM','ContractorPM','ConsultantPM'].includes(normalizeRole(role));
}
// Client-side roles (Client OR ClientPM)
function isClientSide(role) {
  return getSide(role) === 'client';
}
// Is the viewer a TeamMember?
function isTeamMember(role) {
  return normalizeRole(role) === 'TeamMember';
}

/* ── Permission helpers ────────────────────────────── */

// Can edit the project base fields?
function canEditProject() {
  return isClientSide(currentRole);
}

// Can edit a party's company block (client/contractor/consultant)?
// Leaders only — PMs cannot edit the company block.
function canEditCompany(side) {
  const n = normalizeRole(currentRole);
  if (isTeamMember(currentRole)) return false;
  // Client leader can edit client company; client PM cannot
  if (side === 'client')     return n === 'Client';
  if (side === 'contractor') return n === 'Contractor';
  if (side === 'consultant') return n === 'Consultant';
  return false;
}

// Can delete a full party (contractor / consultant)?  Client only.
function canDeleteParty(side) {
  return normalizeRole(currentRole) === 'Client' && side !== 'client';
}

// Can edit a PM block?
// Same-side leader can edit any PM on their side.
// PM can edit their OWN block.
// Client leader can edit any PM.
function canEditPM(side) {
  const n = normalizeRole(currentRole);
  if (isTeamMember(currentRole)) return false;
  if (n === 'Client') return true;              // client leader manages all PMs
  if (getSide(currentRole) === side) return true; // same-side leader or PM
  return false;
}

// Can remove a PM?  Same rules as edit.
function canRemovePM(side) { return canEditPM(side); }

// Can edit a specific team member row?
// Client side (leader or PM) can edit any team member on any side.
// Same-side leader or PM can edit members on their side.
// TeamMember cannot edit others.
function canManageTeamMember(memberSide) {
  if (isTeamMember(currentRole)) return false;
  const userSide = getSide(currentRole);
  if (userSide === 'client') return true;           // client side manages all
  return userSide === memberSide;                   // same side only
}

/* ═══════════════════════════════════════════════════════════
   JWT / LOADING / TOAST / MODAL
═══════════════════════════════════════════════════════════ */
function parseJwt(token) {
  try {
    return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
  } catch { return null; }
}

function showLoad() { document.getElementById('loadingBar').style.width = '90%'; }
function hideLoad() { document.getElementById('loadingBar').style.width = '0'; }

let toastTimer;
function toast(msg, type = 'info', dur = 3200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', dur);
}

function openModal(title, body, cb, label = 'Confirm') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent  = body;
  document.getElementById('modalOk').textContent    = label;
  modalCb = cb;
  document.getElementById('confirmModal').classList.add('open');
}
function closeModal() {
  document.getElementById('confirmModal').classList.remove('open');
  modalCb = null;
}
document.getElementById('modalOk').addEventListener('click', () => {
  if (modalCb) { modalCb(); closeModal(); }
});

/* ═══════════════════════════════════════════════════════════
   AUTH FETCH
═══════════════════════════════════════════════════════════ */
async function authFetch(url, opts = {}) {
  const token = localStorage.getItem('authToken');
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(url, { ...opts, headers });
}

/* ═══════════════════════════════════════════════════════════
   ACCORDION
═══════════════════════════════════════════════════════════ */
function toggleCat(id) {
  document.getElementById(id).classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
  const token   = localStorage.getItem('authToken');
  const decoded = parseJwt(token);

  currentRole  = normalizeRole(localStorage.getItem('verifiedRole')  || decoded?.role || '');
  currentEmail = localStorage.getItem('verifiedEmail') || decoded?.companyEmail || decoded?.email || '';
  currentId    = decoded ? parseInt(decoded.sub, 10) : 0;
  projectId    = localStorage.getItem('activeProjectId') || '';

  document.getElementById('topEmail').textContent   = currentEmail || '—';
  document.getElementById('topProject').textContent = localStorage.getItem('activeProjectName') || '—';
  document.getElementById('topRole').textContent    = currentRole || '—';

  // Avatar
  try {
    const res  = await fetch(`${API}/client/profile-picture`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail })
    });
    const data = await res.json();
    const av   = document.getElementById('topAvatar');
    if (data.success && data.profile_picture) {
      av.style.backgroundImage = `url("${data.profile_picture}")`;
      av.textContent = '';
    } else {
      av.textContent = (currentEmail || '?').charAt(0).toUpperCase();
    }
  } catch {
    document.getElementById('topAvatar').textContent = (currentEmail || '?').charAt(0).toUpperCase();
  }

  document.getElementById('backBtn').addEventListener('click', navigateBack);

  if (!projectId) {
    toast('No active project found.', 'error'); return;
  }
  await loadProjectData();
});

/* ═══════════════════════════════════════════════════════════
   BACK NAVIGATION
═══════════════════════════════════════════════════════════ */
function navigateBack() {
  const source = sessionStorage.getItem('redirectSource');
  const routes = {
    'client-dashboard':           'client-dashboard.html',
    'contractor-dashboard':       'contractor-dashboard.html',
    'consultant-dashboard':       'consultant-dashboard.html',
    'client-project-manager':     'client-project-manager.html',
    'contractor-project-manager': 'contractor-project-manager.html',
    'consultant-project-manager': 'consultant-project-manager.html',
    'team-members-dashboard':     'team-members-dashboard.html',
  };
  window.location.href = routes[source] || 'home.html';
}

/* ═══════════════════════════════════════════════════════════
   LOAD DATA
═══════════════════════════════════════════════════════════ */
async function loadProjectData() {
  showLoad();
  try {
    const res  = await authFetch(`${API}/api/project-info/${projectId}`);
    const data = await res.json();
    hideLoad();
    if (!res.ok || !data.success) {
      toast(data.error || 'Failed to load project data.', 'error'); return;
    }
    projectData = data.project;
    renderAll();
  } catch (err) {
    hideLoad();
    console.error(err);
    toast('Server error loading project.', 'error');
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════════════════════════ */
function renderAll() {
  if (!projectData) return;
  renderProjectEntity();
  renderClientCompany();
  renderPM('client', projectData.client_pm);
  renderTeamSection('client');
  renderCompany('contractor', projectData.contractor);
  renderPM('contractor', projectData.contractor_pm);
  renderTeamSection('contractor');
  renderCompany('consultant', projectData.consultant);
  renderPM('consultant', projectData.consultant_pm);
  renderTeamSection('consultant');
}

/* ═══════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
                        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Render a read-only field
function vf(label, val) {
  const empty = !val;
  return `<div class="field">
    <label>${label}</label>
    <div class="val${empty ? ' empty' : ''}">${esc(val) || '—'}</div>
  </div>`;
}
// Render an input field
function inf(label, id, val, type = 'text') {
  return `<div class="field">
    <label>${label}</label>
    <input type="${type}" id="${id}" value="${esc(val || '')}" />
  </div>`;
}

function mkBtn(label, cls, fn) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.innerHTML = label;
  b.onclick = fn;
  return b;
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY 1 · PROJECT INFORMATION
═══════════════════════════════════════════════════════════ */
function renderProjectEntity() {
  const el  = document.getElementById('ebProject');
  const p   = projectData;

  let actionsHTML = '';
  if (canEditProject()) {
    actionsHTML = `<button class="btn btn-edit btn-sm" onclick="startEditProject()">✏️ Edit</button>`;
  }

  el.innerHTML = `
    <div class="entity-header">
      <span class="entity-label">Project Details</span>
      <div class="entity-actions">${actionsHTML}</div>
    </div>
    <div class="fields" id="projectFields">
      ${vf('Project Name',       p.name)}
      ${vf('Location',           p.location)}
      ${vf('Contract Reference', p.contract_reference)}
      ${vf('Created',            p.created_at ? new Date(p.created_at).toLocaleDateString() : '')}
    </div>
    <div id="projectEditForm" style="display:none;margin-top:12px;">
      <div class="fields">
        ${inf('Project Name',       'ep_name',     p.name)}
        ${inf('Location',           'ep_location', p.location)}
        ${inf('Contract Reference', 'ep_contract', p.contract_reference)}
      </div>
      <div class="edit-footer">
        <button class="btn btn-save" onclick="saveProject()">💾 Save</button>
        <button class="btn btn-cancel" onclick="cancelEditProject()">Cancel</button>
      </div>
    </div>
  `;
}

function startEditProject() {
  document.getElementById('projectFields').style.display  = 'none';
  document.getElementById('projectEditForm').style.display = '';
  // Sync current values to inputs (re-render already sets them)
}
function cancelEditProject() {
  document.getElementById('projectFields').style.display  = '';
  document.getElementById('projectEditForm').style.display = 'none';
}

async function saveProject() {
  const body = {
    projectId,
    name:               document.getElementById('ep_name').value.trim(),
    location:           document.getElementById('ep_location').value.trim(),
    contract_reference: document.getElementById('ep_contract').value.trim(),
  };
  if (!body.name || !body.location || !body.contract_reference) {
    toast('All project fields are required.', 'error'); return;
  }
  showLoad();
  try {
    const res  = await authFetch(`${API}/api/project-edit`, { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    hideLoad();
    if (data.success) {
      projectData.name               = body.name;
      projectData.location           = body.location;
      projectData.contract_reference = body.contract_reference;
      localStorage.setItem('activeProjectName', body.name);
      document.getElementById('topProject').textContent = body.name;
      toast('Project info updated.', 'success');
      renderProjectEntity();
    } else { toast(data.error || 'Update failed.', 'error'); }
  } catch { hideLoad(); toast('Server error.', 'error'); }
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY 2 · CLIENT COMPANY
═══════════════════════════════════════════════════════════ */
function renderClientCompany() {
  const el = document.getElementById('ebClientCompany');
  const c  = projectData.client;
  if (!c) { el.innerHTML = `<div class="no-party">⚠️ No client data found.</div>`; return; }

  let actionsHTML = '';
  if (canEditCompany('client')) {
    actionsHTML = `<button class="btn btn-edit btn-sm" onclick="startEditCompany('client')">✏️ Edit</button>`;
  }

  el.innerHTML = `
    <div class="entity-header">
      <span class="entity-label">Client Company</span>
      <div class="entity-actions">${actionsHTML}</div>
    </div>
    <div class="fields" id="clientCompanyFields">
      ${vf('Company Name',   c.company_name)}
      ${vf('Email',          c.email)}
      ${vf('Telephone',      c.telephone)}
      ${vf('Representative', c.representative)}
      ${vf('Title',          c.title)}
    </div>
    <div id="clientCompanyEditForm" style="display:none;margin-top:12px;">
      <div class="fields">
        ${inf('Company Name',   'ecc_co',  c.company_name)}
        <div class="field"><label>Email</label><div class="val">${esc(c.email)}</div></div>
        ${inf('Telephone',      'ecc_tel', c.telephone, 'tel')}
        ${inf('Representative', 'ecc_rep', c.representative)}
        ${inf('Title',          'ecc_title', c.title)}
      </div>
      <div class="edit-footer">
        <button class="btn btn-save" onclick="saveCompany('client')">💾 Save</button>
        <button class="btn btn-cancel" onclick="cancelEditCompany('client')">Cancel</button>
      </div>
    </div>
  `;
}

/* ─── Generic company (contractor / consultant) ─── */
function renderCompany(side, data) {
  const elId = `eb${cap(side)}Company`;
  const el   = document.getElementById(elId);
  if (!data) {
    el.innerHTML = `<div class="no-party">⚠️ No ${side} assigned to this project.</div>`;
    // Client can see delete is moot since there's nothing; skip
    return;
  }

  let actionsHTML = '';
  if (canEditCompany(side)) {
    actionsHTML += `<button class="btn btn-edit btn-sm" onclick="startEditCompany('${side}')">✏️ Edit</button>`;
  }
  if (canDeleteParty(side)) {
    actionsHTML += `<button class="btn btn-danger btn-sm" onclick="deleteParty('${side}')">🗑️ Remove ${cap(side)}</button>`;
  }

  el.innerHTML = `
    <div class="entity-header">
      <span class="entity-label">${cap(side)} Company</span>
      <div class="entity-actions">${actionsHTML}</div>
    </div>
    <div class="fields" id="${side}CompanyFields">
      ${vf('Company Name',     data.company_name)}
      ${vf('Email',            data.email)}
      ${vf('Telephone',        data.telephone)}
      ${vf('Representative',   data.representative)}
      ${vf('Position / Title', data.title_position)}
      ${vf('Task',             data.task)}
    </div>
    <div id="${side}CompanyEditForm" style="display:none;margin-top:12px;">
      <div class="fields">
        ${inf('Company Name',     `ec_${side}_co`,    data.company_name)}
        ${inf('Email',            `ec_${side}_em`,    data.email, 'email')}
        ${inf('Telephone',        `ec_${side}_tel`,   data.telephone, 'tel')}
        ${inf('Representative',   `ec_${side}_rep`,   data.representative)}
        ${inf('Position / Title', `ec_${side}_pos`,   data.title_position)}
        ${inf('Task',             `ec_${side}_task`,  data.task)}
      </div>
      <div class="edit-footer">
        <button class="btn btn-save" onclick="saveCompany('${side}')">💾 Save</button>
        <button class="btn btn-cancel" onclick="cancelEditCompany('${side}')">Cancel</button>
      </div>
    </div>
  `;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function startEditCompany(side) {
  document.getElementById(`${side === 'client' ? 'client' : side}CompanyFields`).style.display      = 'none';
  document.getElementById(`${side === 'client' ? 'client' : side}CompanyEditForm`).style.display    = '';
}
function cancelEditCompany(side) {
  document.getElementById(`${side === 'client' ? 'client' : side}CompanyFields`).style.display      = '';
  document.getElementById(`${side === 'client' ? 'client' : side}CompanyEditForm`).style.display    = 'none';
}

async function saveCompany(side) {
  let body;
  if (side === 'client') {
    body = {
      projectId, side,
      company_name:   document.getElementById('ecc_co').value.trim(),
      telephone:      document.getElementById('ecc_tel').value.trim(),
      representative: document.getElementById('ecc_rep').value.trim(),
      title_position: document.getElementById('ecc_title').value.trim(),
      email:          projectData.client.email, // read-only
    };
  } else {
    body = {
      projectId, side,
      company_name:   document.getElementById(`ec_${side}_co`).value.trim(),
      email:          document.getElementById(`ec_${side}_em`).value.trim(),
      telephone:      document.getElementById(`ec_${side}_tel`).value.trim(),
      representative: document.getElementById(`ec_${side}_rep`).value.trim(),
      title_position: document.getElementById(`ec_${side}_pos`).value.trim(),
      task:           document.getElementById(`ec_${side}_task`).value.trim(),
    };
  }
  if (!body.company_name || !body.representative) {
    toast('Company name and representative are required.', 'error'); return;
  }
  showLoad();
  try {
    const res  = await authFetch(`${API}/api/project-edit-party`, { method: 'POST', body: JSON.stringify(body) });
    const data = await res.json();
    hideLoad();
    if (data.success) {
      // Patch local cache
      if (side === 'client') {
        projectData.client = { ...projectData.client, company_name: body.company_name, telephone: body.telephone, representative: body.representative, title: body.title_position };
        renderClientCompany();
      } else {
        projectData[side] = { ...projectData[side], ...body };
        renderCompany(side, projectData[side]);
      }
      toast(`${cap(side)} info updated.`, 'success');
    } else { toast(data.error || 'Update failed.', 'error'); }
  } catch { hideLoad(); toast('Server error.', 'error'); }
}

async function deleteParty(side) {
  openModal(
    `Remove ${cap(side)}?`,
    `This permanently removes the ${side} and their PM from this project. This cannot be undone.`,
    async () => {
      showLoad();
      try {
        const res  = await authFetch(`${API}/api/project-delete-party`, {
          method: 'POST', body: JSON.stringify({ projectId, side })
        });
        const data = await res.json();
        hideLoad();
        if (data.success) {
          projectData[side]          = null;
          projectData[side + '_pm']  = null;
          toast(`${cap(side)} removed.`, 'success');
          renderCompany(side, null);
          renderPM(side, null);
          renderTeamSection(side);
        } else { toast(data.error || 'Delete failed.', 'error'); }
      } catch { hideLoad(); toast('Server error.', 'error'); }
    },
    `Remove ${cap(side)}`
  );
}

/* ═══════════════════════════════════════════════════════════
   PM BLOCKS
═══════════════════════════════════════════════════════════ */
function renderPM(side, pm) {
  const elMap = { client: 'ebClientPM', contractor: 'ebContractorPM', consultant: 'ebConsultantPM' };
  const el    = document.getElementById(elMap[side]);
  if (!el) return;

  const labelMap = { client: 'Client Project Manager', contractor: 'Contractor Project Manager', consultant: 'Consultant Project Manager' };

  if (!pm) {
    // Show placeholder only if the user has permission to add a PM here
    if (canEditPM(side)) {
      el.innerHTML = `
        <div class="entity-header">
          <span class="entity-label">${labelMap[side]}</span>
          <div class="entity-actions">
            <button class="btn btn-edit btn-sm" onclick="openAddPM('${side}')">➕ Add PM</button>
          </div>
        </div>
        <div class="empty">No project manager assigned.</div>
        <div id="${side}PMEditForm" style="display:none;margin-top:12px;">
          ${pmFormHTML(side, {})}
        </div>
      `;
    } else {
      el.innerHTML = `
        <div class="entity-header"><span class="entity-label">${labelMap[side]}</span></div>
        <div class="empty">No project manager assigned.</div>
      `;
    }
    return;
  }

  let actionsHTML = '';
  if (canEditPM(side)) {
    actionsHTML += `<button class="btn btn-edit btn-sm" onclick="startEditPM('${side}')">✏️ Edit</button>`;
  }
  if (canRemovePM(side)) {
    actionsHTML += `<button class="btn btn-danger btn-sm" onclick="removePM('${side}')">⛔ Remove</button>`;
  }

  el.innerHTML = `
    <div class="entity-header">
      <span class="entity-label">${labelMap[side]}</span>
      <div class="entity-actions">${actionsHTML}</div>
    </div>
    <div class="fields" id="${side}PMFields">
      ${vf('Name',      pm.name)}
      ${vf('Email',     pm.email)}
      ${vf('Telephone', pm.telephone)}
      ${vf('Task',      pm.task)}
    </div>
    <div id="${side}PMEditForm" style="display:none;margin-top:12px;">
      ${pmFormHTML(side, pm)}
    </div>
  `;
}

function pmFormHTML(side, pm) {
  return `
    <div class="fields">
      ${inf('Name',      `pm_${side}_name`,  pm.name)}
      ${inf('Email',     `pm_${side}_email`, pm.email, 'email')}
      ${inf('Telephone', `pm_${side}_tel`,   pm.telephone, 'tel')}
      ${inf('Task',      `pm_${side}_task`,  pm.task)}
    </div>
    <div class="edit-footer">
      <button class="btn btn-save" onclick="savePM('${side}')">💾 Save</button>
      <button class="btn btn-cancel" onclick="cancelEditPM('${side}')">Cancel</button>
    </div>
  `;
}

function startEditPM(side) {
  document.getElementById(`${side}PMFields`).style.display   = 'none';
  document.getElementById(`${side}PMEditForm`).style.display = '';
}
function cancelEditPM(side) {
  document.getElementById(`${side}PMFields`).style.display   = '';
  document.getElementById(`${side}PMEditForm`).style.display = 'none';
}
function openAddPM(side) {
  document.getElementById(`${side}PMEditForm`).style.display = '';
}

async function savePM(side) {
  const name  = document.getElementById(`pm_${side}_name`)?.value.trim();
  const email = document.getElementById(`pm_${side}_email`)?.value.trim();
  const tel   = document.getElementById(`pm_${side}_tel`)?.value.trim();
  const task  = document.getElementById(`pm_${side}_task`)?.value.trim();
  if (!name || !email || !task) { toast('Name, email and task are required.', 'error'); return; }
  showLoad();
  try {
    const res  = await authFetch(`${API}/api/project-replace-pm`, {
      method: 'POST',
      body: JSON.stringify({ projectId, side, name, email, telephone: tel || null, task })
    });
    const data = await res.json();
    hideLoad();
    if (data.success) {
      projectData[side + '_pm'] = { name, email, telephone: tel || null, task };
      toast(`${cap(side)} PM updated.`, 'success');
      renderPM(side, projectData[side + '_pm']);
    } else { toast(data.error || 'Save failed.', 'error'); }
  } catch { hideLoad(); toast('Server error.', 'error'); }
}

async function removePM(side) {
  openModal(
    `Remove ${cap(side)} PM?`,
    `The ${side} project manager will be removed from this project.`,
    async () => {
      showLoad();
      try {
        const res  = await authFetch(`${API}/api/project-remove-pm`, {
          method: 'POST', body: JSON.stringify({ projectId, side })
        });
        const data = await res.json();
        hideLoad();
        if (data.success) {
          projectData[side + '_pm'] = null;
          toast(`${cap(side)} PM removed.`, 'success');
          renderPM(side, null);
        } else { toast(data.error || 'Remove failed.', 'error'); }
      } catch { hideLoad(); toast('Server error.', 'error'); }
    },
    'Remove PM'
  );
}

/* ═══════════════════════════════════════════════════════════
   TEAM MEMBER SECTIONS
═══════════════════════════════════════════════════════════ */
function renderTeamSection(side) {
  const elMap = { client: 'ebClientTeam', contractor: 'ebContractorTeam', consultant: 'ebConsultantTeam' };
  const el    = document.getElementById(elMap[side]);
  if (!el) return;

  const members = (projectData.team_members || []).filter(
    m => (m.assigned_part || '').toLowerCase() === side
  );

  el.innerHTML = `
    <div class="entity-header">
      <span class="entity-label">Team Members · ${cap(side)} Side (${members.length})</span>
    </div>
  `;

  if (!members.length) {
    el.innerHTML += `<div class="empty">No team members assigned to this side.</div>`;
    return;
  }

  const list = document.createElement('div');
  list.className = 'member-list';

  members.forEach(m => {
    const isSelf       = isTeamMember(currentRole) && currentEmail.toLowerCase() === (m.email || '').toLowerCase();
    const canManage    = canManageTeamMember(side);
    const memberSide   = (m.assigned_part || '').toLowerCase();

    const row = document.createElement('div');
    row.className = 'member-row';
    row.id = `mrow_${m.id}`;

    // Buttons: canManage users see Edit + Remove; team members only see Leave (self)
    let btnHTML = '';
    if (canManage) {
      btnHTML = `
        <button class="btn btn-edit btn-sm" onclick="toggleMemberEdit(${m.id})">✏️ Edit</button>
        <button class="btn btn-danger btn-sm" onclick="removeMember(${m.id}, '${esc(m.name || m.email)}', false)">⛔ Remove</button>
      `;
    } else if (isSelf) {
      btnHTML = `<button class="btn btn-danger btn-sm" onclick="removeMember(${m.id}, 'yourself', true)">🚪 Leave</button>`;
    }

    row.innerHTML = `
      <div class="member-row-top">
        <div class="member-dot">${(m.name || m.email || '?').charAt(0).toUpperCase()}</div>
        <div class="member-info">
          <strong>${esc(m.name || m.email)}</strong>
          <span>${esc(m.email)}</span>
          <span>${esc(m.position || '')}${m.telephone ? ' · ' + esc(m.telephone) : ''}</span>
        </div>
        <div class="member-btns">${btnHTML}</div>
      </div>
      <!-- Inline edit form (only rendered for managers) -->
      ${canManage ? `
      <div class="member-edit-form" id="mef_${m.id}">
        <div class="fields">
          ${inf('Name',      `mf_name_${m.id}`,  m.name)}
          ${inf('Position',  `mf_pos_${m.id}`,   m.position)}
          ${inf('Telephone', `mf_tel_${m.id}`,   m.telephone, 'tel')}
        </div>
        <div class="edit-footer">
          <button class="btn btn-save" onclick="saveMemberEdit(${m.id})">💾 Save</button>
          <button class="btn btn-cancel" onclick="toggleMemberEdit(${m.id})">Cancel</button>
        </div>
      </div>` : ''}
    `;

    list.appendChild(row);
  });

  el.appendChild(list);
}

function toggleMemberEdit(id) {
  const form = document.getElementById(`mef_${id}`);
  if (form) form.classList.toggle('open');
}

/* Save member edit — updates name/position/telephone in the assignment row.
   The team_member (user) id in team_member_assignments is NOT changed. */
async function saveMemberEdit(id) {
  const name = document.getElementById(`mf_name_${id}`)?.value.trim();
  const pos  = document.getElementById(`mf_pos_${id}`)?.value.trim();
  const tel  = document.getElementById(`mf_tel_${id}`)?.value.trim();

  if (!pos) { toast('Position is required.', 'error'); return; }

  showLoad();
  try {
    // We use the project-replace-member endpoint but pass the same member id
    // to just update the assignment fields without changing the user.
    // This calls a dedicated update endpoint.
    const res  = await authFetch(`${API}/api/project-update-member`, {
      method: 'POST',
      body: JSON.stringify({ projectId, memberId: id, name, position: pos, telephone: tel || null })
    });
    const data = await res.json();
    hideLoad();
    if (data.success) {
      // Patch local cache
      const idx = projectData.team_members.findIndex(m => m.id == id);
      if (idx !== -1) {
        projectData.team_members[idx].name     = name;
        projectData.team_members[idx].position = pos;
        projectData.team_members[idx].telephone = tel || null;
      }
      toast('Member updated.', 'success');
      renderTeamSection((projectData.team_members[idx]?.assigned_part || '').toLowerCase());
    } else { toast(data.error || 'Update failed.', 'error'); }
  } catch { hideLoad(); toast('Server error.', 'error'); }
}

async function removeMember(id, label, isSelf) {
  openModal(
    isSelf ? 'Leave Project?' : `Remove ${label}?`,
    isSelf ? 'You will be removed from this project and lose access.'
           : `Remove ${label} from this project?`,
    async () => {
      showLoad();
      try {
        const res  = await authFetch(`${API}/api/project-remove-member`, {
          method: 'POST', body: JSON.stringify({ projectId, memberId: id })
        });
        const data = await res.json();
        hideLoad();
        if (data.success) {
          const removed = projectData.team_members.find(m => m.id == id);
          const side    = (removed?.assigned_part || '').toLowerCase();
          projectData.team_members = projectData.team_members.filter(m => m.id != id);
          toast(isSelf ? 'You have left the project.' : `${label} removed.`, 'success');
          if (isSelf) { setTimeout(navigateBack, 1500); }
          else if (side) renderTeamSection(side);
        } else { toast(data.error || 'Remove failed.', 'error'); }
      } catch { hideLoad(); toast('Server error.', 'error'); }
    },
    isSelf ? 'Leave' : 'Remove'
  );
}
