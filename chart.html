<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Messenger-style Chat</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#f0f2f5;
      --card:#ffffff;
      --accent:#0084ff;
      --muted:#8a939b;
      --sent:#DCF8C6;
      --recv:#ffffff;
    }
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);}
    .app {
      max-width:900px;margin:24px auto;height:80vh;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,0.08);
      background:linear-gradient(180deg,var(--card),#fafafa);
    }

    /* header */
    .header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #e6e9ee;background:#fff}
    .header .title{font-weight:600;margin-left:12px}
    .header .sub{font-size:12px;color:var(--muted)}

    /* messages area */
    .messages {
      flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:8px;background:transparent;
    }
    .msg {
      display:flex;max-width:75%;gap:8px;align-items:flex-end;
    }
    .msg .bubble {
      padding:10px 12px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,0.04);line-height:1.3;
    }
    .msg.received{align-self:flex-start;}
    .msg.received .bubble{background:var(--recv);border-top-left-radius:4px;}
    .msg.sent{align-self:flex-end;flex-direction:row-reverse;}
    .msg.sent .bubble{background:var(--sent);border-top-right-radius:4px;}

    .meta{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ddd,#bbb);display:inline-block;flex-shrink:0}

    /* input area */
    .composer{display:flex;padding:12px;border-top:1px solid #e6e9ee;background:#fff;gap:8px}
    .composer textarea{
      resize:none;flex:1;border:1px solid #e6e9ee;border-radius:18px;padding:10px 12px;height:48px;font-size:14px;outline:none;
    }
    .composer button{
      background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:12px;font-weight:600;cursor:pointer;
      box-shadow:0 4px 10px rgba(0,132,255,0.15);
    }
    .composer button:active{transform:translateY(1px)}
    .timestamp{font-size:10px;color:var(--muted);margin-left:6px}
    @media (max-width:520px){
      .app{margin:12px;height:86vh}
      .header .title{font-size:15px}
    }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="Chat">
    <div class="header">
      <div class="avatar" aria-hidden="true"></div>
      <div style="margin-left:12px">
        <div class="title">Chat with Alex</div>
        <div class="sub">Online</div>
      </div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="composer" class="composer" onsubmit="return false;">
      <textarea id="input" placeholder="Type a message..." aria-label="Message input"></textarea>
      <button id="send" type="button">Send</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function formatTime(date = new Date()){
      return date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    }

    function appendMessage(text, type = 'received', time = new Date()){
      const wrapper = document.createElement('div');
      wrapper.className = 'msg ' + (type === 'sent' ? 'sent' : 'received');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden','true');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = formatTime(time);

      const container = document.createElement('div');
      container.appendChild(bubble);
      container.appendChild(meta);

      wrapper.appendChild(avatar);
      wrapper.appendChild(container);

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight - messagesEl.clientHeight + 200;
    }

    // Basic simulated replies for demonstration
    const cannedReplies = [
      "Nice — tell me more.",
      "Got it.",
      "I can help with that.",
      "Looks good!",
      "Let's schedule a call."
    ];
    function simulatedReply(){
      const reply = cannedReplies[Math.floor(Math.random() * cannedReplies.length)];
      setTimeout(() => appendMessage(reply, 'received'), 700 + Math.random()*1200);
    }

    function sendMessage(){
      const text = inputEl.value.trim();
      if(!text) return;
      appendMessage(text, 'sent', new Date());
      inputEl.value = '';
      inputEl.focus();
      simulatedReply();
    }

    // events
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    // initial sample conversation
    appendMessage('Hey! How can I help you today?', 'received', new Date(Date.now() - 1000*60*5));
    appendMessage('I wanted to ask about pricing and timelines.', 'sent', new Date(Date.now() - 1000*60*4));
    appendMessage('Sure — I can share details. What specifically?', 'received', new Date(Date.now() - 1000*60*3));
  </script>
</body>
</html>
