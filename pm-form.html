<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Project Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }
    .overlay {
      background: rgba(255,255,255,0.6);
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 24px 20px;
      border-radius: 12px; max-width: 700px;
      width: 100%;
      margin: 6vh auto 24px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center; color: #007BFF;
      margin: 0 0 12px;
      font-size: clamp(18px, 5vw, 22px);
    }

    #projectContext {
      font-size: 14px; color: #555;
      text-align: center; margin-bottom: 20px;
      word-break: break-word;
    }

    select, input {
      display: block; width: 100%;
      margin: 8px 0; padding: 12px 14px;
      font-size: 15px; border: 1px solid #ccc;
      border-radius: 6px; -webkit-appearance: none;
      background-color: #fff;
    }
    select:focus, input:focus {
      outline: none; border-color: #007BFF;
      box-shadow: 0 0 0 2px rgba(0,123,255,0.2);
    }
    select:disabled { background: #f4f4f4; color: #888; }

    button[type="submit"] {
      background: #007BFF; color: #fff;
      border: none; padding: 13px 18px;
      border-radius: 6px; cursor: pointer;
      font-size: 16px; margin-top: 16px;
      width: 100%; min-height: 48px;
    }
    button[type="submit"]:hover { background: #0056b3; }

    .message { color: #cc0000; font-size: 14px; margin-top: 8px; }

    .actions {
      margin-top: 20px; text-align: center;
    }
    .back-link {
      display: inline-block; color: #6c757d;
      cursor: pointer; font-size: 14px;
      padding: 8px; min-height: 44px; line-height: 28px;
    }
    .back-link:hover { color: #333; }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .container { padding: 18px 14px; margin-top: 4vh; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Assign Project Manager</h2>
    <p id="projectContext">Loading project...</p>

    <form id="pmForm" onsubmit="addPM(event)">
      <select id="pmRole" required disabled></select>
      <input type="text"  id="pmName"      placeholder="Name"      required />
      <input type="email" id="pmEmail"     placeholder="Email"     required autocomplete="off" />
      <input type="tel"   id="pmTelephone" placeholder="Telephone" />
      <input type="text"  id="pmTask"      placeholder="Task"      required />
      <button type="submit">Assign PM</button>
      <p id="pmMessage" class="message"></p>
    </form>

    <div class="actions">
      <span class="back-link" onclick="goBack()">&#8592; Back to Dashboard</span>
    </div>
  </div>

<script>
  function parseJwt(token) {
    try {
      const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b));
    } catch { return null; }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const token       = localStorage.getItem("authToken");
    const decoded     = parseJwt(token);
    const role        = localStorage.getItem("verifiedRole") || decoded?.role;
    const projectName = localStorage.getItem("activeProjectName");
    const projectId   = localStorage.getItem("activeProjectId");

    document.getElementById("projectContext").textContent = `${projectName} (ID: ${projectId})`;

    const pmRoleSelect = document.getElementById("pmRole");
    const roleMap = {
      "Client":     '<option value="Client Project Manager" selected>Client PM</option>',
      "Contractor": '<option value="Contractor Project Manager" selected>Contractor PM</option>',
      "Consultant": '<option value="Consultant Project Manager" selected>Consultant PM</option>'
    };
    pmRoleSelect.innerHTML = roleMap[role] || "";
  });

  async function addPM(e) {
    e.preventDefault();
    const pmData = {
      name:      document.getElementById("pmName").value,
      email:     document.getElementById("pmEmail").value,
      telephone: document.getElementById("pmTelephone").value,
      task:      document.getElementById("pmTask").value
    };
    await saveAssignment(document.getElementById("pmRole").value, pmData);
  }

  async function saveAssignment(role, data) {
    const token     = localStorage.getItem("authToken");
    const projectId = localStorage.getItem("activeProjectId");

    const response = await fetch("https://oneprojectapp-backend.onrender.com/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ projectId, assignment: { role, ...data } })
    }).then(res => res.json());

    if (response.success) {
      sessionStorage.setItem("redirectSource", response.redirectSource);
      document.getElementById("pmMessage").style.color = "#155724";
      document.getElementById("pmMessage").textContent = `${role} assigned successfully.`;
      setTimeout(() => window.location.href = "assign-team.html", 1200);
    } else {
      document.getElementById("pmMessage").textContent = response.error || "Failed to assign.";
    }
  }

  function goBack() { window.history.back(); }
</script>
</body>
</html>
