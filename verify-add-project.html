<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify & Add Project</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100%;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #007BFF; font-size: 24px; text-align: center; }
    h3 { margin-top: 30px; color: #333; font-size: 18px; }
    .profile-block {
      display: flex; align-items: center; margin-bottom: 20px;
    }
    .profile-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background-size: cover; background-position: center;
      margin-right: 15px;
      font-size: 24px; display:flex; align-items:center; justify-content:center;
      background-color:#007BFF; color:#fff;
    }
    .profile-info p {
      margin: 2px 0;
      font-size: 15px;
    }
    input {
      display: block; width: 100%; margin: 10px 0;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 14px; width: 48%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
    .button-row { display:flex; justify-content:space-between; }
    #message { margin-top: 10px; color: #cc0000; font-size: 14px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="container">
  <h2>Verify & Add Project</h2>

  <!-- Countdown progress bar -->
  <div id="progressBar" style="height:6px; background:#007BFF; width:100%; transition:width 1s linear;"></div>

  <!-- Client Info -->
  <div class="profile-block">
    <div id="profileIcon" class="profile-icon"></div>
    <div class="profile-info">
      <p id="clientName"></p>
      <p id="clientEmail"></p>
    </div>
  </div>

  <!-- Project Form -->
  <form id="verifyProjectForm" onsubmit="handleVerifyProject(event)">
    <h3>Project Information</h3>
    <input type="text" id="projectName" placeholder="Project Name" required />
    <input type="text" id="projectLocation" placeholder="Project Location" required />
    <input type="text" id="contractReference" placeholder="Contract Reference" required />

    <h3>Contractor Information</h3>
    <input type="text" id="contractorCompany" placeholder="Contractor Company Name" required />
    <input type="email" id="contractorEmail" placeholder="Contractor Email" required />
    <input type="tel" id="contractorTel" placeholder="Contractor Telephone Number" required />
    <input type="text" id="contractorRepName" placeholder="Contractor Representative Name" required />
    <input type="text" id="contractorRepTitle" placeholder="Contractor Representative Title" required />

    <h3>Consultant Information</h3>
    <input type="text" id="consultantCompany" placeholder="Consultant Company Name" required />
    <input type="email" id="consultantEmail" placeholder="Consultant Email" required />
    <input type="tel" id="consultantTel" placeholder="Consultant Telephone Number" required />
    <input type="text" id="consultantRepName" placeholder="Consultant Representative Name" required />
    <input type="text" id="consultantRepTitle" placeholder="Consultant Representative Title" required />

    <div class="button-row">
      <a href="create-project-account.html" style="text-decoration:none; color:#007BFF;">&#8592; Back</a>
      <button type="submit">Save Project</button>
    </div>
    <p id="formMessage"></p>
  </form>

  <!-- Verification Box -->
  <div id="verificationBox" style="display:none; text-align:center; margin-top:20px; width:50%; margin:auto;">
    <p style="color:#007BFF; font-size:14px; margin-bottom:10px;">
      We’ve sent a 6-digit verification code to your email.<br>
      Enter the code below. It will expire in 2 minutes 59 seconds.
    </p>

    <div style="display:flex; justify-content:center; gap:8px; margin-bottom:10px;">
      <input id="digit1" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit2" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit3" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit4" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit5" maxlength="1" class="code" type="text" inputmode="numeric">
      <input id="digit6" maxlength="1" class="code" type="text" inputmode="numeric">
    </div>

    <p id="verifyMessage"></p>
    <p id="timer" style="margin-top:8px; font-size:13px; color:#333;"></p>

    <a href="verify-add-project.html" style="text-decoration:none; color:#007BFF;">&#8592; Back</a>
    <button id="resendBtn" style="display:none; margin-top:10px;" onclick="resendCode()">Resend Code</button>
  </div>
</div>

<script>
  // Always pull stored email directly
  const email = localStorage.getItem("clientEmail");
  const role = "Client"; // static for now
  let resendCount = 0;
  let countdown;
  let expiryTime;

  // Fetch profile picture + company name immediately after redirect
  document.addEventListener("DOMContentLoaded", async () => {
    if (email) {
      try {
        const res = await fetch("https://oneprojectapp-backend.onrender.com/client/profile-picture", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
          if (data.profile_picture) {
            document.getElementById("profileIcon").style.backgroundImage = `url("${data.profile_picture}")`;
            document.getElementById("profileIcon").textContent = "";
          } else {
            document.getElementById("profileIcon").textContent = email.charAt(0).toUpperCase();
          }

          if (data.company_name) {
            document.getElementById("clientName").textContent = data.company_name;
          }
          document.getElementById("clientEmail").textContent = email;
        } else {
          document.getElementById("clientName").textContent = "Error loading profile";
        }
      } catch (err) {
        console.error("Profile fetch error:", err);
        document.getElementById("clientName").textContent = "Error loading profile";
      }
    }
  });

  async function handleVerifyProject(e) {
    e.preventDefault();

    const projectDetails = {
      project: {
        name: document.getElementById("projectName").value.trim(),
        location: document.getElementById("projectLocation").value.trim(),
        contract_reference: document.getElementById("contractReference").value.trim(),
        created_at: new Date().toISOString(),
        verified: false
      },
      contractor: {
        company: document.getElementById("contractorCompany").value.trim(),
        email: document.getElementById("contractorEmail").value.trim().toLowerCase(),
        telephone: document.getElementById("contractorTel").value.trim(),
        representative: document.getElementById("contractorRepName").value.trim(),
        title: document.getElementById("contractorRepTitle").value.trim(),
        verified: false,
        created_at: new Date().toISOString()
      },
      consultant: {
        company: document.getElementById("consultantCompany").value.trim(),
        email: document.getElementById("consultantEmail").value.trim().toLowerCase(),
        telephone: document.getElementById("consultantTel").value.trim(),
        representative: document.getElementById("consultantRepName").value.trim(),
        title: document.getElementById("consultantRepTitle").value.trim(),
        verified: false,
        created_at: new Date().toISOString()
      }
    };

    // ✅ Check project reference uniqueness before continuing
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/project-check-reference", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ reference: projectDetails.project.contract_reference })
      });
      const data = await res.json();

      if (!data.success) {
        document.getElementById("formMessage").textContent = data.error || "Project reference already exists.";
        return; // stop here if reference exists
      }
    } catch (err) {
      document.getElementById("formMessage").textContent = "Error checking project reference.";
      return;
    }

  // ✅ Only continue if reference is unique
  localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
  document.getElementById("verifyProjectForm").style.display = "none";
  document.getElementById("verificationBox").style.display = "block";

  // Send verification code
  showLoading();
  try {
    const res = await fetch("https://oneprojectapp-backend.onrender.com/project-send-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, project: projectDetails.project })
    });
    const data = await res.json();
    hideLoading();

    if (data.success) {
      // ✅ Keep token/session info for later verification
      localStorage.setItem("verificationSession", JSON.stringify({
        sessionId: data.sessionId,
        expiresAt: data.expiresAt
      }));

      expiryTime = new Date(data.expiresAt);
      startCountdown(expiryTime);
      attachAutoVerify();
    } else {
      document.getElementById("verifyMessage").textContent = data.error || "Verification failed.";
    }
  } catch (err) {
    hideLoading();
    document.getElementById("verifyMessage").textContent = "Error sending verification code.";
  }

  // Auto-verify inputs
  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.setAttribute("type", "text");
      input.setAttribute("inputmode", "numeric");
      input.addEventListener("input", () => {
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getCode().length === 6) verifyCode();
      });
    });
  }

  function getCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) {
      code += document.getElementById("digit" + i).value.trim();
    }
    return code;
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;

    if (new Date() > expiryTime) {
      document.getElementById("verifyMessage").textContent = "Verification link expired.";
      document.getElementById("resendBtn").style.display = "block";
      return;
    }

    showLoading();
    try {
      const projectDetails = JSON.parse(localStorage.getItem("projectDetails"));
      const sessionData = JSON.parse(localStorage.getItem("verificationSession"));

      const res = await fetch("https://oneprojectapp-backend.onrender.com/project-verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email,
          token: code,
          sessionId: sessionData.sessionId,
          project: projectDetails.project,
          contractor: projectDetails.contractor,
          consultant: projectDetails.consultant
        })
      });
      const data = await res.json();
      hideLoading();

      if (!data.success) {
        document.getElementById("verifyMessage").textContent = data.error || "Invalid code.";
        document.getElementById("resendBtn").style.display = "block";
        return;
      }

      clearInterval(countdown);

      // ✅ Clean up temporary localStorage
      localStorage.removeItem("projectDetails");
      localStorage.removeItem("verificationSession");

      // ✅ Save only what dashboard expects
      localStorage.setItem("clientEmail", email);

      document.getElementById("verifyMessage").textContent = "Project verified successfully! Redirecting…";
      redirectToDashboard(role);

    } catch (err) {
      hideLoading();
      document.getElementById("verifyMessage").textContent = "Server error. Please try again.";
    }
  }

  async function resendCode() {
    if (resendCount >= 2) {
      document.getElementById("verifyMessage").textContent =
        "Verification failed after multiple attempts. Please return to Home.";
      document.getElementById("resendBtn").style.display = "none";
      const backLink = document.querySelector(".back-link");
      if (backLink) backLink.style.color = "#cc0000";
      return;
    }

    showLoading();
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/project-resend-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      hideLoading();

      if (data.success) {
        document.getElementById("verifyMessage").textContent = "New code sent! Check your email.";
        resendCount++;
        for (let i = 1; i <= 6; i++) document.getElementById("digit" + i).value = "";
        document.getElementById("timer").textContent = "";
        document.getElementById("resendBtn").style.display = "none";

        // ✅ Keep new token/session info for later verification
        localStorage.setItem("verificationSession", JSON.stringify({
          sessionId: data.sessionId,
          expiresAt: data.expiresAt
        }));

        expiryTime = new Date(data.expiresAt);
        startCountdown(expiryTime);
      } else {
        document.getElementById("verifyMessage").textContent = data.error || "Resend failed.";
      }
    } catch (err) {
      hideLoading();
      document.getElementById("verifyMessage").textContent = "Server error. Please try again.";
    }
  }

  // Countdown logic
  function startCountdown(expiry) {
    clearInterval(countdown);
    const progressBar = createProgressBar();
    countdown = setInterval(() => {
      const diff = Math.floor((expiry - new Date()) / 1000);
      if (diff <= 0) {
        clearInterval(countdown);
        document.getElementById("timer").textContent = "Code expired.";
        progressBar.style.width = "0%";
        document.getElementById("resendBtn").style.display = "block";
      } else {
        const minutes = Math.floor(diff / 60);
        const seconds = diff % 60;
        document.getElementById("timer").textContent =
          `Code expires in ${minutes}:${seconds.toString().padStart(2,"0")}`;
        progressBar.style.width = `${(diff / 179) * 100}%`; // ✅ 2:59 = 179s
      }
    }, 1000);
  }

  // Progress bar creation (placed at top of container)
  function createProgressBar() {
    let bar = document.getElementById("progressBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "progressBar";
      bar.style.height = "6px";
      bar.style.backgroundColor = "#007BFF";
      bar.style.transition = "width 1s linear";
      bar.style.width = "100%";
      document.querySelector(".container").insertBefore(bar, document.querySelector(".container").firstChild.nextSibling);
    }
    return bar;
  }

  // Loading overlay
  function showLoading() {
    let overlay = document.getElementById("loadingOverlay");
    if (!overlay) {
      overlay = document.createElement("div");
      overlay.id = "loadingOverlay";
      overlay.style.position = "fixed";
      overlay.style.top = "0";
      overlay.style.left = "0";
      overlay.style.width = "100%";
      overlay.style.height = "100%";
      overlay.style.background = "rgba(255,255,255,0.7)";
      overlay.style.display = "flex";
      overlay.style.alignItems = "center";
      overlay.style.justifyContent = "center";
      overlay.style.zIndex = "9999";

      const spinner = document.createElement("div");
      spinner.style.border = "6px solid #f3f3f3";
      spinner.style.borderTop = "6px solid #007BFF";
      spinner.style.borderRadius = "50%";
      spinner.style.width = "50px";
      spinner.style.height = "50px";
      spinner.style.animation = "spin 1s linear infinite";

      overlay.appendChild(spinner);
      document.body.appendChild(overlay);

      const style = document.createElement("style");
      style.innerHTML = `
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      `;
      document.head.appendChild(style);
    }
    overlay.style.display = "flex";
  }

  function hideLoading() {
    const overlay = document.getElementById("loadingOverlay");
    if (overlay) overlay.style.display = "none";
  }

  function redirectToDashboard(role) {
    if (role === "Client") {
      window.location.href = "client-dashboard.html";
    } else {
      window.location.href = "home.html";
    }
  }
</script>
</body>
</html>
