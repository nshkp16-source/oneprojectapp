<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    #loadingBar {
      position: fixed; top: 0; left: 0;
      height: 4px; width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
    }
    .container {
      background: #fff; padding: 40px;
      border-radius: 12px; width: 400px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      position: relative;
    }
    h2 { color: #007BFF; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    #progressBar {
      width: 100%; height: 6px; background-color: #eee;
      border-radius: 3px; margin-bottom: 10px;
      overflow: hidden; position: absolute; top: 0; left: 0;
    }
    #progressFill {
      height: 100%; width: 100%; background-color: #cc0000;
      transition: width 1s linear;
    }
    #timer { margin-top: 25px; font-size: 16px; font-weight: bold; color: #cc0000; }
    .code-inputs { display: flex; justify-content: space-between; margin-top: 20px; }
    .code-inputs input {
      width: 40px; height: 50px; font-size: 22px; text-align: center;
      border: 1px solid #ccc; border-radius: 5px;
    }
    #errorMsg { margin-top: 15px; font-size: 14px; color: #cc0000; }
    #resendBtn {
      display: none; background-color: #007BFF; color: white;
      border: none; padding: 12px; width: 100%;
      cursor: pointer; border-radius: 5px;
      font-size: 15px; margin-top: 15px;
    }
    #resendBtn:hover { background-color: #0056b3; }
    #resendBtn:disabled { background-color: #999; cursor: not-allowed; }
    .back-link { display: none; margin-top: 15px; font-size: 14px; color: #007BFF; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="loadingBar"></div>
  <div class="container">
    <div id="progressBar"><div id="progressFill"></div></div>
    <h2>Verify Your Email</h2>
    <p>We’ve sent a 6‑digit verification code to your email address.</p>
    <p>Enter the code below. It will expire in 3 minutes.</p>
    <p id="timer">2:59</p>
    <div class="code-inputs">
      <input type="text" maxlength="1" id="code1">
      <input type="text" maxlength="1" id="code2">
      <input type="text" maxlength="1" id="code3">
      <input type="text" maxlength="1" id="code4">
      <input type="text" maxlength="1" id="code5">
      <input type="text" maxlength="1" id="code6">
    </div>
    <p id="errorMsg"></p>
    <button id="resendBtn">Resend Verification Code</button>
    <a id="backLink" href="create-project-account.html" class="back-link">← Back to Account Creation</a>
  </div>

<script>
  let timeLeft = 179; // 2:59 countdown
  const timerEl = document.getElementById("timer");
  const loadingBar = document.getElementById("loadingBar");
  const errorMsg = document.getElementById("errorMsg");
  const progressFill = document.getElementById("progressFill");
  const resendBtn = document.getElementById("resendBtn");
  const backLink = document.getElementById("backLink");

  let resendAttempts = parseInt(localStorage.getItem("resendAttempts") || "0");
  const projectDetails = JSON.parse(localStorage.getItem("projectDetails") || "{}");
  const clientEmail = projectDetails.client?.company_email;

  function startCountdown() {
    const countdown = setInterval(() => {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      timerEl.textContent = `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
      progressFill.style.width = `${(timeLeft / 179) * 100}%`;
      timeLeft--;
      if (timeLeft < 0) {
        clearInterval(countdown);
        errorMsg.textContent = "Code expired.";
        resendBtn.style.display = "inline-block";
      }
    }, 1000);
  }

  function autoTab(current, nextId) {
    if (current.value.length === 1 && nextId) {
      document.getElementById(nextId).focus();
    }
    checkCodeComplete();
  }

  function checkCodeComplete() {
    const code = [
      document.getElementById("code1").value,
      document.getElementById("code2").value,
      document.getElementById("code3").value,
      document.getElementById("code4").value,
      document.getElementById("code5").value,
      document.getElementById("code6").value
    ].join("");
    if (code.length === 6) {
      showLoading();
      submitCode(code);
    }
  }

  function showLoading() { loadingBar.style.width = "100%"; }
  function resetLoading() { loadingBar.style.width = "0"; }

  async function submitCode(code) {
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: clientEmail, code })
      });

      const data = await res.json();
      if (data.verified === true) {
        // ✅ Commit account + project info
        const commitRes = await fetch("https://oneprojectapp-backend.onrender.com/commit-account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(projectDetails)
        });
        const commitData = await commitRes.json();

        if (commitRes.ok && commitData.success) {
          // ✅ Save only JWT tokens
          if (commitData.accessToken && commitData.refreshToken) {
            localStorage.setItem("authToken", commitData.accessToken);
            localStorage.setItem("refreshToken", commitData.refreshToken);
          }

          // Redirect authenticated Client
          window.location.href = "verify-success.html";
        } else {
          errorMsg.textContent = commitData.error || "Failed to save account data.";
          resetLoading();
        }
      } else {
        errorMsg.textContent = "Incorrect or expired code.";
        resetInputs(); resetLoading();
        resendBtn.style.display = "inline-block";
      }
    } catch (err) {
      console.error("Code verification error:", err);
      errorMsg.textContent = "Server error. Please try again.";
      resetInputs(); resetLoading();
      resendBtn.style.display = "inline-block";
    }
  }

  function resetInputs() {
    const inputs = document.querySelectorAll(".code-inputs input");
    inputs.forEach(input => input.value = "");
    document.getElementById("code1").focus();
  }

  resendBtn.addEventListener("click", async () => {
    if (resendAttempts >= 2) {
      resendBtn.disabled = true;
      errorMsg.textContent = "Resend attempts expired. Please start fresh.";
      backLink.style.display = "block";
      return;
    }

    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: clientEmail })
      });
      const data = await res.json();

      if (data.success) {
        resendAttempts++;
        localStorage.setItem("resendAttempts", resendAttempts.toString());
        if (data.sessionId) localStorage.setItem("sessionId", data.sessionId);

        alert("Verification code resent!");
        timeLeft = 179;
        startCountdown();
        resendBtn.style.display = "none";
      } else {
        alert(data.error || "Failed to resend code.");
      }
    } catch (err) {
      console.error("Resend error:", err);
      alert("Unexpected error during resend.");
    }
  });

  window.onload = () => {
    startCountdown();
    const inputs = document.querySelectorAll(".code-inputs input");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        autoTab(input, idx < inputs.length - 1 ? `code${idx+2}` : null);
      });
    });

    if (resendAttempts >= 2) {
      resendBtn.disabled = true;
      errorMsg.textContent = "Resend attempts expired. Please start fresh.";
      backLink.style.display = "block";
    }
  };
</script>
</body>
</html>
