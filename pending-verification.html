<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── Loading bar (top) ── */
    #loadingBar {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0;
      background: #007BFF;
      z-index: 999;
      transition: width 1.4s ease-in-out;
    }

    /* ── Card ── */
    .container {
      background: #fff;
      border-radius: 16px;
      padding: clamp(28px, 5vw, 44px) clamp(20px, 5vw, 44px);
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 6px 28px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    /* ── Countdown strip (top of card) ── */
    #progressBar {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 5px;
      background: #eee;
    }
    #progressFill {
      height: 100%;
      width: 100%;
      background: #cc0000;
      transition: width 1s linear;
    }

    h2 {
      color: #007BFF;
      font-size: clamp(18px, 4vw, 22px);
      margin: 18px 0 10px;
    }

    .subtitle {
      font-size: clamp(13px, 2.5vw, 15px);
      color: #555;
      line-height: 1.5;
      margin-bottom: 6px;
    }

    /* ── Timer ── */
    #timer {
      font-size: clamp(14px, 3vw, 16px);
      font-weight: 700;
      color: #cc0000;
      margin: 10px 0 20px;
    }

    /* ── 6-digit code inputs ── */
    .code-inputs {
      display: flex;
      justify-content: center;
      gap: clamp(6px, 2vw, 10px);
      margin-bottom: 16px;
    }

    .code-inputs input {
      width: clamp(38px, 11vw, 50px);
      height: clamp(44px, 12vw, 56px);
      font-size: clamp(18px, 4vw, 24px);
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .code-inputs input:focus { border-color: #007BFF; }

    /* ── Messages ── */
    #errorMsg {
      min-height: 20px;
      font-size: 13px;
      color: #cc0000;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* ── Buttons ── */
    .action-btn {
      display: none;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn:hover  { background: #0056b3; }
    .action-btn:active { background: #004494; }
    .action-btn:disabled { background: #aab; cursor: not-allowed; }

    .back-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 20px;
      background: #f0f2f5;
      border: 1px solid #007BFF;
      color: #007BFF;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover { background: #e0eaff; }

    /* ── Mobile fine-tune ── */
    @media (max-width: 360px) {
      .code-inputs input { width: 36px; height: 42px; font-size: 18px; }
      .code-inputs { gap: 5px; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="container">
    <div id="progressBar"><div id="progressFill"></div></div>

    <h2>Verify Your Email</h2>
    <p class="subtitle">We sent a 6-digit verification code to your email address.<br>Enter it below — it expires in 3 minutes.</p>
    <p id="timer">3:00</p>

    <div class="code-inputs" id="codeInputs">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code1" aria-label="Digit 1">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code2" aria-label="Digit 2">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code3" aria-label="Digit 3">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code4" aria-label="Digit 4">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code5" aria-label="Digit 5">
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" id="code6" aria-label="Digit 6">
    </div>

    <p id="errorMsg"></p>

    <button id="resendBtn" class="action-btn" onclick="resendCode()">Resend Verification Code</button>
    <br>
    <a class="back-btn" onclick="goBack()">&#8592; Back to Account Creation</a>
  </div>

<script>
  // ── State ─────────────────────────────────────────────────────────
  let timeLeft       = 180;
  let countdownTimer = null;
  let resendAttempts = parseInt(localStorage.getItem("resendAttempts") || "0");
  let submitting     = false;

  const projectDetails = JSON.parse(localStorage.getItem("projectDetails") || "{}");
  const clientEmail    = projectDetails.client?.company_email || "";

  // ── DOM refs ──────────────────────────────────────────────────────
  const timerEl      = document.getElementById("timer");
  const progressFill = document.getElementById("progressFill");
  const errorMsg     = document.getElementById("errorMsg");
  const resendBtn    = document.getElementById("resendBtn");
  const loadingBar   = document.getElementById("loadingBar");
  const inputs       = Array.from(document.querySelectorAll(".code-inputs input"));

  // ── Loading bar ───────────────────────────────────────────────────
  function showLoading() {
    loadingBar.style.transition = "none";
    loadingBar.style.width = "0";
    requestAnimationFrame(() => {
      loadingBar.style.transition = "width 1.4s ease-in-out";
      loadingBar.style.width = "90%";
    });
  }
  function hideLoading() {
    loadingBar.style.transition = "width 0.3s ease";
    loadingBar.style.width = "0";
  }

  // ── Countdown ─────────────────────────────────────────────────────
  function startCountdown() {
    clearInterval(countdownTimer);
    resendBtn.style.display = "none";
    timeLeft = 180;

    countdownTimer = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(countdownTimer);
        timerEl.textContent = "Code expired.";
        progressFill.style.width = "0%";
        resetInputs();
        showResend();
        return;
      }
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerEl.textContent       = `${m}:${s.toString().padStart(2, "0")}`;
      progressFill.style.width  = `${(timeLeft / 180) * 100}%`;
      timeLeft--;
    }, 1000);
  }

  function showResend() {
    if (resendAttempts >= 2) {
      resendBtn.disabled     = true;
      resendBtn.style.display = "block";
      errorMsg.textContent   = "Resend attempts exhausted. Please start again.";
    } else {
      resendBtn.disabled     = false;
      resendBtn.style.display = "block";
    }
  }

  // ── Code input handling ───────────────────────────────────────────
  function getCode() {
    return inputs.map(i => i.value.trim()).join("");
  }

  function resetInputs() {
    inputs.forEach(i => i.value = "");
    inputs[0].focus();
  }

  function attachInputListeners() {
    inputs.forEach((input, idx) => {
      // Allow only single digits
      input.addEventListener("input", () => {
        // Strip non-numeric
        input.value = input.value.replace(/[^0-9]/g, "").slice(-1);
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        if (getCode().length === 6 && !submitting) submitCode();
      });

      // Handle backspace — move to previous
      input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !input.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });

      // On mobile: handle paste of full 6-digit code
      input.addEventListener("paste", e => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData)
          .getData("text").replace(/\D/g, "").slice(0, 6);
        pasted.split("").forEach((ch, i) => {
          if (inputs[i]) inputs[i].value = ch;
        });
        if (pasted.length === 6 && !submitting) submitCode();
      });
    });
  }

  // ── Submit code ───────────────────────────────────────────────────
  async function submitCode() {
    const code = getCode();
    if (code.length !== 6 || submitting) return;
    submitting = true;
    showLoading();
    errorMsg.textContent = "";

    try {
      // Step 1: verify the code
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: clientEmail, code })
      });
      const data = await res.json();

      if (!data.verified) {
        hideLoading();
        errorMsg.textContent = data.error || "Incorrect or expired code.";
        resetInputs();
        showResend();
        submitting = false;
        return;
      }

      // Step 2: commit account to backend
      const formData = new FormData();
      formData.append("projectDetails", JSON.stringify(projectDetails));

      if (window.pendingProfilePicture) {
        formData.append("clientPicture", window.pendingProfilePicture);
      } else if (projectDetails.client?.profile_picture) {
        formData.append("clientPictureBase64", projectDetails.client.profile_picture);
      }

      const commitRes  = await fetch("https://oneprojectapp-backend.onrender.com/commit-account", {
        method: "POST",
        body: formData
      });
      const commitData = await commitRes.json();

      hideLoading();

      if (commitRes.ok && commitData.success) {
        if (commitData.accessToken && commitData.refreshToken) {
          localStorage.setItem("authToken",    commitData.accessToken);
          localStorage.setItem("refreshToken", commitData.refreshToken);
        }
        // Clean up creation flow data
        ["projectDetails","clientEmail","resendAttempts","sessionId","verificationCode","projectAccount"]
          .forEach(k => localStorage.removeItem(k));

        window.location.replace("dashboard.html");
      } else {
        errorMsg.textContent = commitData.error || "Failed to save account. Please try again.";
        submitting = false;
      }

    } catch (err) {
      hideLoading();
      console.error("Verification error:", err);
      errorMsg.textContent = "Server error. Please try again.";
      resetInputs();
      showResend();
      submitting = false;
    }
  }

  // ── Resend ────────────────────────────────────────────────────────
  async function resendCode() {
    if (resendAttempts >= 2) {
      resendBtn.disabled     = true;
      errorMsg.textContent   = "Resend attempts exhausted. Please start again.";
      return;
    }

    showLoading();
    errorMsg.textContent = "";

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: clientEmail })
      });
      const data = await res.json();
      hideLoading();

      if (data.success) {
        resendAttempts++;
        localStorage.setItem("resendAttempts", String(resendAttempts));
        if (data.sessionId) localStorage.setItem("sessionId", data.sessionId);
        errorMsg.style.color  = "#007BFF";
        errorMsg.textContent  = "New code sent! Check your email.";
        setTimeout(() => { errorMsg.textContent = ""; errorMsg.style.color = "#cc0000"; }, 3000);
        resendBtn.style.display = "none";
        resetInputs();
        startCountdown();
      } else {
        errorMsg.textContent = data.error || "Failed to resend code.";
      }
    } catch (err) {
      hideLoading();
      console.error("Resend error:", err);
      errorMsg.textContent = "Server error. Please try again.";
    }
  }

  // ── Back ──────────────────────────────────────────────────────────
  function goBack() {
    clearInterval(countdownTimer);
    window.location.replace("dashboard.html");
  }

  // ── Init ──────────────────────────────────────────────────────────
  window.onload = () => {
    attachInputListeners();
    startCountdown();
    inputs[0].focus();

    if (resendAttempts >= 2) {
      resendBtn.disabled      = true;
      resendBtn.style.display = "block";
      errorMsg.textContent    = "Resend attempts exhausted. Please start again.";
    }

    if (!clientEmail) {
      errorMsg.textContent = "No account data found. Please start the registration again.";
    }
  };
</script>
</body>
</html>
