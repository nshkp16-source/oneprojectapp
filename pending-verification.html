<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification Pending</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loadingBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      position: relative;
    }
    h2 { color: #007BFF; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    #progressBar {
      width: 100%; height: 6px; background-color: #eee;
      border-radius: 3px; margin-bottom: 10px;
      overflow: hidden; position: absolute; top: 0; left: 0;
    }
    #progressFill {
      height: 100%; width: 100%; background-color: #cc0000;
      transition: width 1s linear;
    }
    #timer { margin-top: 25px; font-size: 16px; font-weight: bold; color: #cc0000; }
    .code-inputs { display: flex; justify-content: space-between; margin-top: 20px; }
    .code-inputs input {
      width: 40px; height: 50px; font-size: 22px; text-align: center;
      border: 1px solid #ccc; border-radius: 5px;
    }
    #errorMsg { margin-top: 15px; font-size: 14px; color: #cc0000; }
    .back-link { display: block; margin-top: 15px; font-size: 14px; color: #007BFF; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="loadingBar"></div>
  <div class="container">
    <div id="progressBar"><div id="progressFill"></div></div>
    <h2>Verify Your Email</h2>
    <p>We’ve sent a verification link and a 6‑digit code to your email address.</p>
    <p>Enter the code below. It will expire in 3 minutes.</p>
    <p id="timer">2:59</p>
    <div class="code-inputs">
      <input type="text" maxlength="1" id="code1">
      <input type="text" maxlength="1" id="code2">
      <input type="text" maxlength="1" id="code3">
      <input type="text" maxlength="1" id="code4">
      <input type="text" maxlength="1" id="code5">
      <input type="text" maxlength="1" id="code6">
    </div>
    <p id="errorMsg"></p>
    <a href="create-project-account.html" class="back-link">← Back to Account Creation</a>
  </div>

  <script>
  function isValidPassword(password) {
    const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d\S]{6,}$/;
    return regex.test(password);
  }

  function showLoading() {
    document.getElementById("loadingBar").style.width = "100%";
  }

  function resetLoading() {
    document.getElementById("loadingBar").style.width = "0";
  }

  async function handleProjectAccount(e) {
    e.preventDefault();
    const messageEl = document.getElementById("message");

    const companyName = document.getElementById("companyName").value.trim();
    const companyEmail = document.getElementById("companyEmail").value.trim().toLowerCase();
    const representativeName = document.getElementById("representativeName").value.trim();
    const companyTel = document.getElementById("companyTel").value.trim();
    const password = document.getElementById("companyPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if (password !== confirmPassword) {
      messageEl.textContent = "Passwords do not match. Please try again.";
      return;
    }

    if (!isValidPassword(password)) {
      messageEl.textContent = "Password must be at least 6 characters and include both letters and numbers.";
      return;
    }

    showLoading();

    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/create-client", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          company_name: companyName,
          company_email: companyEmail,
          representative_name: representativeName,
          phone_number: companyTel,
          password_hash: password
        })
      });

      const data = await res.json();
      if (!data.success) {
        resetLoading();
        messageEl.textContent = data.error || "Failed to send verification code.";
        return;
      }

      // 🔹 Save into unified projectDetails object with sessionId
      let projectDetails = JSON.parse(localStorage.getItem("projectDetails")) || {};
      projectDetails.client = {
        company_name: companyName,
        company_email: companyEmail,
        representative_name: representativeName,
        title: "Client",
        phone_number: companyTel,
        password_hash: password,
        verified: false,
        sessionId: data.sessionId || null, // store sessionId here
        created_at: new Date().toISOString()
      };
      localStorage.setItem("projectDetails", JSON.stringify(projectDetails));

      // 🔹 Also store a lightweight projectAccount for pending-verification.html
      localStorage.setItem("projectAccount", JSON.stringify({
        company_email: companyEmail,
        sessionId: data.sessionId || null
      }));

      alert("Account created! A verification code has been sent to your email.");
      window.location.href = "pending-verification.html";
    } catch (err) {
      console.error(err);
      resetLoading();
      messageEl.textContent = "Server error. Please try again.";
    }
  }

  function goBack() {
    window.location.href = "home.html";
  }
</script>
</body>
</html>
