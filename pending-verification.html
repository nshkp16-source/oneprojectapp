<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification Pending</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #007BFF; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover { background-color: #0056b3; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { color: #5a6268; }
    #timer { font-size: 14px; color: #cc0000; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verify Your Email</h2>
    <p>We’ve sent a verification link to your email address.</p>
    <p>Please verify your account before continuing to create your project.</p>

    <button onclick="resendLink()">Resend Verification Link</button>
    <p id="timer">Link expires in 60 seconds</p>

    <span class="back-link" onclick="goBack()">&#8592; Back to Account Creation</span>
  </div>

<script>
  let timeLeft = 60;
  let countdown;
  const timerEl = document.getElementById("timer");

  function startCountdown() {
    clearInterval(countdown);
    countdown = setInterval(() => {
      timeLeft--;
      timerEl.textContent = `Link expires in ${timeLeft} seconds`;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "Link expired. Please resend.";
      }
    }, 1000);
  }

  async function resendLink() {
    const account = JSON.parse(localStorage.getItem("projectAccount"));
    if (!account || !account.company_email) {
      alert("No account email found. Please go back and create an account.");
      return;
    }

    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: account.company_email })
      });
      const data = await res.json();

      if (data.success) {
        alert("Verification link resent! Please check your email.");
        timeLeft = 60;
        startCountdown();
      } else if (data.redirect) {
        alert("Maximum resend attempts reached.");
        window.location.href = data.redirect;
      } else {
        alert(data.error || "Failed to resend link. Try again.");
      }
    } catch (err) {
      console.error(err);
      alert("Server error. Please try again.");
    }
  }

  function goBack() {
    window.location.href = "create-project-account.html";
  }

  // 🔹 NEW: Poll backend every 5 seconds to check verification status
  async function checkVerification() {
    const account = JSON.parse(localStorage.getItem("projectAccount") || "{}");
    if (!account.company_email) return;

    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/check-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: account.company_email })
      });
      const data = await res.json();
      if (data.verified) {
        window.location.href = "verify-success.html";
      }
    } catch (err) {
      console.error("Check verification error:", err);
    }
  }

  window.onload = () => {
    startCountdown();
    setInterval(checkVerification, 5000); // poll every 5 seconds
  };
</script>
</body>
</html>
