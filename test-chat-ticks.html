<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Ticks Validation Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; line-height: 1.6; }
        .test-section { background: white; margin: 15px 0; padding: 15px; border-radius: 8px; border-left: 4px solid #ccc; }
        .pass { border-left-color: #28a745; background: #f1f9f6; }
        .fail { border-left-color: #dc3545; background: #fdf1f1; }
        h2 { margin-top: 0; }
        .tick-demo { display: inline-block; font-size: 18px; margin: 0 5px; }
        code { background: #eee; padding: 2px 6px; border-radius: 3px; }
        pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .verdict { font-weight: bold; margin-top: 10px; }
        .pass .verdict { color: #28a745; }
        .fail .verdict { color: #dc3545; }
    </style>
</head>
<body>

<h1>💬 Chat Delivered/Read Ticks Validation</h1>
<p>Automated test suite for per-recipient delivered receipts and read receipts UI rendering.</p>

<div id="results"></div>

<script>
const tests = [];
const currentUserId = 123;
const currentUserRole = 'Client';

function test(name, fn) {
    try {
        const result = fn();
        tests.push({ name, pass: result.pass, details: result.details });
    } catch (err) {
        tests.push({ name, pass: false, details: `Exception: ${err.message}` });
    }
}

// ============================================================================
// TEST 1: Message-level delivered flag (legacy fallback)
// ============================================================================
test('Message.delivered flag exists and is boolean', () => {
    const msg = {
        id: 1,
        delivered: true,
        read_by: []
    };
    return {
        pass: typeof msg.delivered === 'boolean',
        details: `msg.delivered = ${msg.delivered} (type: ${typeof msg.delivered})`
    };
});

// ============================================================================
// TEST 2: Per-recipient delivered_to array parsing
// ============================================================================
test('Parse delivered_to JSON array from backend', () => {
    const msg = {
        id: 1,
        delivered_to: JSON.stringify([125, 126, 127])
    };
    let deliveredTo = [];
    try {
        if (Array.isArray(msg.delivered_to)) {
            deliveredTo = msg.delivered_to;
        } else if (msg.delivered_to) {
            deliveredTo = JSON.parse(msg.delivered_to);
        }
    } catch (e) {
        deliveredTo = [];
    }
    return {
        pass: Array.isArray(deliveredTo) && deliveredTo.length === 3,
        details: `parsed delivered_to: ${JSON.stringify(deliveredTo)}`
    };
});

// ============================================================================
// TEST 3: Delivered tick logic - use per-recipient delivered_to
// ============================================================================
test('Compute isDelivered from delivered_to (per-recipient)', () => {
    const msg = {
        id: 1,
        sent: true,
        read_by: [],
        delivered_to: JSON.stringify([125, 126])  // recipient user 125 and 126 have delivered
    };

    let deliveredTo = [];
    if (Array.isArray(msg.delivered_to)) {
        deliveredTo = msg.delivered_to;
    } else if (msg.delivered_to && typeof msg.delivered_to === 'string') {
        try {
            deliveredTo = JSON.parse(msg.delivered_to);
        } catch (e) {
            deliveredTo = [];
        }
    }

    const deliveredFromRecipients = Array.isArray(deliveredTo) ? deliveredTo.map(Number).filter(Boolean) : [];
    const isDelivered = (deliveredFromRecipients.length > 0 && deliveredFromRecipients.some(id => Number(id) !== Number(currentUserId))) || !!msg.delivered;

    return {
        pass: isDelivered === true && deliveredFromRecipients.length > 0,
        details: `deliveredFromRecipients: [${deliveredFromRecipients}], isDelivered: ${isDelivered}`
    };
});

// ============================================================================
// TEST 4: Read tick logic - blue ticks when read_by has others
// ============================================================================
test('Compute isRead from read_by array', () => {
    const msg = {
        id: 1,
        sent: true,
        read_by: [125, 126]  // message read by users 125 and 126
    };

    const others = (msg.read_by || []).filter(id => Number(id) !== Number(currentUserId));
    const isRead = others.length > 0;

    return {
        pass: isRead === true && others.length > 0,
        details: `read_by: [${msg.read_by}], filtered others: [${others}], isRead: ${isRead}`
    };
});

// ============================================================================
// TEST 5: Tick rendering priority: read > delivered > sent
// ============================================================================
test('Tick state priority: read > delivered > sent', () => {
    const scenarios = [];

    // Scenario A: Read (blue double tick)
    const msgRead = {
        id: 1, sent: true,
        read_by: [125, 126],
        delivered_to: JSON.stringify([125, 126]),
        delivered: true
    };
    const othersA = msgRead.read_by.filter(id => Number(id) !== currentUserId);
    const isReadA = othersA.length > 0;
    const tickA = isReadA ? '✓✓ blue' : 'not blue';
    scenarios.push({ name: 'Read', expected: '✓✓ blue', actual: tickA, pass: isReadA });

    // Scenario B: Delivered but not read (grey double tick)
    const msgDelivered = {
        id: 2, sent: true,
        read_by: [],
        delivered_to: JSON.stringify([125, 126]),
        delivered: true
    };
    let deliveredToB = [];
    try {
        deliveredToB = Array.isArray(msgDelivered.delivered_to) 
            ? msgDelivered.delivered_to 
            : JSON.parse(msgDelivered.delivered_to);
    } catch (e) {}
    const deliveredFromRecipients = Array.isArray(deliveredToB) ? deliveredToB.map(Number).filter(Boolean) : [];
    const isReadB = false;
    const isDeliveredB = (deliveredFromRecipients.length > 0 && deliveredFromRecipients.some(id => Number(id) !== Number(currentUserId))) || msgDelivered.delivered;
    const tickB = !isReadB && isDeliveredB ? '✓✓ grey' : 'not grey';
    scenarios.push({ name: 'Delivered', expected: '✓✓ grey', actual: tickB, pass: isDeliveredB && !isReadB });

    // Scenario C: Sent but not delivered (single tick)
    const msgSent = {
        id: 3, sent: true,
        read_by: [],
        delivered_to: [],
        delivered: false
    };
    const isReadC = false;
    const isDeliveredC = false;
    const tickC = isReadC || isDeliveredC ? 'double' : '✓ single';
    scenarios.push({ name: 'Sent only', expected: '✓ single', actual: tickC, pass: !isReadC && !isDeliveredC });

    const allPass = scenarios.every(s => s.pass);
    const details = scenarios.map(s => `  ${s.name}: expected "${s.expected}", got "${s.actual}" (${s.pass ? '✓' : '✗'})`).join('\n');

    return { pass: allPass, details };
});

// ============================================================================
// TEST 6: Unread count persists when app opened but conversation not viewed
// ============================================================================
test('Unread count increments for group messages to unopened conversations', () => {
    // Scenario: user opens app (chat overview), sees group message, but doesn't open that conversation
    const groupMsg = {
        id: 1,
        is_group: true,
        sender_id: 125,
        sender_role: 'ClientPM',
        content: 'Hello team',
        read_by: []  // current user hasn't read yet
    };

    const isMine = groupMsg.sender_id === currentUserId && groupMsg.sender_role === currentUserRole;
    const readBy = Array.isArray(groupMsg.read_by) ? groupMsg.read_by.map(Number) : [];
    const isUnread = !isMine && !readBy.includes(currentUserId);

    return {
        pass: isUnread === true,
        details: `Group message: sender=${groupMsg.sender_id}, currentUser=${currentUserId}, read_by=${readBy}, isUnread=${isUnread}`
    };
});

// ============================================================================
// TEST 7: Opening conversation marks all unread messages as read
// ============================================================================
test('Fetch conversation calls mark-read API with unread message IDs', () => {
    const messages = [
        { id: 1, sent: false, read_by: [], created_at: '2026-06-14T10:00:00Z' },
        { id: 2, sent: false, read_by: [currentUserId], created_at: '2026-06-14T10:05:00Z' },
        { id: 3, sent: false, read_by: [], created_at: '2026-06-14T10:10:00Z' }
    ];

    const toMark = messages
        .filter(m => !m.sent && !m.read_by.includes(currentUserId))
        .map(m => m.id);

    return {
        pass: toMark.length === 2 && toMark.includes(1) && toMark.includes(3),
        details: `Messages to mark read: [${toMark}]`
    };
});

// ============================================================================
// TEST 8: Contact list unread badge shows correct count
// ============================================================================
test('Contact unread badge displays count > 0 with highlight', () => {
    const contacts = [
        { name: 'Alice', unreadCount: 2, unread: true },
        { name: 'Bob', unreadCount: 0, unread: false },
        { name: 'Charlie', unreadCount: 5, unread: true }
    ];

    const unreadContacts = contacts.filter(c => c.unreadCount > 0);
    const allMatch = unreadContacts.every(c => c.unread === true);

    return {
        pass: unreadContacts.length === 2 && allMatch,
        details: `Unread contacts with badges: ${unreadContacts.map(c => `${c.name} (${c.unreadCount})`).join(', ')}`
    };
});

// ============================================================================
// TEST 9: Backend delivers-insert on chat overview open
// ============================================================================
test('Server inserts per-recipient delivered receipts on GET /chat/conversations', () => {
    const sqlLogic = `
        INSERT INTO project_chat_delivered_receipts (message_id, user_id, user_role, delivered_at)
        SELECT m.id, $2, $3, NOW()
        FROM project_chat_messages m
        WHERE m.project_id = $1
          AND NOT (m.sender_role = $2 AND m.sender_id = $3)
          AND (m.is_group = true OR (m.recipient_role = $2 AND m.recipient_id = $3))
        ON CONFLICT (message_id, user_id) DO NOTHING
    `;
    
    // Validates:
    // - INSERT... ON CONFLICT ensures idempotency
    // - Filters out sender's own messages
    // - Covers both group and direct messages to this user
    // - Uses message_id, user_id unique constraint
    const isCorrect = sqlLogic.includes('ON CONFLICT') 
        && sqlLogic.includes('NOT (m.sender_role = $2 AND m.sender_id = $3)')
        && sqlLogic.includes('is_group = true')
        && sqlLogic.includes('recipient_role');

    return {
        pass: isCorrect,
        details: 'SQL logic validates idempotency, sender filtering, and scope'
    };
});

// ============================================================================
// TEST 10: Backend joins delivered_to in chat message queries
// ============================================================================
test('Server joins project_chat_delivered_receipts to return delivered_to array', () => {
    const joinLogic = `
        LEFT JOIN project_chat_delivered_receipts d ON d.message_id = m.id
    `;
    const fieldLogic = `
        COALESCE(json_agg(DISTINCT d.user_id) FILTER (WHERE d.user_id IS NOT NULL), '[]') AS delivered_to
    `;

    const hasJoin = joinLogic.includes('project_chat_delivered_receipts');
    const hasField = fieldLogic.includes('delivered_to');
    const isCorrect = hasJoin && hasField;

    return {
        pass: isCorrect,
        details: 'Query includes delivered receipts join and aggregates delivered_to as JSON array'
    };
});

// ============================================================================
// Render results
// ============================================================================
const resultsDiv = document.getElementById('results');
let passCount = 0;
let failCount = 0;

tests.forEach(t => {
    if (t.pass) passCount++;
    else failCount++;

    const section = document.createElement('div');
    section.className = `test-section ${t.pass ? 'pass' : 'fail'}`;
    section.innerHTML = `
        <h2>${t.pass ? '✓' : '✗'} ${t.name}</h2>
        <pre>${t.details}</pre>
        <div class="verdict">${t.pass ? 'PASS' : 'FAIL'}</div>
    `;
    resultsDiv.appendChild(section);
});

// Summary
const summary = document.createElement('div');
summary.style.marginTop = '30px';
summary.style.padding = '20px';
summary.style.background = '#f0f0f0';
summary.style.borderRadius = '8px';
summary.style.fontSize = '18px';
summary.innerHTML = `
    <strong>Test Summary:</strong> <span style="color: #28a745;">${passCount} pass</span> / <span style="color: #dc3545;">${failCount} fail</span>
    <br/><br/>
    <strong>Verdict:</strong> ${failCount === 0 ? '✓ All tests passed!' : '✗ Some tests failed. Review details above.'}
`;
resultsDiv.appendChild(summary);

console.log(`Tests: ${passCount}/${tests.length} passed`);
</script>

</body>
</html>
