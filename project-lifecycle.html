<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lifecycle | Project settings | OneProject</title>
  <style>
    /* Shell: same layout as the dashboard (navy sidebar, light content area) */
    :root {
      --sidebar-bg: #0d2b4e; --navy: #0d2b4e; --navy-soft: #e8edf3;
      --teal: #007b8a; --teal-dark: #005a68; --teal-soft: #e3f1f3;
      --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --surface: #ffffff;
      --danger: #a83232; --danger-soft: #fff2f0; --ok: #176b53; --ok-soft: #e8f4ef;
      --radius: 8px; --font: "Segoe UI", Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
    [hidden] { display: none !important; }
    .layout { display: flex; min-height: 100vh; }
    .side { width: 220px; min-width: 220px; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; background: var(--sidebar-bg); color: #fff; overflow-y: auto; }
    .side-brand { padding: 16px 14px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .app-brand { color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .01em; text-decoration: none; }
    .app-brand span { color: #8fd3dc; }
    .side-profile { display: flex; align-items: center; gap: 10px; padding: 14px; }
    .app-avatar { width: 42px; height: 42px; min-width: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--teal); color: #fff; font-weight: 600; font-size: 14px; border: 2px solid rgba(255,255,255,.2); background-size: cover; background-position: center; }
    .side-who { display: flex; flex-direction: column; min-width: 0; font-size: 12px; }
    .side-who #topEmail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
    .side-role { color: rgba(255,255,255,.58); font-size: 11px; }
    .side-project { margin: 2px 14px 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; background: rgba(255,255,255,.06); }
    .side-label { font-size: 10px; color: rgba(255,255,255,.4); }
    .side-project #topProject { color: #fff; font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-nav { display: flex; flex-direction: column; }
    .nav-item { display: flex; align-items: center; position: relative; padding: 10px 14px; color: rgba(255,255,255,.58); font-size: 13px; text-decoration: none; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nav-item[aria-current="page"] { background: rgba(0,123,138,.2); color: #fff; font-weight: 600; }
    .nav-item[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--teal); border-radius: 0 2px 2px 0; }
    .nav-item:focus-visible { outline: 3px solid #8fd3dc; outline-offset: -3px; }
    .side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); }
    .content { flex: 1; min-width: 0; }
    .topbar { padding: 14px clamp(16px, 4vw, 40px); background: var(--surface); border-bottom: 1px solid var(--line); }
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .crumbs a { color: var(--teal-dark); text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .crumbs [aria-current="page"] { color: var(--ink); font-weight: 600; }
    .crumbs .sep { opacity: .6; }
    .crumbs [data-project-name] { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-main { max-width: 980px; padding: 24px clamp(16px, 4vw, 40px) 64px; }
    .page-head { margin-bottom: 22px; }
    .page-head h1 { margin: 0; font-size: clamp(22px, 3.4vw, 26px); line-height: 1.2; color: var(--navy); }
    .page-head p { margin: 6px 0 0; max-width: 640px; color: var(--muted); }
    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .side { width: 100%; min-width: 0; height: auto; position: static; }
      .side-nav { flex-direction: row; overflow-x: auto; }
      .nav-item { white-space: nowrap; }
      .side-foot { margin-top: 0; border-top: 0; }
      .side-profile { padding: 10px 14px; }
      .side-project { margin-bottom: 6px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    /* Page components. */
    a { color: var(--teal-dark); }
    .project-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .project-line strong { overflow-wrap: anywhere; color: var(--navy); }
    .status { color: var(--muted); font-size: 13px; font-weight: 600; }
    .notice { margin-top: 20px; padding: 16px 18px; border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: var(--radius); background: var(--surface); }
    .notice.danger, .notice.locked { border-left-color: var(--danger); background: var(--danger-soft); }
    .notice strong { display: block; margin-bottom: 5px; color: var(--navy); }
    .notice.danger strong, .notice.locked strong { color: var(--danger); }
    .notice p { margin: 0; }
    .notice p + p { margin-top: 8px; }
    .section-heading { margin: 28px 0 6px; font-size: 17px; color: var(--navy); }
    .section-copy { margin: 0; color: var(--muted); }
    .confirmation { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .confirmation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .confirm-box { margin-top: 18px; }
    .field-hint { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .details { margin: 18px 0 0; padding: 0; list-style: none; }
    .details li { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .details strong { color: var(--ink); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    main button {
      min-height: 44px; padding: 10px 18px; border: 1px solid var(--navy); border-radius: 6px;
      background: var(--navy); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    main button:hover { filter: brightness(1.12); }
    main button.secondary { background: #fff; color: var(--ink); border-color: #a9b6c2; }
    main button.danger { background: var(--danger); border-color: var(--danger); }
    main button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
    main button:focus-visible, .app-main a:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    main input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #b7c2cd; border-radius: 6px; background: #fff; color: var(--ink); font: inherit; }
    main input:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }
    #feedback { min-height: 26px; margin: 16px 0 0; color: var(--danger); font-weight: 600; }
    #feedback.success { color: var(--ok); }
    @media (max-width: 520px) {
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
      .confirmation-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="layout">
  <aside class="side">
    <div class="side-brand"><a class="app-brand" href="dashboard.html" translate="no">OneProject<span>App</span></a></div>
    <div class="side-profile">
      <div class="app-avatar" id="topAvatar" aria-hidden="true"></div>

<main class="app-main">

  <script>
/* Header: fills the signed-in email, role, project name and profile picture. */
const App = (function () {
  const API = 'https://oneprojectapp-backend.onrender.com';
  const ROLE_LABELS = {
    client: 'Client', contractor: 'Contractor', consultant: 'Consultant',
    clientpm: 'Client project manager', clientprojectmanager: 'Client project manager',
    contractorpm: 'Contractor project manager', contractorprojectmanager: 'Contractor project manager',
    consultantpm: 'Consultant project manager', consultantprojectmanager: 'Consultant project manager',
    teammember: 'Team member',
  };
  function parseJwt(token) {
    try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch (_) { return null; }
  }
  function setProjectName(name) {
    document.querySelectorAll('[data-project-name]').forEach(el => { el.setAttribute('data-user', ''); el.textContent = name || 'Project'; });
  }
  async function fillHeader() {
    const decoded = parseJwt(localStorage.getItem('authToken')) || {};
    const email = localStorage.getItem('verifiedEmail') || decoded.companyEmail || decoded.email || '';
    const roleKey = String(localStorage.getItem('verifiedRole') || decoded.role || '').toLowerCase().replace(/[^a-z]/g, '');
    const emailEl = document.getElementById('topEmail');
    if (emailEl) { emailEl.setAttribute('data-user', ''); emailEl.textContent = email || '-'; }
    const roleEl = document.getElementById('topRole');
    if (roleEl) roleEl.textContent = ROLE_LABELS[roleKey] || '-';
    setProjectName(localStorage.getItem('activeProjectName'));
    const avatar = document.getElementById('topAvatar');
    if (!avatar) return;
    avatar.textContent = (email || '?').charAt(0).toUpperCase();
    try {
      const res = await fetch(API + '/client/profile-picture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
      const data = await res.json();
      if (data.success && data.profile_picture) { avatar.style.backgroundImage = 'url("' + data.profile_picture + '")'; avatar.textContent = ''; }
    } catch (_) { /* keep the initial */ }
  }
  return { fillHeader, setProjectName };
})();
</script>
  <script>
    const API = 'https://oneprojectapp-backend.onrender.com/api';
    const projectId = localStorage.getItem('activeProjectId');
    const titleEl = document.getElementById('title');
    const ledeEl = document.getElementById('lede');
    const projectNameEl = document.getElementById('projectName');
    const projectStatusEl = document.getElementById('projectStatus');
    const actionContent = document.getElementById('actionContent');
    const feedback = document.getElementById('feedback');
    let lifecycle = null;
    App.fillHeader();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function formatDate(value) {
      if (!value) return '';
      return new Intl.DateTimeFormat(undefined, { dateStyle: 'long', timeStyle: 'short' }).format(new Date(value));
    }

    async function request(path, options = {}) {
      const token = localStorage.getItem('authToken');
      if (!token) throw new Error('Your session has expired. Sign in again.');
      const send = currentToken => fetch(`${API}${path}`, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}), Authorization: `Bearer ${currentToken}` },
      });
      let response = await send(token);
      if (response.status === 401 || response.status === 403) {
        const refreshToken = localStorage.getItem('refreshToken');
        if (refreshToken) {
          const refresh = await fetch('https://oneprojectapp-backend.onrender.com/refresh', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken }),
          });
          const refreshed = await refresh.json();
          if (refreshed.accessToken) {
            localStorage.setItem('authToken', refreshed.accessToken);
            response = await send(refreshed.accessToken);
          }
        }
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);
      return data;
    }

    // Emailed 6-digit code field used by project deletion and project exit.
    function codeFieldHTML(prefix) {
      return `<div class="confirm-box">
        <label for="${prefix}Input">Verification code</label>
        <input id="${prefix}Input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" spellcheck="false">
        <p class="field-hint" id="${prefix}Hint">We email a 6-digit code to your account email. It expires in 10 minutes.</p>
        <div class="actions" style="margin-top:10px"><button type="button" class="secondary" id="${prefix}Send">Email me a code</button></div>
      </div>`;
    }

    function wireCodeField(prefix, purpose, onChange) {
      const input = document.getElementById(`${prefix}Input`);
      const send = document.getElementById(`${prefix}Send`);
      const hint = document.getElementById(`${prefix}Hint`);
      let timer;
      const cooldown = seconds => {
        let left = seconds;
        send.disabled = true;
        clearInterval(timer);
        const tick = () => {
          if (left <= 0) { clearInterval(timer); send.disabled = false; send.textContent = 'Send a new code'; return; }
          send.textContent = `New code in ${left}s`;
          left -= 1;
        };
        tick();
        timer = setInterval(tick, 1000);
      };
      input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 6); onChange(); });
      send.addEventListener('click', async () => {
        send.disabled = true;
        hint.textContent = 'Sending the code...';
        try {
          const result = await request('/project-lifecycle/send-code', { method: 'POST', body: JSON.stringify({ projectId, purpose }) });
          hint.textContent = `We sent a 6-digit code to ${result.sentTo}. It expires in ${result.expiresInMinutes} minutes.`;
          cooldown(30);
        } catch (err) {
          hint.textContent = err.message;
          cooldown(10);
        }
      });
    }

    function render() {
      if (!lifecycle) return;
      const project = lifecycle.project;
      const isClient = lifecycle.isClientOwner;
      projectNameEl.setAttribute('data-user', '');
      projectNameEl.textContent = project.name;
      App.setProjectName(project.name);
      localStorage.setItem('activeProjectName', project.name);
      projectStatusEl.textContent = project.lifecycle_status === 'pending_deletion'
        ? 'Read-only · deletion scheduled'
        : (!isClient && lifecycle.exitRequest?.status === 'pending' ? 'Your access is read-only · exit scheduled' : 'Active');
      if (isClient) renderClient(project);
      else renderMember(project);
    }

    function renderClient(project) {
      titleEl.textContent = project.lifecycle_status === 'pending_deletion' ? 'Project deletion scheduled' : 'Delete this project';
      if (project.lifecycle_status === 'pending_deletion') {
        ledeEl.textContent = 'The project is frozen for everyone during the 60-day recovery period.';
        actionContent.innerHTML = `
          <div class="notice danger locked">
            <strong>Project is read-only</strong>
            <p>Deletion is scheduled for <strong data-user>${escapeHtml(formatDate(project.deletion_scheduled_at))}</strong>.</p>
            <p>Until then, project records remain available to view. No one can add, edit, or delete project content. Cancel below to restore normal project use.</p>
          </div>
          <h2 class="section-heading">Restore project</h2>
          <p class="section-copy">Confirm your identity with your account password. The project returns to active immediately.</p>
          <div class="confirmation">
            <div class="confirm-box">
              <label for="cancelDeletionPassword">Client account password</label>
              <input id="cancelDeletionPassword" type="password" autocomplete="current-password">
            </div>
            <div class="actions"><button class="secondary" id="cancelDeletion" disabled>Cancel scheduled deletion</button></div>
          </div>`;
        const password = document.getElementById('cancelDeletionPassword');
        const button = document.getElementById('cancelDeletion');
        password.addEventListener('input', () => { button.disabled = !password.value; });
        document.getElementById('cancelDeletion').addEventListener('click', cancelDeletion);
        return;
      }

      ledeEl.textContent = 'Schedule permanent deletion of this project and its project data.';
      actionContent.innerHTML = `
        <div class="notice danger">
          <p><strong>What happens next</strong></p>
          <p>The project becomes read-only immediately. Everyone can view existing records during the 60-day recovery period, but nobody can add, edit, or delete project content.</p>
          <p>You can cancel during those 60 days. Afterward, the project and its stored files are permanently deleted. This does not delete your client account or your other projects.</p>
        </div>
        <ul class="details">
          <li><strong>Before continuing:</strong> save any files you need to keep.</li>
          <li><strong>Notifications:</strong> project members receive an email and an in-app notification.</li>
        </ul>
        <h2 class="section-heading">Confirm deletion</h2>
        <p class="section-copy">Both checks are required before the 60-day recovery period begins.</p>
        <div class="confirmation">
          <div class="confirmation-grid">
            ${codeFieldHTML('deleteCode')}
            <div class="confirm-box">
              <label for="confirmProjectPassword">Client account password</label>
              <input id="confirmProjectPassword" type="password" autocomplete="current-password">
            </div>
          </div>
          <div class="actions"><button class="danger" id="scheduleDeletion" disabled>Schedule project deletion</button></div>
        </div>
      `;
      const input = document.getElementById('deleteCodeInput');
      const password = document.getElementById('confirmProjectPassword');
      const button = document.getElementById('scheduleDeletion');
      const updateConfirmation = () => { button.disabled = !/^\d{6}$/.test(input.value) || !password.value; };
      wireCodeField('deleteCode', 'delete', updateConfirmation);
      password.addEventListener('input', updateConfirmation);
      button.addEventListener('click', scheduleDeletion);
    }

    function renderMember(project) {
      titleEl.textContent = lifecycle.exitRequest?.status === 'pending' ? 'Project exit scheduled' : 'Exit this project';
      if (project.lifecycle_status !== 'active') {
        ledeEl.textContent = 'The client has scheduled deletion. Project content is read-only during the recovery period.';
        actionContent.innerHTML = `
          <div class="notice danger">
            <p><strong>Project read-only</strong></p>
            <p>Scheduled deletion: <strong data-user>${escapeHtml(formatDate(project.deletion_scheduled_at))}</strong></p>
            <p>You can view existing project content until deletion. The client can cancel the request.</p>
          </div>`;
        return;
      }
      if (lifecycle.exitRequest?.status === 'pending') {
        ledeEl.textContent = 'Your project access is read-only during the 15-day exit period. Other members can continue working normally.';
        actionContent.innerHTML = `
          <div class="notice">
            <p><strong>Exit date: <span data-user>${escapeHtml(formatDate(lifecycle.exitRequest.effective_at))}</span></strong></p>
            <p>You can review and download existing project files, but cannot add, edit, or delete project content. Your previous contributions stay in the project.</p>
            <p>Other members are not restricted and can continue working. Cancel your exit request below to restore your own editing access.</p>
          </div>
          <div class="actions"><button class="secondary" id="cancelExit">Cancel exit request</button></div>`;
        document.getElementById('cancelExit').addEventListener('click', cancelExit);
        return;
      }
      ledeEl.textContent = 'Schedule removal of your membership from this project.';
      actionContent.innerHTML = `
        <div class="notice">
          <p>After you schedule your exit, your own access becomes read-only immediately. You may review or download existing files, but cannot add, edit, or delete project content.</p>
          <p>Your membership is removed after 15 days unless you cancel. Your existing contributions stay with the project.</p>
          <p>Other project users will receive a notification when your exit takes effect. The project and other users’ access are not deleted or changed.</p>
        </div>
        <h2 class="section-heading">Confirm your exit</h2>
        <p class="section-copy">Request a code, then enter it to confirm that it is you.</p>
        <div class="confirmation">
          ${codeFieldHTML('exitCode')}
          <div class="actions"><button class="danger" id="scheduleExit" disabled>Schedule my exit</button></div>
        </div>`;
      const exitInput = document.getElementById('exitCodeInput');
      const exitButton = document.getElementById('scheduleExit');
      wireCodeField('exitCode', 'exit', () => { exitButton.disabled = !/^\d{6}$/.test(exitInput.value); });
      exitButton.addEventListener('click', scheduleExit);
    }

    async function refresh() {
      if (!projectId) throw new Error('No active project is selected. Return to the dashboard and select a project.');
      lifecycle = await request(`/project-lifecycle?projectId=${encodeURIComponent(projectId)}`);
      render();
    }

    async function scheduleDeletion() {
      const button = document.getElementById('scheduleDeletion');
      const verificationCode = document.getElementById('deleteCodeInput').value.trim();
      const password = document.getElementById('confirmProjectPassword').value;
      button.disabled = true;
      feedback.textContent = '';
      feedback.classList.remove('success');
      try {
        const result = await request('/project-deletion/request', { method: 'POST', body: JSON.stringify({ projectId, verificationCode, password }) });
        await refresh();
        showNotificationFeedback(result.notifications);
        feedback.classList.add('success');
      } catch (err) {
        feedback.textContent = err.message;
        button.disabled = false;
      }
    }

    async function cancelDeletion() {
      const button = document.getElementById('cancelDeletion');
      const password = document.getElementById('cancelDeletionPassword').value;
      button.disabled = true;
      feedback.textContent = '';
      feedback.classList.remove('success');
      try {
        const result = await request('/project-deletion/cancel', { method: 'POST', body: JSON.stringify({ projectId, password }) });
        await refresh();
        showNotificationFeedback(result.notifications);
        feedback.classList.add('success');
      } catch (err) {
        feedback.textContent = err.message;
        button.disabled = false;
      }
    }

    function showNotificationFeedback(notifications) {
      if (!notifications) {
        feedback.textContent = 'Project status updated.';
        return;
      }

      feedback.replaceChildren(document.createTextNode('Project status updated. '));
      const emailCount = document.createElement('span');
      emailCount.setAttribute('data-user', '');
      emailCount.textContent = String(notifications.emailSent);
      feedback.append(emailCount, document.createTextNode(notifications.emailSent === 1 ? ' member email sent; ' : ' member emails sent; '));
      feedback.append(document.createTextNode(
        notifications.inAppSent ? 'in-app notification posted' : 'no other members to notify in-app'
      ));

      if (notifications.emailFailed) {
        feedback.append(document.createTextNode('; '));
        const failedCount = document.createElement('span');
        failedCount.setAttribute('data-user', '');
        failedCount.textContent = String(notifications.emailFailed);
        feedback.append(failedCount, document.createTextNode(notifications.emailFailed === 1 ? ' email failed' : ' emails failed'));
      }

      feedback.append(document.createTextNode('.'));
    }

    async function scheduleExit() {
      const button = document.getElementById('scheduleExit');
      const verificationCode = document.getElementById('exitCodeInput').value.trim();
      button.disabled = true;
      feedback.textContent = '';
      try {
        await request('/project-exit/request', { method: 'POST', body: JSON.stringify({ projectId, verificationCode }) });
        await refresh();
      } catch (err) {
        feedback.textContent = err.message;
        button.disabled = false;
      }
    }

    async function cancelExit() {
      const button = document.getElementById('cancelExit');
      button.disabled = true;
      feedback.textContent = '';
      try {
        await request('/project-exit/cancel', { method: 'POST', body: JSON.stringify({ projectId }) });
        await refresh();
      } catch (err) {
        feedback.textContent = err.message;
        button.disabled = false;
      }
    }

    refresh().catch(err => {
      titleEl.textContent = 'Unable to load project';
      ledeEl.textContent = '';
      projectNameEl.textContent = 'Project status unavailable';
      projectNameEl.removeAttribute('data-user');
      projectStatusEl.textContent = '';
      feedback.textContent = err.message;
    });
  </script>
  <script src="language-switcher.js"></script>
</body>
</html>
