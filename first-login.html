<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>First Login - Verification</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6); z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 30px; border-radius: 10px;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 { color: #007BFF; margin-bottom: 20px; }

    .code {
      width: 32px; height: 32px;
      margin: 3px;
      font-size: 18px;
      text-align: center;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .password {
      display: block; width: 90%; margin: 10px auto;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
    }

    button {
      background-color: #007BFF; color: white;
      border: none; padding: 12px; width: 90%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }

    #message { margin-top: 10px; font-size: 14px; min-height: 18px; }
    #timer { margin-top: 10px; font-size: 14px; color: #cc0000; }
    .back-link {
      display: inline-block; margin-top: 20px;
      font-size: 14px; color: #6c757d; cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { color: #5a6268; }

    #loadingOverlay {
      display: none;
      position: fixed;
      z-index: 20;
      top: 0; left: 0;
      width: 100%; height: 6px;
      background: transparent;
    }
    .loading-bar-fill {
      width: 0%; height: 100%;
      background: #007BFF;
      animation: fillBar 1.5s forwards;
    }
    @keyframes fillBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    #countdownBar {
      width: 90%; height: 8px;
      background: #ddd; border-radius: 4px;
      margin: 10px auto;
      overflow: hidden;
    }
    #countdownFill {
      width: 100%; height: 100%;
      background: #28a745;
      transition: width 1s linear;
    }

    /* 🔹 Alert banner style */
    .alert-box {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 5px;
      padding: 12px;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome! First Login</h2>
    <p id="infoText"></p>

    <!-- Verification Block -->
    <div id="verificationBlock">
      <p style="color:#007BFF; font-size:13px; margin-bottom:8px;">
        Enter the 6-digit verification code sent to your email.
      </p>
      <div style="display:flex; justify-content:center;">
        <input id="digit1" maxlength="1" class="code">
        <input id="digit2" maxlength="1" class="code">
        <input id="digit3" maxlength="1" class="code">
        <input id="digit4" maxlength="1" class="code">
        <input id="digit5" maxlength="1" class="code">
        <input id="digit6" maxlength="1" class="code">
      </div>
      <p id="message"></p>
      <div id="countdownBar"><div id="countdownFill"></div></div>
      <p id="timer"></p>
      <button id="resendBtn" style="display:none;" onclick="resendCode()">Resend Code</button>
      <div><span class="back-link" onclick="goBack()">&#8592; Back</span></div>
    </div>

    <!-- Password Block -->
    <div id="passwordBlock" style="display:none;">
      <h3>Create Your Password</h3>
      <input type="password" id="newPassword" class="password" placeholder="New Password" required />
      <input type="password" id="confirmPassword" class="password" placeholder="Confirm Password" required />
      <button onclick="savePassword()">Save Password</button>
      <p id="message"></p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay"><div class="loading-bar-fill"></div></div>

<script>
  const email = localStorage.getItem("pendingEmail");
  const role = localStorage.getItem("pendingRole");
  if (!email || !role) {
    alert("Missing first-login context. Please log in again.");
    window.location.href = "home.html";
  }
  document.getElementById("infoText").textContent = `First login for ${role} account: ${email}`;

  let resendCount = 0;
  let countdown;

  window.onload = async () => {
    showLoading();
    await fetch("https://oneprojectapp-backend.onrender.com/firstlogin-send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    startCountdown();
    attachAutoVerify();
  };

  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getVerificationCode().length === 6) verifyCode();
      });
    });
  }

  function getVerificationCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) {
      code += document.getElementById("digit" + i).value.trim();
    }
    return code;
  }

  function showLoading() {
    const overlay = document.getElementById("loadingOverlay");
    overlay.style.display = "block";
    overlay.innerHTML = '<div class="loading-bar-fill"></div>';
    setTimeout(() => { overlay.style.display = "none"; }, 1600);
  }

  function startCountdown() {
    let timeLeft = 179;
    const timerEl = document.getElementById("timer");
    const fillEl = document.getElementById("countdownFill");
    clearInterval(countdown);
    countdown = setInterval(() => {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerEl.textContent = `Code expires in ${minutes}:${seconds.toString().padStart(2,"0")}`;
      fillEl.style.width = (timeLeft / 179 * 100) + "%";
      timeLeft--;
      if (timeLeft < 0) {
        clearInterval(countdown);
        timerEl.textContent = "Code expired.";
        document.getElementById("resendBtn").style.display = "block";
      }
    }, 1000);
  }

  async function verifyCode() {
    const code = getVerificationCode();
    if (code.length !== 6) return;
    showLoading();
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/verify-password-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: code })
      });
      const data = await res.json();
      if (!data.success) {
        showAlert(data.error || "Incorrect code.", "error");
        document.getElementById("resendBtn").style.display = "block";
        return;
      }
      clearInterval(countdown);
      document.getElementById("verificationBlock").style.display = "none";
      document.getElementById("passwordBlock").style.display = "block";
    } catch (err) {
      showAlert("Server error. Please try again.", "error");
    }
  }

  async function resendCode() {
    if (resendCount >= 2) {
      showAlert("All attempts failed. Please return to Home.", "error");
      document.getElementById("resendBtn").style.display = "none";
      return;
    }
    showLoading();
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/firstlogin-resend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        showAlert("New code sent! Check your email.", "success");
        resendCount++;
        for (let i = 1; i <= 6; i++) {
          document.getElementById("digit" + i).value = "";
        }
        document.getElementById("resendBtn").style.display = "none";
        startCountdown();
      } else {
        showAlert(data.error || "Failed to resend code.", "error");
      }
    } catch (err) {
      showAlert("Server error. Please try again.", "error");
    }
  }

  async function savePassword() {
    const pass1 = document.getElementById("newPassword").value.trim();
    const pass2 = document.getElementById("confirmPassword").value.trim();
    if (!pass1 || !pass2) return showAlert("Please fill in all fields.", "error");
    if (pass1 !== pass2) return showAlert("Passwords do not match.", "error");

    showLoading();
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass1, role })
      });
      const data = await res.json();

      if (!data.success) {
        showAlert(data.error || "Failed to set password.", "error");
        return;
      }

      showAlert("Password set successfully!", "success");

      // ✅ Save token for tracking
      if (data.token) {
        localStorage.setItem("authToken", data.token);
      }

      // Save role-specific email keys
      switch (role) {
        case "Client": localStorage.setItem("clientEmail", email); break;
        case "Client Project Manager": localStorage.setItem("clientPmEmail", email); break;
        case "Consultant": localStorage.setItem("consultantEmail", email); break;
        case "Consultant Project Manager": localStorage.setItem("consultantPmEmail", email); break;
        case "Contractor": localStorage.setItem("contractorEmail", email); break;
        case "Contractor Project Manager": localStorage.setItem("contractorPmEmail", email); break;
        case "Team Member": localStorage.setItem("teamMemberEmail", email); break;
      }

      localStorage.setItem("userEmail", email);
      localStorage.setItem("userRole", role);
      localStorage.setItem("user", JSON.stringify({ email, role }));

      localStorage.removeItem("pendingEmail");
      localStorage.removeItem("pendingRole");

      setTimeout(() => redirectToDashboard(role), 1500);
    } catch (err) {
      showAlert("Server error. Please try again.", "error");
    }
  }

  function redirectToDashboard(role) {
    switch (role) {
      case "Client": window.location.href = "client-dashboard.html"; break;
      case "Client Project Manager": window.location.href = "client-project-manager.html"; break;
      case "Consultant": window.location.href = "consultant-dashboard.html"; break;
      case "Consultant Project Manager": window.location.href = "consultant-project-manager.html"; break;
      case "Contractor": window.location.href = "contractor-dashboard.html"; break;
      case "Contractor Project Manager": window.location.href = "contractor-project-manager.html"; break;
      case "Team Member": window.location.href = "team.html"; break;
      default: window.location.href = "home.html";
    }
  }

  function showAlert(message, type) {
    const container = document.querySelector(".container");
    let alertBox = document.querySelector(".alert-box");
    if (!alertBox) {
      alertBox = document.createElement("div");
      alertBox.className = "alert-box";
      container.insertBefore(alertBox, container.firstChild.nextSibling);
    }
    alertBox.textContent = message;
    if (type === "success") {
      alertBox.style.backgroundColor = "#d4edda";
      alertBox.style.color = "#155724";
      alertBox.style.border = "1px solid #c3e6cb";
    } else {
      alertBox.style.backgroundColor = "#f8d7da";
      alertBox.style.color = "#721c24";
      alertBox.style.border = "1px solid #f5c6cb";
    }
  }
</script>
</body>
</html>
