<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Project Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* ── Loading bar ── */
    #loadingBar {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0;
      background: #007BFF;
      z-index: 999;
      transition: width 1.4s ease-in-out;
    }

    /* ── Card ── */
    .container {
      background: #fff;
      border-radius: 14px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      margin-top: clamp(24px, 8vh, 80px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }

    h2 {
      color: #007BFF;
      font-size: clamp(18px, 4vw, 22px);
      margin-bottom: 8px;
      text-align: center;
    }

    p.note {
      font-size: 13px;
      color: #cc0000;
      font-style: italic;
      margin-bottom: 22px;
      text-align: center;
      line-height: 1.4;
    }

    /* ── Inputs ── */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"],
    input[type="file"] {
      display: block;
      width: 100%;
      margin: 9px 0;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #007BFF; }
    input[type="file"] { padding: 8px 12px; cursor: pointer; }

    .file-label {
      display: block;
      margin: 10px 0 2px;
      font-size: 13px;
      font-weight: 700;
      color: #007BFF;
    }

    /* ── Buttons ── */
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 12px 0 4px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: #007BFF;
      color: #fff;
      transition: background 0.2s;
    }
    .btn:hover  { background: #0056b3; }
    .btn:active { background: #004494; }

    /* ── Choice buttons ── */
    #choiceBlock .btn { margin: 10px 0; }

    /* ── Back link ── */
    .back-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { color: #333; text-decoration: underline; }

    /* ── Error/info messages ── */
    .msg-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 7px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .msg-box.error {
      display: block;
      background: #ffe6e6;
      border: 1px solid #ff6b6b;
      color: #cc0000;
      font-weight: 500;
    }
    .msg-box.error a {
      color: #0056b3;
      text-decoration: underline;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── Mobile fine-tune ── */
    @media (max-width: 400px) {
      .container { padding: 28px 16px; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="container">
    <h2>Create Project Account</h2>
    <p class="note">N.B: Only the Client can create a project account.</p>

    <!-- ── Choice ── -->
    <div id="choiceBlock">
      <button class="btn" onclick="showNewUserForm()">New User</button>
      <button class="btn" onclick="showExistingForm()">I Have an Existing Account</button>
      <a class="back-link" onclick="goBack()">&#8592; Back</a>
    </div>

    <!-- ── New user form ── -->
    <form id="newUserForm" style="display:none;" onsubmit="handleProjectAccount(event)" novalidate>
      <input type="text"     id="companyName"       placeholder="Company / Individual Name"          required autocomplete="organization">
      <input type="email"    id="companyEmail"       placeholder="Company Email (used to sign in)"   required autocomplete="email">
      <input type="text"     id="representativeName" placeholder="Representative / Individual Name"   required autocomplete="name">
      <input type="tel"      id="companyTel"         placeholder="Telephone Number"                   required autocomplete="tel">
      <input type="text"     id="companyTitle"       placeholder="Title / Position (optional)">
      <span class="file-label">Profile picture (optional)</span>
      <input type="file"     id="profilePicture"     accept="image/*">
      <input type="password" id="companyPassword"    placeholder="Create Password"                    required autocomplete="new-password">
      <input type="password" id="confirmPassword"    placeholder="Confirm Password"                   required autocomplete="new-password">
      <button class="btn" type="submit">Create Project Account</button>
      <div id="message" class="msg-box"></div>
      <a class="back-link" onclick="goBack()">&#8592; Back</a>
    </form>

    <!-- ── Existing user form ── -->
    <form id="existingUserForm" style="display:none;" onsubmit="handleExistingAccount(event)" novalidate>
      <input type="email"    id="existingEmail"    placeholder="Email"    required autocomplete="email">
      <input type="password" id="existingPassword" placeholder="Password" required autocomplete="current-password">
      <button class="btn" type="submit">Continue</button>
      <div id="existingMessage" class="msg-box"></div>
      <a class="back-link" onclick="goBack()">&#8592; Back</a>
    </form>
  </div>

<script>
  // ── Keys used during account-creation flow ─────────────────────────
  const ACCOUNT_CREATION_KEYS = [
    "projectDetails", "clientEmail", "resendAttempts",
    "sessionId", "verificationCode", "projectAccount"
  ];

  // Clear all account-creation storage on page load
  // (ensures a fresh start every time this page is opened)
  ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));

  // ── Helpers ───────────────────────────────────────────────────────
  function isValidPassword(p) {
    return /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d\S]{6,}$/.test(p);
  }

  function showLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "none";
    bar.style.width = "0";
    requestAnimationFrame(() => {
      bar.style.transition = "width 1.4s ease-in-out";
      bar.style.width = "90%";
    });
  }

  function hideLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "width 0.3s ease";
    bar.style.width = "0";
  }

  function showError(id, html) {
    const el = document.getElementById(id);
    el.classList.add("error");
    el.innerHTML = html;
  }

  function clearError(id) {
    const el = document.getElementById(id);
    el.classList.remove("error");
    el.innerHTML = "";
  }

  // ── Form visibility ───────────────────────────────────────────────
  function showNewUserForm() {
    document.getElementById("choiceBlock").style.display    = "none";
    document.getElementById("existingUserForm").style.display = "none";
    document.getElementById("newUserForm").style.display    = "block";
    document.getElementById("companyName").focus();
  }

  function showExistingForm() {
    document.getElementById("choiceBlock").style.display    = "none";
    document.getElementById("newUserForm").style.display    = "none";
    document.getElementById("existingUserForm").style.display = "block";
    document.getElementById("existingEmail").focus();
  }

  // ── New user ──────────────────────────────────────────────────────
  async function handleProjectAccount(e) {
    e.preventDefault();
    clearError("message");

    const companyName       = document.getElementById("companyName").value.trim();
    const companyEmail      = document.getElementById("companyEmail").value.trim().toLowerCase();
    const representativeName= document.getElementById("representativeName").value.trim();
    const companyTel        = document.getElementById("companyTel").value.trim();
    const title             = document.getElementById("companyTitle").value.trim() || null;
    const password          = document.getElementById("companyPassword").value;
    const confirmPassword   = document.getElementById("confirmPassword").value;
    const profileFile       = document.getElementById("profilePicture").files[0];

    // Client-side validation
    if (!companyName || !companyEmail || !representativeName || !companyTel) {
      showError("message", "❌ Please fill in all required fields.");
      return;
    }
    if (password !== confirmPassword) {
      showError("message", "❌ Passwords do not match.");
      return;
    }
    if (!isValidPassword(password)) {
      showError("message", "❌ Password must be at least 6 characters and include both letters and numbers.");
      return;
    }
    if (profileFile && profileFile.size > 500 * 1024) {
      showError("message", "❌ Profile picture must not exceed 500 KB.");
      return;
    }

    showLoading();

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/client/check-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: companyEmail })
      });
      const data = await res.json();
      hideLoading();

      if (data.exists) {
        showError("message",
          `⚠️ <strong>This email already exists.</strong><br>
           Use "I Have an Existing Account" to sign in.
           <a href="#" onclick="showExistingForm(); return false;">Switch →</a>`
        );
        return;
      }

      // Build the client object
      const projectDetails = {
        client: {
          company_name:   companyName,
          company_email:  companyEmail,
          telephone:      companyTel,
          representative: representativeName,
          password_hash:  password,   // hashed on the backend
          title,
          profile_picture: null
        }
      };

      if (profileFile) {
        // Convert picture to base64 so it survives page navigation via localStorage
        const reader = new FileReader();
        reader.onload = () => {
          projectDetails.client.profile_picture = reader.result;
          persistAndContinue(projectDetails, companyEmail, profileFile);
        };
        reader.readAsDataURL(profileFile);
      } else {
        persistAndContinue(projectDetails, companyEmail, null);
      }

    } catch (err) {
      hideLoading();
      console.error(err);
      showError("message", "❌ Unexpected error. Please try again.");
    }
  }

  function persistAndContinue(projectDetails, companyEmail, profileFile) {
    // Clear any previous account-creation data first
    ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));

    localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
    localStorage.setItem("clientEmail", companyEmail);
    if (profileFile) window.pendingProfilePicture = profileFile;

    showLoading();
    setTimeout(() => window.location.replace("dashboard.html"), 300);
  }

  // ── Existing user ─────────────────────────────────────────────────
  async function handleExistingAccount(e) {
    e.preventDefault();
    clearError("existingMessage");

    const email    = document.getElementById("existingEmail").value.trim().toLowerCase();
    const password = document.getElementById("existingPassword").value;

    if (!email || !password) {
      showError("existingMessage", "⚠️ Please enter your email and password.");
      return;
    }

    showLoading();

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/client/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      hideLoading();

      if (!res.ok || !data.success) {
        showError("existingMessage",
          `⚠️ <strong>${data.error || "Login failed."}</strong><br>
           Check your credentials or
           <a href="#" onclick="showNewUserForm(); return false;">create a new account</a>.`
        );
        return;
      }

      // Clear creation keys, keep only the email needed for add-project flow
      ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));
      localStorage.setItem("clientEmail", data.clientEmail);

      showLoading();
      setTimeout(() => window.location.href = "add-project.html", 300);

    } catch (err) {
      hideLoading();
      console.error(err);
      showError("existingMessage",
        `⚠️ <strong>Login failed.</strong> Please try again or
         <a href="#" onclick="showNewUserForm(); return false;">create a new account</a>.`
      );
    }
  }

  // ── Back ──────────────────────────────────────────────────────────
  function goBack() {
    const newForm      = document.getElementById("newUserForm");
    const existingForm = document.getElementById("existingUserForm");
    const choiceBlock  = document.getElementById("choiceBlock");

    if (newForm.style.display === "block" || existingForm.style.display === "block") {
      newForm.style.display      = "none";
      existingForm.style.display = "none";
      choiceBlock.style.display  = "block";
      clearError("message");
      clearError("existingMessage");
    } else {
      // Going all the way back to home — wipe everything
      ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));
      window.location.href = "home.html";
    }
  }
</script>
</body>
</html>
