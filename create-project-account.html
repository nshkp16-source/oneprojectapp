<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Project Account</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }
    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      width: 320px;
      margin-top: 8vh;
      margin-left: 5vw;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 {
      color: #007BFF;
      font-size: 22px;
      margin-bottom: 10px;
      text-align: center;
    }
    p.note {
      font-size: 14px;
      color: #cc0000;
      font-style: italic;
      margin-bottom: 20px;
      text-align: center;
    }
    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover {
      color: #5a6268;
    }
    #message {
      margin-top: 10px;
      color: #cc0000;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Project Account</h2>
    <p class="note">N.B: Only the Client can create a project account.</p>

    <form id="projectAccountForm" onsubmit="handleProjectAccount(event)">
      <input type="text" id="companyName" placeholder="Company / Individual Name" required />
      <input type="email" id="companyEmail" placeholder="Company Email (for sign in)" required />
      <input type="text" id="representativeName" placeholder="Representative / Individual Name" required />
      <input type="tel" id="companyTel" placeholder="Telephone Number" required />
      <input type="password" id="companyPassword" placeholder="Create Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit">Create Project Account</button>
      <p id="message"></p>
    </form>

    <span class="back-link" onclick="goBack()">&#8592; Back</span>
  </div>

  <script>
    function isValidPassword(password) {
      // At least 6 characters, must contain letters and numbers
      const regex = /^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d\\S]{6,}$/;
      return regex.test(password);
    }

    async function handleProjectAccount(e) {
      e.preventDefault();
      const messageEl = document.getElementById("message");

      const companyName = document.getElementById("companyName").value.trim();
      const companyEmail = document.getElementById("companyEmail").value.trim().toLowerCase();
      const representativeName = document.getElementById("representativeName").value.trim();
      const companyTel = document.getElementById("companyTel").value.trim();
      const password = document.getElementById("companyPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (password !== confirmPassword) {
        messageEl.textContent = "Passwords do not match. Please try again.";
        return;
      }

      if (!isValidPassword(password)) {
        messageEl.textContent = "Password must be at least 6 characters and include both letters and numbers.";
        return;
      }

      try {
        // Step 1: Create client user in backend
        const createRes = await fetch("http://localhost:3000/create-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: representativeName,
            email: companyEmail,
            role: "client",
            tel: companyTel,
            password
          })
        });
        const createData = await createRes.json();
        if (!createData.success) {
          messageEl.textContent = createData.message || "Failed to create client user.";
          return;
        }

        // Step 2: Trigger email verification
        const verifyRes = await fetch("http://localhost:3000/send-verification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: companyEmail })
        });
        const verifyData = await verifyRes.json();
        if (!verifyData.success) {
          messageEl.textContent = verifyData.message || "Failed to send verification email.";
          return;
        }

        // Step 3: Save ALL client info locally for later use
        const clientInfo = {
          client_id: createData.user_id,
          companyName,
          companyEmail,
          representativeName,
          companyTel,
          passwordHash: password,
          verified: false, // will be updated after email verification
          createdAt: new Date().toISOString()
        };

        localStorage.setItem("client_id", createData.user_id);
        localStorage.setItem("projectAccount", JSON.stringify(clientInfo));

        alert("Account created! Please check your email to verify before continuing.");
        window.location.href = "pending-verification.html";
      } catch (err) {
        messageEl.textContent = "Server error. Please try again.";
      }
    }

    function goBack() {
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
