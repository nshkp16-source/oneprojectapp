<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Project Account</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }
    #loadingBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
    }
    .container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      width: 320px;
      margin-top: 8vh;
      margin-left: 5vw;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 {
      color: #007BFF;
      font-size: 22px;
      margin-bottom: 10px;
      text-align: center;
    }
    p.note {
      font-size: 14px;
      color: #cc0000;
      font-style: italic;
      margin-bottom: 20px;
      text-align: center;
    }
    input {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 14px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover {
      color: #5a6268;
    }
    #message {
      margin-top: 10px;
      color: #cc0000;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="container">
    <h2>Create Project Account</h2>
    <p class="note">N.B: Only the Client can create a project account.</p>

    <form id="projectAccountForm" onsubmit="handleProjectAccount(event)">
      <input type="text" id="companyName" placeholder="Company / Individual Name" required />
      <input type="email" id="companyEmail" placeholder="Company Email (for sign in)" required />
      <input type="text" id="representativeName" placeholder="Representative / Individual Name" required />
      <input type="tel" id="companyTel" placeholder="Telephone Number" required />
      <input type="password" id="companyPassword" placeholder="Create Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit">Create Project Account</button>
      <p id="message"></p>
    </form>

    <span class="back-link" onclick="goBack()">&#8592; Back</span>
  </div>

 <script>
  function isValidPassword(password) {
    const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d\S]{6,}$/;
    return regex.test(password);
  }

  function showLoading() {
    document.getElementById("loadingBar").style.width = "100%";
  }

  function resetLoading() {
    document.getElementById("loadingBar").style.width = "0";
  }

  function handleProjectAccount(e) {
    e.preventDefault();
    const messageEl = document.getElementById("message");

    const companyName = document.getElementById("companyName").value.trim();
    const companyEmail = document.getElementById("companyEmail").value.trim().toLowerCase();
    const representativeName = document.getElementById("representativeName").value.trim();
    const companyTel = document.getElementById("companyTel").value.trim();
    const password = document.getElementById("companyPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if (password !== confirmPassword) {
      messageEl.textContent = "Passwords do not match. Please try again.";
      return;
    }

    if (!isValidPassword(password)) {
      messageEl.textContent = "Password must be at least 6 characters and include both letters and numbers.";
      return;
    }

    showLoading();

    try {
      // ✅ Save client info in the structure finalize expects
      let projectDetails = JSON.parse(localStorage.getItem("projectDetails")) || {};
      projectDetails.client = {
        company_name: companyName,
        company_email: companyEmail,
        representative: representativeName,
        telephone: companyTel,
        title: "Client",
        password_hash: password,
        verified: false,
        created_at: new Date().toISOString()
      };
      localStorage.setItem("projectDetails", JSON.stringify(projectDetails));

      alert("Account created locally! Continue to project creation.");
      window.location.href = "create-project.html";
    } catch (err) {
      console.error(err);
      resetLoading();
      messageEl.textContent = "Unexpected error. Please try again.";
    }
  }

  function goBack() {
    window.location.href = "home.html";
  }
</script>
</body>
</html>
