<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2447">
  <title>Create Project Account</title>
  <style>
/* OneProjectApp – shared styles for the account-creation flow */
:root{--navy:#0b2447;--blue:#1976d2;--blue-d:#135fa8;--amber:#ff9f1c;--text:#1b2733;--muted:#5b6b7c;--line:#d9e1ea;--green:#2e9e5b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);min-height:100vh;min-height:100dvh;
  background:var(--navy) url('account-background.jpg') no-repeat center center/cover;background-attachment:fixed;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(8,26,56,.70),rgba(8,26,56,.45))}

.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 36px}
.topbar{width:100%;max-width:1000px;margin-bottom:22px}
.brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(145deg,var(--amber),#ff7a00);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,159,28,.35)}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:19px;font-weight:700}.brand-name span{color:var(--amber)}

/* Card */
.card{width:100%;max-width:440px;background:#fff;border-radius:16px;border-top:5px solid var(--amber);padding:28px 30px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.card.wide{max-width:860px}
.card h2{color:var(--navy);font-size:clamp(20px,4.5vw,24px);text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.5}

/* Stepper */
.stepper{list-style:none;display:flex;margin-bottom:24px}
.stepper li{position:relative;flex:1;text-align:center;font-size:12px;font-weight:600;color:#8a97a6}
.stepper li span{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#e8eef5;color:#6b7a8c;font-size:13px;position:relative;z-index:1}
.stepper li:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:#e1e8f0}
.stepper li.done{color:var(--green)}.stepper li.done span{background:var(--green);color:#fff}.stepper li.done::after{background:var(--green)}
.stepper li.active{color:var(--navy)}.stepper li.active span{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(25,118,210,.18)}

/* Callout */
.callout{background:#fff7e8;border:1px solid #ffd99a;color:#7a4b00;border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:18px;text-align:center}

/* Choice cards */
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin:12px 0;background:#fff;border:2px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--blue);background:#f4f9ff}
.choice .ico{flex:none;width:44px;height:44px;border-radius:10px;background:#eaf3fd;display:grid;place-items:center}
.choice .ico svg{width:22px;height:22px;stroke:var(--blue)}
.choice strong{display:block;color:var(--navy);font-size:15px}.choice small{color:var(--muted);font-size:13px}

/* Forms */
.field{margin:10px 0}
.field label,.file-label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:5px}
.field label i{font-style:normal;font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=file]{display:block;width:100%;padding:12px 14px;font:inherit;font-size:15px;color:var(--text);background:#fff;border:1px solid #c3cdd8;border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
input[type=file]{padding:9px 12px;cursor:pointer;font-size:14px}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,210,.18)}
.card > form > input,.card > div > input{margin:9px 0}

.section-title{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:16px;font-weight:700;margin:22px 0 4px}
.section-title::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--amber)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.party{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:6px 18px 14px}
.party .section-title{margin-top:14px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;margin-top:16px;font:inherit;font-size:15px;font-weight:600;color:#fff;background:var(--blue);border:2px solid var(--blue);border-radius:9px;cursor:pointer;box-shadow:0 6px 16px rgba(25,118,210,.28);transition:background .2s,transform .1s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}.btn:active{transform:translateY(1px)}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--navy);box-shadow:none}
.btn-outline:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.back-link{display:block;margin:14px auto 0;font:inherit;font-size:13.5px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:6px}
.back-link:hover{color:var(--navy);background:#eef3f8}
.btn:focus-visible,.back-link:focus-visible,.choice:focus-visible,.code:focus-visible{outline:3px solid rgba(255,159,28,.7);outline-offset:2px}

/* Messages */
.msg-box{display:none;margin-top:14px;padding:12px 14px;border-radius:8px;font-size:13.5px;line-height:1.5}
.msg-box.error{display:block;background:#fdecec;border:1px solid #f4a3a3;color:#b71c1c;font-weight:500}
.msg-box.error a{color:var(--blue-d);text-decoration:underline;font-weight:700}
#message{color:#c62828;font-size:14px;min-height:18px;margin-top:10px;text-align:center}
.msg-box#message{text-align:left}

/* Verification page */
.card.has-progress{padding-top:0;overflow:hidden;text-align:center}
.progress{height:6px;margin:0 -30px 22px;background:#eef2f6}
#progressFill{height:100%;width:100%;background:var(--amber);transition:width 1s linear}
.profile-block{display:inline-flex;align-items:center;gap:12px;background:#f6f9fc;border:1px solid var(--line);border-radius:40px;padding:6px 18px 6px 6px;margin-bottom:18px;max-width:100%}
.profile-icon{width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--blue) center/cover;color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center}
.profile-block p{font-size:14px;word-break:break-all;text-align:left}
.hint-text{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:18px}
.otp-row{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.code{width:clamp(38px,11vw,50px);height:clamp(46px,13vw,56px);text-align:center;font-size:clamp(18px,5vw,22px);font-weight:600;color:var(--navy);padding:0 !important;border:1.5px solid #c3cdd8 !important;border-radius:9px !important}
#verifyMessage{margin:8px 0;font-size:14px;color:#c62828;min-height:20px;line-height:1.5}
#timer{font-size:13px;color:var(--muted)}
#resendBtn{max-width:220px;margin:14px auto 0}
.card.has-progress .btn-outline{max-width:300px;margin:14px auto 0}

/* Loading bar */
#loadingBar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--amber),var(--blue));z-index:999;transition:width 1.4s ease-in-out}

@media(max-width:760px){.grid-3,.parties{grid-template-columns:1fr}.grid-3{gap:0}}
@media(max-width:400px){.card{padding:24px 18px 20px}.progress{margin:0 -18px 20px}.otp-row{gap:5px}}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
  </style>
</head>
<body>
  <div id="loadingBar"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="home.html">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/></svg></span>
        <span class="brand-name">OneProject<span>App</span></span>
      </a>
    </header>

    <main class="card">
      <ol class="stepper" aria-label="Progress"><li class="active"><span>1</span>Account</li><li class=""><span>2</span>Project</li><li class=""><span>3</span>Verify</li></ol>
      <h2>Create Project Account</h2>
      <div class="callout">Only the Client can create a project account.</div>

      <!-- Choice -->
      <div id="choiceBlock">
        <button type="button" class="choice" onclick="showNewUserForm()"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></span><span><strong>New User</strong><small>Register your company and start a project</small></span></button>
        <button type="button" class="choice" onclick="showExistingForm()"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M16 7l3 3"/></svg></span><span><strong>I Have an Existing Account</strong><small>Sign in and add another project</small></span></button>
        <button type="button" class="back-link" onclick="goBack()">&#8592; Back</button>
      </div>

      <!-- New user form -->
      <form id="newUserForm" style="display:none;" onsubmit="handleProjectAccount(event)" novalidate>
        <div class="field"><label for="companyName">Company / Individual Name</label><input type="text" id="companyName" required autocomplete="organization"></div>
        <div class="field"><label for="companyEmail">Company Email <i>(used to sign in)</i></label><input type="email" id="companyEmail" required autocomplete="email"></div>
        <div class="field"><label for="representativeName">Representative / Individual Name</label><input type="text" id="representativeName" required autocomplete="name"></div>
        <div class="field"><label for="companyTel">Telephone Number</label><input type="tel" id="companyTel" required autocomplete="tel"></div>
        <div class="field"><label for="companyTitle">Title / Position <i>(optional)</i></label><input type="text" id="companyTitle"></div>
        <div class="field"><label for="profilePicture">Profile picture <i>(optional, max 500 KB)</i></label><input type="file" id="profilePicture" accept="image/*"></div>
        <div class="field"><label for="companyPassword">Create Password</label><input type="password" id="companyPassword" required autocomplete="new-password"></div>
        <div class="field"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" required autocomplete="new-password"></div>
        <button class="btn" type="submit">Create Project Account</button>
        <div id="message" class="msg-box"></div>
        <button type="button" class="back-link" onclick="goBack()">&#8592; Back</button>
      </form>

      <!-- Existing user form -->
      <form id="existingUserForm" style="display:none;" onsubmit="handleExistingAccount(event)" novalidate>
        <div class="field"><label for="existingEmail">Email</label><input type="email" id="existingEmail" required autocomplete="email"></div>
        <div class="field"><label for="existingPassword">Password</label><input type="password" id="existingPassword" required autocomplete="current-password"></div>
        <button class="btn" type="submit">Continue</button>
        <div id="existingMessage" class="msg-box"></div>
        <button type="button" class="back-link" onclick="goBack()">&#8592; Back</button>
      </form>
    </main>

  </div>

<script>
  // ── Keys used during account-creation flow ─────────────────────────
  const ACCOUNT_CREATION_KEYS = [
    "projectDetails", "clientEmail", "resendAttempts",
    "sessionId", "verificationCode", "projectAccount"
  ];

  // Clear all account-creation storage on page load
  // (ensures a fresh start every time this page is opened)
  ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));

  // ── Helpers ───────────────────────────────────────────────────────
  function isValidPassword(p) {
    return /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d\S]{6,}$/.test(p);
  }

  function showLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "none";
    bar.style.width = "0";
    requestAnimationFrame(() => {
      bar.style.transition = "width 1.4s ease-in-out";
      bar.style.width = "90%";
    });
  }

  function hideLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "width 0.3s ease";
    bar.style.width = "0";
  }

  function showError(id, html) {
    const el = document.getElementById(id);
    el.classList.add("error");
    el.innerHTML = html;
  }

  function clearError(id) {
    const el = document.getElementById(id);
    el.classList.remove("error");
    el.innerHTML = "";
  }

  // ── Form visibility ───────────────────────────────────────────────
  function showNewUserForm() {
    document.getElementById("choiceBlock").style.display    = "none";
    document.getElementById("existingUserForm").style.display = "none";
    document.getElementById("newUserForm").style.display    = "block";
    document.getElementById("companyName").focus();
  }

  function showExistingForm() {
    document.getElementById("choiceBlock").style.display    = "none";
    document.getElementById("newUserForm").style.display    = "none";
    document.getElementById("existingUserForm").style.display = "block";
    document.getElementById("existingEmail").focus();
  }

  // ── New user ──────────────────────────────────────────────────────
  async function handleProjectAccount(e) {
    e.preventDefault();
    clearError("message");

    const companyName       = document.getElementById("companyName").value.trim();
    const companyEmail      = document.getElementById("companyEmail").value.trim().toLowerCase();
    const representativeName= document.getElementById("representativeName").value.trim();
    const companyTel        = document.getElementById("companyTel").value.trim();
    const title             = document.getElementById("companyTitle").value.trim() || null;
    const password          = document.getElementById("companyPassword").value;
    const confirmPassword   = document.getElementById("confirmPassword").value;
    const profileFile       = document.getElementById("profilePicture").files[0];

    // Client-side validation
    if (!companyName || !companyEmail || !representativeName || !companyTel) {
      showError("message", "❌ Please fill in all required fields.");
      return;
    }
    if (password !== confirmPassword) {
      showError("message", "❌ Passwords do not match.");
      return;
    }
    if (!isValidPassword(password)) {
      showError("message", "❌ Password must be at least 6 characters and include both letters and numbers.");
      return;
    }
    if (profileFile && profileFile.size > 500 * 1024) {
      showError("message", "❌ Profile picture must not exceed 500 KB.");
      return;
    }

    showLoading();

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/client/check-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: companyEmail })
      });
      const data = await res.json();
      hideLoading();

      if (data.exists) {
        showError("message",
          `⚠️ <strong>This email already exists.</strong><br>
           Use "I Have an Existing Account" to sign in.
           <a href="#" onclick="showExistingForm(); return false;">Switch →</a>`
        );
        return;
      }

      // Build the client object
      const projectDetails = {
        client: {
          company_name:   companyName,
          company_email:  companyEmail,
          telephone:      companyTel,
          representative: representativeName,
          password_hash:  password,   // hashed on the backend
          title,
          profile_picture: null
        }
      };

      if (profileFile) {
        // Convert picture to base64 so it survives page navigation via localStorage
        const reader = new FileReader();
        reader.onload = () => {
          projectDetails.client.profile_picture = reader.result;
          persistAndContinue(projectDetails, companyEmail, profileFile);
        };
        reader.readAsDataURL(profileFile);
      } else {
        persistAndContinue(projectDetails, companyEmail, null);
      }

    } catch (err) {
      hideLoading();
      console.error(err);
      showError("message", "❌ Unexpected error. Please try again.");
    }
  }

  function persistAndContinue(projectDetails, companyEmail, profileFile) {
    // Clear any previous account-creation data first
    ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));

    localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
    localStorage.setItem("clientEmail", companyEmail);
    if (profileFile) window.pendingProfilePicture = profileFile;

    showLoading();
    setTimeout(() => window.location.href = "create-project.html", 300);
  }

  // ── Existing user ─────────────────────────────────────────────────
  async function handleExistingAccount(e) {
    e.preventDefault();
    clearError("existingMessage");

    const email    = document.getElementById("existingEmail").value.trim().toLowerCase();
    const password = document.getElementById("existingPassword").value;

    if (!email || !password) {
      showError("existingMessage", "⚠️ Please enter your email and password.");
      return;
    }

    showLoading();

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/client/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      hideLoading();

      if (!res.ok || !data.success) {
        showError("existingMessage",
          `⚠️ <strong>${data.error || "Login failed."}</strong><br>
           Check your credentials or
           <a href="#" onclick="showNewUserForm(); return false;">create a new account</a>.`
        );
        return;
      }

      // Clear creation keys, keep only the email needed for add-project flow
      ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));
      localStorage.setItem("clientEmail", data.clientEmail);

      showLoading();
      setTimeout(() => window.location.href = "add-project.html", 300);

    } catch (err) {
      hideLoading();
      console.error(err);
      showError("existingMessage",
        `⚠️ <strong>Login failed.</strong> Please try again or
         <a href="#" onclick="showNewUserForm(); return false;">create a new account</a>.`
      );
    }
  }

  // ── Back ──────────────────────────────────────────────────────────
  function goBack() {
    const newForm      = document.getElementById("newUserForm");
    const existingForm = document.getElementById("existingUserForm");
    const choiceBlock  = document.getElementById("choiceBlock");

    if (newForm.style.display === "block" || existingForm.style.display === "block") {
      newForm.style.display      = "none";
      existingForm.style.display = "none";
      choiceBlock.style.display  = "block";
      clearError("message");
      clearError("existingMessage");
    } else {
      // Going all the way back to home — wipe everything
      ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));
      window.location.href = "home.html";
    }
  }
</script>
</body>
</html>
