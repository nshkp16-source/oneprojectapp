<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Project</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 24px 28px;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      margin: auto;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    h2 {
      color: #007BFF;
      font-size: clamp(18px, 5vw, 24px);
      text-align: center;
      margin-top: 0;
    }

    h3 {
      margin-top: 28px;
      color: #333;
      font-size: clamp(15px, 4vw, 18px);
    }

    input {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      -webkit-appearance: none;
    }
    input:focus { outline: none; border-color: #007BFF; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 20px;
      min-height: 50px;
    }
    button:hover { background-color: #0056b3; }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 14px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: none;
      padding: 6px 0;
      min-height: 44px;
      line-height: 32px;
    }
    .back-link:hover { color: #5a6268; }

    #message { margin-top: 10px; color: #cc0000; font-size: 14px; min-height: 18px; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .container { padding: 18px 16px; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create Project</h2>

    <form id="projectForm" onsubmit="handleProjectCreation(event)">
      <h3>Project Information</h3>
      <input type="text" id="projectName" placeholder="Project Name" required />
      <input type="text" id="projectLocation" placeholder="Project Location" required />
      <input type="text" id="contractReference" placeholder="Contract Reference" required />

      <h3>Contractor Information</h3>
      <input type="text" id="contractorCompany" placeholder="Contractor Company Name" required />
      <input type="email" id="contractorEmail" placeholder="Contractor Email" required autocomplete="off" />
      <input type="tel" id="contractorTel" placeholder="Contractor Telephone Number" required />
      <input type="text" id="contractorRepName" placeholder="Contractor Representative Name" required />
      <input type="text" id="contractorTitlePosition" placeholder="Contractor Position / Title" required />
      <input type="text" id="contractorTask" placeholder="Contractor Task (optional)" />

      <h3>Consultant Information</h3>
      <input type="text" id="consultantCompany" placeholder="Consultant Company Name" required />
      <input type="email" id="consultantEmail" placeholder="Consultant Email" required autocomplete="off" />
      <input type="tel" id="consultantTel" placeholder="Consultant Telephone Number" required />
      <input type="text" id="consultantRepName" placeholder="Consultant Representative Name" required />
      <input type="text" id="consultantTitlePosition" placeholder="Consultant Position / Title" required />
      <input type="text" id="consultantTask" placeholder="Consultant Task (optional)" />

      <button type="submit">Save Project</button>
      <p id="message"></p>
    </form>

    <span class="back-link" onclick="goBack()">&#8592; Back</span>
  </div>

<script>
  function handleProjectCreation(e) {
    e.preventDefault();
    const messageEl = document.getElementById("message");
    try {
      let projectDetails = JSON.parse(localStorage.getItem("projectDetails")) || {};

      projectDetails.project = {
        name: document.getElementById("projectName").value.trim(),
        location: document.getElementById("projectLocation").value.trim(),
        contract_reference: document.getElementById("contractReference").value.trim()
      };
      projectDetails.contractor = {
        company_name: document.getElementById("contractorCompany").value.trim(),
        email: document.getElementById("contractorEmail").value.trim().toLowerCase(),
        telephone: document.getElementById("contractorTel").value.trim(),
        representative: document.getElementById("contractorRepName").value.trim(),
        title_position: document.getElementById("contractorTitlePosition").value.trim(),
        task: document.getElementById("contractorTask").value.trim() || null
      };
      projectDetails.consultant = {
        company_name: document.getElementById("consultantCompany").value.trim(),
        email: document.getElementById("consultantEmail").value.trim().toLowerCase(),
        telephone: document.getElementById("consultantTel").value.trim(),
        representative: document.getElementById("consultantRepName").value.trim(),
        title_position: document.getElementById("consultantTitlePosition").value.trim(),
        task: document.getElementById("consultantTask").value.trim() || null
      };

      localStorage.setItem("projectDetails", JSON.stringify(projectDetails));
      alert("Project captured successfully! Redirecting to finalize...");
      window.location.href = "finalize-account.html";
    } catch (err) {
      console.error(err);
      messageEl.textContent = "Unexpected error. Please try again.";
    }
  }

  function goBack() {
    window.location.href = "create-project-account.html";
  }
</script>
</body>
</html>
