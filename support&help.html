<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support & Help – OneProjectApp</title>
  <style>
    :root {
      --teal:     #007B8A;
      --darkblue: #003366;
      --mayablue: #73C2FB;
      --softblue: #e6f0fa;
      --border:   #e2e8f0;
      --text:     #1a2b3c;
      --muted:    #5a6c7d;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: Arial, sans-serif;
      background: url('dashboard-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: rgba(0,60,80,0.10);
      backdrop-filter: blur(1px); z-index: 0;
    }

    /* ── Page wrapper ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 14px 64px;
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%; max-width: 900px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
      gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
      background: var(--teal); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold;
    }
    .brand-name {
      color: #fff; font-size: 13px; font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .back-btn {
      background: rgba(255,255,255,.92); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 9px 14px; font-size: 13px;
      color: var(--teal); cursor: pointer; font-weight: 700;
      text-decoration: none; display: flex; align-items: center; gap: 5px;
      white-space: nowrap; flex-shrink: 0;
      min-height: 44px; /* touch target */
      transition: background .15s;
    }
    .back-btn:hover  { background: #fff; }
    .back-btn:active { background: #e8f4ff; }

    /* ── Banner ── */
    .banner {
      width: 100%; max-width: 900px;
      background: linear-gradient(135deg, var(--teal) 0%, var(--darkblue) 100%);
      border-radius: 14px; padding: 20px 22px; color: #fff;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .banner-avatar {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      background: rgba(255,255,255,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .banner-meta { flex: 1; min-width: 0; }
    .banner-meta h1 { font-size: clamp(14px, 4vw, 19px); font-weight: bold; margin-bottom: 3px; line-height: 1.3; }
    .banner-meta p  { font-size: 12px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-pill {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.28);
      border-radius: 20px; padding: 5px 12px; font-size: 11px;
      flex-shrink: 0; max-width: 160px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Search ── */
    .search-wrap {
      width: 100%; max-width: 900px; position: relative; margin-bottom: 14px;
    }
    .search-wrap input {
      width: 100%; padding: 13px 14px 13px 42px;
      border-radius: 10px; border: 1.5px solid var(--border);
      font-size: 16px; /* 16px prevents iOS zoom */
      background: rgba(255,255,255,.97);
      color: var(--text); outline: none;
      -webkit-appearance: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,123,138,.12); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; pointer-events: none; }

    /* ── Tabs — horizontal scroll on mobile ── */
    .tabs {
      width: 100%; max-width: 900px;
      display: flex; gap: 7px; margin-bottom: 14px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 15px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,.88);
      font-size: 12px; font-weight: 700; color: var(--muted);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      min-height: 36px; /* comfortable touch */
      transition: all .15s;
    }
    .tab:hover, .tab.active {
      background: var(--teal); color: #fff; border-color: var(--teal);
    }
    .tab:active { opacity: .85; }

    /* ── Section label ── */
    .section-label {
      width: 100%; max-width: 900px;
      font-size: 11px; font-weight: 700; letter-spacing: .07em;
      color: rgba(255,255,255,.72); text-transform: uppercase;
      margin-bottom: 10px; padding-left: 2px;
    }

    /* ── Cards grid ── */
    .grid {
      width: 100%; max-width: 900px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .card {
      background: rgba(255,255,255,.97);
      border-radius: 12px; border: 1.5px solid var(--border);
      cursor: pointer;
      transition: box-shadow .15s, transform .15s, border-color .15s;
      overflow: hidden;
    }
    /* No hover lift on touch devices to avoid sticky states */
    @media (hover: hover) {
      .card:hover { box-shadow: 0 6px 20px rgba(0,123,138,.13); transform: translateY(-2px); border-color: var(--mayablue); }
    }
    .card:active { opacity: .92; }
    .card.open { border-color: var(--teal); }

    .card-head {
      padding: 14px 15px;
      display: flex; align-items: center; gap: 11px;
      min-height: 56px; /* comfortable touch target */
    }
    .card-ico {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
    }
    .card-text { flex: 1; min-width: 0; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--darkblue); }
    .card-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card-chevron { font-size: 18px; color: var(--muted); transition: transform .2s; flex-shrink: 0; padding: 4px; }
    .card.open .card-chevron { transform: rotate(90deg); }

    .card-body {
      display: none; padding: 0 15px 15px;
      border-top: 1px solid var(--border);
    }
    .card.open .card-body { display: block; }
    .card-body p  { font-size: 13px; line-height: 1.75; color: var(--text); margin-top: 11px; }
    .card-body ul { margin: 9px 0 0 16px; }
    .card-body li { font-size: 13px; line-height: 1.75; color: var(--muted); margin-bottom: 4px; }
    .tip  { margin-top: 11px; background: var(--softblue); border-left: 3px solid var(--teal); border-radius: 0 6px 6px 0; padding: 9px 11px; font-size: 12.5px; color: var(--darkblue); }
    .warn { margin-top: 11px; background: #fff8e1; border-left: 3px solid #f5a623; border-radius: 0 6px 6px 0; padding: 9px 11px; font-size: 12.5px; color: #7a5c00; }

    /* ── Quick links ── */
    .quick {
      width: 100%; max-width: 900px;
      background: rgba(255,255,255,.97); border-radius: 12px;
      border: 1.5px solid var(--border); padding: 16px 18px; margin-bottom: 16px;
    }
    .quick h3 { font-size: 13px; font-weight: bold; color: var(--darkblue); margin-bottom: 11px; }
    .link-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 9px 14px; border-radius: 20px;
      background: var(--softblue); color: var(--teal);
      font-size: 13px; font-weight: 700; cursor: pointer;
      border: 1px solid var(--mayablue); text-decoration: none;
      min-height: 40px; display: inline-flex; align-items: center;
      transition: background .15s;
    }
    .chip:hover  { background: var(--teal); color: #fff; border-color: var(--teal); }
    .chip:active { opacity: .85; }

    /* ── Contact card ── */
    .contact {
      width: 100%; max-width: 900px;
      background: linear-gradient(135deg, #f0faff 0%, #e6f0fa 100%);
      border-radius: 12px; border: 1.5px solid var(--mayablue);
      padding: 18px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .contact .ico { font-size: 28px; flex-shrink: 0; }
    .contact .txt { flex: 1; min-width: 0; }
    .contact .txt h3 { font-size: 13px; font-weight: bold; color: var(--darkblue); margin-bottom: 3px; }
    .contact .txt p  { font-size: 12px; color: var(--muted); }
    .contact .action {
      flex-shrink: 0; padding: 10px 18px;
      background: var(--teal); color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; min-height: 44px;
      transition: background .15s;
    }
    .contact .action:hover  { background: var(--darkblue); }
    .contact .action:active { opacity: .85; }

    /* ── No results ── */
    #noResults { display: none; text-align: center; padding: 36px 20px; color: rgba(255,255,255,.75); font-size: 14px; }
    #noResults .e { font-size: 34px; margin-bottom: 8px; }

    /* ════════════════════════════════
       RESPONSIVE BREAKPOINTS
    ════════════════════════════════ */

    /* Tablet — collapse project pill, tighten spacing */
    @media (max-width: 700px) {
      .page { padding: 14px 10px 64px; }
      .topbar { margin-bottom: 12px; }
      .banner { padding: 16px 16px; gap: 12px; border-radius: 12px; margin-bottom: 12px; }
      .banner-avatar { width: 42px; height: 42px; font-size: 21px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    }

    /* Mobile — single column, full-width everything */
    @media (max-width: 480px) {
      .page { padding: 12px 10px 56px; }

      /* Topbar: shrink brand name on very small screens */
      .brand-name { font-size: 12px; }
      .back-btn   { padding: 9px 12px; font-size: 12px; }

      /* Banner: stack avatar + text, hide pill below name */
      .banner { padding: 14px 14px; flex-wrap: wrap; gap: 10px; border-radius: 10px; }
      .project-pill { margin-left: 0; max-width: 100%; width: 100%; text-align: center; }

      /* Search: keep font-size 16px to prevent iOS zoom — already set */

      /* Tabs: full horizontal scroll, no wrap */
      .tabs { margin-bottom: 12px; }

      /* Grid: single column */
      .grid { grid-template-columns: 1fr; gap: 10px; }

      /* Cards: slightly looser text for readability */
      .card-body p, .card-body li { font-size: 13.5px; }
      .tip, .warn { font-size: 13px; }

      /* Quick links: full row wrap already handles this */
      .chip { font-size: 13px; }

      /* Contact: stack vertically */
      .contact { flex-wrap: wrap; }
      .contact .action { width: 100%; text-align: center; margin-top: 4px; }
    }

    /* Very small phones (320px) */
    @media (max-width: 360px) {
      .topbar { gap: 6px; }
      .brand-name { display: none; } /* hide text, keep badge */
      .back-btn { padding: 9px 10px; }
      .banner-meta h1 { font-size: 14px; }
      .card-head { padding: 12px 12px; }
      .card-ico { width: 36px; height: 36px; font-size: 17px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">1</div>
      <span class="brand-name">OneProjectApp</span>
    </div>
    <a class="back-btn" id="backBtn" href="#">← Back to Dashboard</a>
  </div>

  <div class="banner">
    <div class="banner-avatar" id="bannerAvatar">👤</div>
    <div class="banner-meta">
      <h1 id="bannerTitle">Support & Help Center</h1>
      <p id="bannerSub">Detecting your role…</p>
    </div>
    <div class="project-pill" id="projectPill">No project</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="searchInput" type="text" placeholder="Search help topics…" oninput="applyFilter()">
  </div>

  <div class="tabs" id="tabsRow"></div>

  <div class="section-label" id="sectionLabel">All topics</div>
  <div class="grid" id="grid"></div>
  <div id="noResults"><div class="e">🔎</div><p>No results found. Try different keywords.</p></div>

  <div class="quick" id="quickWrap">
    <h3>⚡ Quick Actions</h3>
    <div class="link-row" id="quickRow"></div>
  </div>

  <div class="contact">
    <div class="ico">💬</div>
    <div class="txt">
      <h3>Still need help?</h3>
      <p>Chat with your team or message your Project Manager directly.</p>
    </div>
    <button class="action" onclick="window.location.href='chat.html'">Open Chat</button>
  </div>

</div>

<script>
/* ── JWT ── */
function parseJwt(t) {
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch { return null; }
}
const token   = localStorage.getItem('authToken');
const decoded = parseJwt(token);
const ROLE    = decoded?.role || 'Guest';
const EMAIL   = decoded?.companyEmail || decoded?.email || '–';
const PROJ    = localStorage.getItem('activeProjectName');

const DASH_MAP = {
  'Client':                     'dashboard.html',
  'Client Project Manager':     'dashboard.html',
  'Consultant':                 'dashboard.html',
  'Consultant Project Manager': 'dashboard.html',
  'Contractor':                 'dashboard.html',
  'Contractor Project Manager': 'dashboard.html',
  'Team Member':                'dashboard.html'
};
const DASH = DASH_MAP[ROLE] || 'home.html';

const AVA = {
  'Client':'🏢','Client Project Manager':'📋',
  'Consultant':'🧠','Consultant Project Manager':'📊',
  'Contractor':'🔧','Contractor Project Manager':'🛠️','Team Member':'👷'
};

document.getElementById('backBtn').href              = DASH;
document.getElementById('bannerAvatar').textContent  = AVA[ROLE] || '👤';
document.getElementById('bannerTitle').textContent   = `Help Center — ${ROLE}`;
document.getElementById('bannerSub').textContent     = `Signed in as ${EMAIL}`;
document.getElementById('projectPill').textContent   = PROJ ? `📁 ${PROJ}` : 'No project selected';

/* ════════════════════════════════════════════════════════════════
   HELP CONTENT  (tags: sidebar | project-records | workspace | settings | meeting | arret | schedule)
════════════════════════════════════════════════════════════════ */

/* ── Sidebar nav items ─────────────────────────────────────── */
const sidebarCards = [
  {
    tags:['sidebar'],
    ico:'📄', bg:'#e8f4ff',
    title:'Project Records',
    sub:'Browse all project documents by category',
    body:`
      <p>Click <strong>Project Records</strong> in the left sidebar to open the document hub. This is the main content area where all project records are organised into category tabs across the top.</p>
      <p>The tabs you will see are:</p>
      <ul>
        <li><strong>Contractual & Legal</strong> — contracts, amendments, change orders, permits, insurance, tender documents</li>
        <li><strong>Administrative & Instructional</strong> — RFAs, consultant instructions, meeting minutes, correspondence, schedule updates</li>
        <li><strong>Safety & Compliance</strong> — safety inspections, incident reports, NCRs, QC tests, risk assessments</li>
        <li><strong>Operational & Performance</strong> — daily site reports, progress reports, BoQ, technical specs, submittals, drawings</li>
        <li><strong>Financial</strong> — interim payment certificates, contractor claims, final account reports</li>
        <li><strong>Meeting</strong> — meeting minutes and scheduled meetings (see the Meeting section below)</li>
      </ul>
      <div class="tip">💡 Click any tab to load its records. Project managers can add new records using the ➕ Add button at the top of each tab.</div>
    `
  },
  {
    tags:['sidebar','workspace'],
    ico:'📑', bg:'#f0fff4',
    title:'Workspace',
    sub:'Team collaboration, tasks and execution reports',
    body:`
      <p>Click <strong>Workspace</strong> in the sidebar to switch to the team execution area. This section has its own set of tabs:</p>
      <ul>
        <li><strong>Work Center</strong> — the Project Manager assigns tasks to team members; members pick up tasks, execute them, and submit progress updates for the PM to validate</li>
        <li><strong>Planning & Execution</strong> — the PM sets planned milestones with target dates; team members log their actual execution progress so planned vs actual can be compared</li>
        <li><strong>Document & Approval</strong> — team members draft documents or reports; the PM reviews and approves them before they become official records</li>
        <li><strong>Control & Reports</strong> — the PM consolidates all approved drafts here; team members can monitor the validated information</li>
        <li><strong>Communication & Meetings</strong> — the team's own meeting area (separate from the global project meetings in Project Records)</li>
      </ul>
      <div class="tip">💡 "Leader" means the Project Manager for your side (Client PM, Contractor PM, or Consultant PM). Only the leader can assign tasks, approve drafts, and plan meetings.</div>
      <div class="warn">⚠️ Team Members only see Workspace tasks assigned to them by their PM. You won't see tasks assigned to other sides of the project.</div>
    `
  },
  {
    tags:['sidebar','settings'],
    ico:'✏️', bg:'#fff0f6',
    title:'Edit Information',
    sub:'Update your project or company profile details',
    body:`
      <p>Click <strong>Edit Information</strong> in the sidebar to update details for your side of the project — company name, contact details, address, or project-specific fields. Changes are saved immediately to the project record.</p>
      <div class="warn">⚠️ Only authorised roles (Client, PM, Contractor, Consultant) can edit information. Team Members do not have access to this page.</div>
    `
  },
  {
    tags:['sidebar'],
    ico:'👥', bg:'#f5f0ff',
    title:'Assign Team Members',
    sub:'Add a Project Manager and team to your project',
    body:`
      <p>Click <strong>Assign Team Members</strong> in the sidebar to manage your project team. You will be asked to verify your password first, then you can:</p>
      <ul>
        <li><strong>Assign Project Manager</strong> — adds a PM for your side of the project. This can only be done once per project per side.</li>
        <li><strong>Assign Team Members</strong> — add individual team members at any time. Each member receives a login invitation by email.</li>
      </ul>
      <div class="warn">⚠️ Once a Project Manager is assigned they cannot be changed from this screen. Contact support to reassign a PM.</div>
      <div class="tip">💡 Team Members assigned here will appear in the Workspace under Work Center for the PM to assign tasks to.</div>
    `
  },
  {
    tags:['sidebar'],
    ico:'💬', bg:'#fff8f0',
    title:'Chat',
    sub:'Real-time messaging with your full project team',
    body:`
      <p>Click <strong>Chat</strong> in the sidebar to open the project messaging panel. All roles on the project can send and receive messages in real time.</p>
      <ul>
        <li>Messages are scoped to your active project — switching projects reloads the chat</li>
        <li>All team members, PMs, clients, contractors, and consultants on the same project share the same chat</li>
        <li>You can attach files in chat messages</li>
      </ul>
    `
  },
  {
    tags:['sidebar','settings'],
    ico:'⚙️', bg:'#f0f8ff',
    title:'Settings',
    sub:'Password, language, and project options',
    body:`
      <p>Click <strong>Settings</strong> (gear icon) in the sidebar to access these options:</p>
      <ul>
        <li><strong>Reset Password</strong> — sends a verification code to your email, then lets you set a new password</li>
        <li><strong>Change Language</strong> — switch the dashboard display between English and French</li>
        <li><strong>Exit Project</strong> — leave your current active project. You will need to verify your identity first. Your account remains active but you will no longer appear in this project's team.</li>
      </ul>
      <div class="tip">💡 Language changes apply only to your session and do not affect other team members.</div>
    `
  },
  {
    tags:['sidebar','settings'],
    ico:'🔒', bg:'#fff0f0',
    title:'Logout',
    sub:'End your session securely',
    body:`
      <p>Click the <strong>lock icon</strong> 🔒 at the very bottom of the sidebar to log out. Your authentication tokens are immediately cleared and you are returned to the login page.</p>
      <div class="warn">⚠️ Save any open Workspace drafts before logging out — unsaved work will be lost.</div>
    `
  }
];

/* ── Schedule & Progress panel ─────────────────────────────── */
const scheduleCards = [
  {
    tags:['schedule'],
    ico:'📅', bg:'#e8fff0',
    title:'Schedule Panel (Top Button)',
    sub:'View and manage the project timeline',
    body:`
      <p>The <strong>Schedule</strong> button sits at the top of the left summary panel (below the date/time and weather). Clicking it opens the full project schedule in the expanded panel on the right. What happens depends on the project state:</p>
      <ul>
        <li><strong>No schedule yet</strong> — the PM or Client can create the project timeline: set milestones with planned start/end dates, add a project location, and define the overall timeline duration. Click <em>Save Schedule</em> to publish it.</li>
        <li><strong>Schedule exists</strong> — opens the Actual Progress page where you can log real completion percentages against each milestone, upload site photos, and request timeline extensions.</li>
      </ul>
      <div class="tip">💡 Extensions must be filled in with a reason and number of days. They are visible to all parties on the project.</div>
      <div class="warn">⚠️ Only the Client or Project Manager can create or edit the schedule. Team Members can view it but cannot modify it.</div>
    `
  },
  {
    tags:['schedule'],
    ico:'📊', bg:'#f0f8ff',
    title:'Summary Panel (Left Column)',
    sub:'Live project snapshot — milestones, progress & weather',
    body:`
      <p>The left column of the dashboard always shows a live summary of your project:</p>
      <ul>
        <li><strong>Date & Time</strong> — current date and clock, updated live</li>
        <li><strong>Project Location</strong> — the location set when the schedule was created</li>
        <li><strong>Weather</strong> — current conditions and a short forecast for the project location</li>
        <li><strong>Remaining Days</strong> — calendar days left until the project's planned end date</li>
        <li><strong>Current Milestone</strong> — the milestone that is currently active based on today's date</li>
        <li><strong>Last Completed Milestone</strong> — the most recently marked-complete milestone</li>
        <li><strong>Overall Progress</strong> — the percentage of work completed across all milestones, shown as a number and a green progress bar</li>
        <li><strong>Variance</strong> — how far ahead or behind schedule the project is</li>
        <li><strong>Milestone Chart</strong> — a mini bar chart showing progress per milestone. Click the chart to expand it full-screen.</li>
        <li><strong>Site Photos</strong> — the latest photos uploaded via milestone progress updates</li>
      </ul>
    `
  }
];

/* ── ARRET ────────────────────────────────────────────────── */
const arretCards = [
  {
    tags:['arret'],
    ico:'🛑', bg:'#fff0f0',
    title:'ARRET — Stop-Work Notices',
    sub:'Report and track site stop-work orders',
    body:`
      <p>The red <strong>🛑 ARRET</strong> button appears in the top bar of the dashboard. "Arret" means a formal stop-work order — used to flag a situation where work on site must halt due to safety, quality, or contractual reasons.</p>
      <p><strong>How to use it:</strong></p>

// Team Members don't see arret card (no access)

const ALL_CARDS = [
  ...roleSpecific,
  ...sidebarCards,
  ...scheduleCards,
  ...(showArret ? arretCards : []),
  ...meetingCards,
  ...workspaceCards,
  ...generalCards
];

/* ── Tabs ── */
const TAB_DEFS = [
  { key:'all',              label:'All Topics' },
  { key:'sidebar',          label:'Sidebar Menu' },
  { key:'schedule',         label:'Schedule & Progress' },
  { key:'arret',            label:'🛑 Arret' },
  { key:'meeting',          label:'Meetings' },
  { key:'workspace',        label:'Workspace' },
  { key:'settings',         label:'Settings & Profile' },
  { key:'project-records',  label:'Project Records' },
];

const tabsRow = document.getElementById('tabsRow');
TAB_DEFS.filter(t => t.key === 'all' || ALL_CARDS.some(c => c.tags.includes(t.key))).forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (t.key === 'all' ? ' active' : '');
  btn.textContent = t.label;
  btn.dataset.key = t.key;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = t.key;
    document.getElementById('sectionLabel').textContent =
      t.key === 'all' ? 'All topics' : t.label;
    applyFilter();
  });
  tabsRow.appendChild(btn);
});

let activeTab = 'all';

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = ALL_CARDS.filter(c => {
    const matchTab  = activeTab === 'all' || c.tags.includes(activeTab);
    const matchQ    = !q ||
      c.title.toLowerCase().includes(q) ||
      c.sub.toLowerCase().includes(q) ||
      c.body.replace(/<[^>]+>/g,' ').toLowerCase().includes(q);
    return matchTab && matchQ;
  });
  renderCards(filtered);
}

function renderCards(list) {
  const grid  = document.getElementById('grid');
  const noRes = document.getElementById('noResults');
  grid.innerHTML = '';
  if (!list.length) { noRes.style.display = 'block'; return; }
  noRes.style.display = 'none';
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-head">
        <div class="card-ico" style="background:${c.bg}">${c.ico}</div>
        <div><div class="card-title">${c.title}</div><div class="card-sub">${c.sub}</div></div>
        <span class="card-chevron">›</span>
      </div>
      <div class="card-body">${c.body}</div>`;
    div.querySelector('.card-head').addEventListener('click', () => {
      const wasOpen = div.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(el => el.classList.remove('open'));
      if (!wasOpen) div.classList.add('open');
    });
    grid.appendChild(div);
  });
}
