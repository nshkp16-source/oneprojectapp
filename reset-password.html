<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Verification</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6); z-index: 0;
    }

    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 28px 24px; border-radius: 12px;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 { color: #007BFF; margin: 0 0 14px; font-size: clamp(18px, 5vw, 22px); }
    h3 { color: #333; font-size: clamp(15px, 4vw, 18px); margin-top: 0; }

    #infoText {
      font-size: 13px; color: #555; word-break: break-word;
      margin-bottom: 12px; line-height: 1.6;
    }

    .otp-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
    .code {
      width: clamp(36px, 11vw, 44px);
      height: clamp(42px, 12vw, 50px);
      text-align: center;
      font-size: clamp(16px, 4vw, 20px);
      border-radius: 6px;
      border: 1.5px solid #ccc;
      -webkit-appearance: none;
      padding: 0;
    }
    .code:focus { outline: none; border-color: #007BFF; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }

    .password {
      display: block; width: 100%; margin: 10px 0;
      padding: 12px 14px; font-size: 15px;
      border-radius: 6px; border: 1px solid #ccc;
      -webkit-appearance: none;
    }
    .password:focus { outline: none; border-color: #007BFF; box-shadow: 0 0 0 2px rgba(0,123,255,0.2); }

    button {
      background-color: #007BFF; color: white;
      border: none; padding: 13px; width: 100%;
      cursor: pointer; border-radius: 6px;
      font-size: 16px; margin-top: 16px; min-height: 48px;
    }
    button:hover { background-color: #0056b3; }

    #message { margin-top: 8px; font-size: 14px; min-height: 18px; }
    #timer   { margin-top: 8px; font-size: 13px; color: #cc0000; }

    .back-link {
      display: inline-block; margin-top: 16px;
      font-size: 14px; color: #6c757d; cursor: pointer;
      padding: 8px; min-height: 44px; line-height: 28px;
    }
    .back-link:hover { color: #5a6268; }

    .alert-box {
      border-radius: 6px; padding: 12px;
      margin-top: 12px; font-size: 14px; text-align: left;
    }

    @media (max-width: 400px) {
      .container { padding: 20px 14px; }
      body { padding: 10px; align-items: flex-start; padding-top: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Password</h2>
    <p id="infoText"></p>

    <!-- Verification Block -->
    <div id="verificationBlock">
      <p style="color:#007BFF; font-size:13px; margin-bottom:10px;">
        Enter the 6-digit reset code sent to your email.
      </p>
      <div class="otp-row">
        <input id="digit1" maxlength="1" class="code" type="text" inputmode="numeric">
        <input id="digit2" maxlength="1" class="code" type="text" inputmode="numeric">
        <input id="digit3" maxlength="1" class="code" type="text" inputmode="numeric">
        <input id="digit4" maxlength="1" class="code" type="text" inputmode="numeric">
        <input id="digit5" maxlength="1" class="code" type="text" inputmode="numeric">
        <input id="digit6" maxlength="1" class="code" type="text" inputmode="numeric">
      </div>
      <p id="message"></p>
      <p id="timer"></p>
      <button id="resendBtn" style="display:none;" onclick="resendCode()">Resend Code</button>
      <div><span class="back-link" onclick="goBack()">&#8592; Back</span></div>
    </div>

    <!-- Password Block -->
    <div id="passwordBlock" style="display:none;">
      <h3>Create New Password</h3>
      <input type="password" id="newPassword"     class="password" placeholder="New Password"      required />
      <input type="password" id="confirmPassword" class="password" placeholder="Confirm Password"  required />
      <button onclick="savePassword()">Save Password</button>
    </div>
  </div>

<script>
  // ──────────────────────────────────────────────────────────────
  // KEY FIX: read the keys the dashboard actually writes.
  // The dashboard stores: resetEmail / resetRole
  // Older code used:      pendingEmail / pendingRole
  // We support BOTH for backwards-compatibility.
  // ──────────────────────────────────────────────────────────────
  const email = localStorage.getItem("resetEmail")   || localStorage.getItem("pendingEmail")   || "";
  const role  = localStorage.getItem("resetRole")    || localStorage.getItem("pendingRole")    || "";

  // If we still have no email, try to recover from the auth token
  function parseJwtLocal(token) {
    try {
      const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b));
    } catch { return null; }
  }

  let resolvedEmail = email;
  let resolvedRole  = role;

  if (!resolvedEmail || !resolvedRole) {
    const tok     = localStorage.getItem("authToken");
    const decoded = tok ? parseJwtLocal(tok) : null;
    if (decoded) {
      resolvedEmail = resolvedEmail || decoded.email || "";
      resolvedRole  = resolvedRole  || decoded.role  || "";
    }
  }

  // If we truly cannot determine email/role, show a friendly message
  // instead of crashing with "Missing reset context".
  if (!resolvedEmail) {
    document.getElementById("infoText").textContent =
      "Could not determine your account. Please go back to the login page and try again.";
    document.getElementById("verificationBlock").style.display = "none";
    appendBackLink();
    // Stop further execution
    throw new Error("No reset context found.");
  }

  document.getElementById("infoText").textContent =
    `Resetting password for ${resolvedRole ? resolvedRole + " account: " : ""}${resolvedEmail}`;

  // ──────────────────────────────────────────────────────────────
  let resendCount = 0;
  let countdown;

  window.onload = async () => {
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/reset-send", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email: resolvedEmail, role: resolvedRole })
      });
      const data = await res.json();
      if (data.success) {
        startCountdown(new Date(data.expiresAt));
        attachAutoVerify();
      } else {
        showAlert(data.error || "Reset failed.", "error");
        document.getElementById("verificationBlock").style.display = "none";
        appendBackLink();
      }
    } catch {
      showAlert("Server error. Please try again.", "error");
    }
  };

  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "");
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getCode().length === 6) verifyCode();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && idx > 0) inputs[idx - 1].focus();
      });
    });
  }

  function getCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) code += document.getElementById("digit" + i).value.trim();
    return code;
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/reset-verify", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email: resolvedEmail, token: code })
      });
      const data = await res.json();
      if (!data.success) {
        showAlert(data.error || "Invalid code.", "error");
        document.getElementById("resendBtn").style.display = "block";
        return;
      }
      clearInterval(countdown);
      document.getElementById("verificationBlock").style.display = "none";
      document.getElementById("passwordBlock").style.display     = "block";
    } catch {
      showAlert("Server error. Please try again.", "error");
    }
  }

  async function savePassword() {
    const pass1 = document.getElementById("newPassword").value.trim();
    const pass2 = document.getElementById("confirmPassword").value.trim();
    if (!pass1 || !pass2) return showAlert("Fill all fields.", "error");
    if (pass1 !== pass2)  return showAlert("Passwords do not match.", "error");
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/reset-set-password", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email: resolvedEmail, password: pass1, role: resolvedRole })
      });
      const data = await res.json();
      if (!data.success) { showAlert(data.error || "Reset failed.", "error"); return; }

      showAlert("Password reset successfully!", "success");

      if (data.accessToken && data.refreshToken) {
        localStorage.setItem("authToken",    data.accessToken);
        localStorage.setItem("refreshToken", data.refreshToken);
      }

      // Clean up all reset keys (both naming conventions)
      localStorage.removeItem("resetEmail");
      localStorage.removeItem("resetRole");
      localStorage.removeItem("pendingEmail");
      localStorage.removeItem("pendingRole");

      setTimeout(() => redirectToDashboard(resolvedRole), 1500);
    } catch {
      showAlert("Server error. Please try again.", "error");
    }
  }

  async function resendCode() {
    if (resendCount >= 2) {
      showAlert("All attempts failed. Please return to Home.", "error");
      document.getElementById("resendBtn").style.display = "none";
      return;
    }
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/reset-resend", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email: resolvedEmail, role: resolvedRole })
      });
      const data = await res.json();
      if (data.success) {
        showAlert("New code sent! Check your email.", "success");
        resendCount++;
        for (let i = 1; i <= 6; i++) document.getElementById("digit" + i).value = "";
        document.getElementById("timer").textContent        = "";
        document.getElementById("resendBtn").style.display  = "none";
        startCountdown(new Date(data.expiresAt));
      } else {
        showAlert(data.error || "Reset failed.", "error");
        document.getElementById("verificationBlock").style.display = "none";
        appendBackLink();
      }
    } catch {
      showAlert("Server error. Please try again.", "error");
    }
  }

  function startCountdown(expiry) {
    clearInterval(countdown);
    countdown = setInterval(() => {
      const diff = Math.floor((expiry - new Date()) / 1000);
      if (diff <= 0) {
        clearInterval(countdown);
        document.getElementById("timer").textContent       = "Code expired.";
        document.getElementById("resendBtn").style.display = "block";
      } else {
        const m = Math.floor(diff / 60);
        const s = diff % 60;
        document.getElementById("timer").textContent =
          `Code expires in ${m}:${s.toString().padStart(2, "0")}`;
      }
    }, 1000);
  }

  function redirectToDashboard(r) {
    const map = {
      "Client":                      "dashboard.html",
      "Client Project Manager":      "dashboard.html",
      "Consultant":                  "dashboard.html",
      "Consultant Project Manager":  "dashboard.html",
      "Contractor":                  "dashboard.html",
      "Contractor Project Manager":  "dashboard.html",
      "Team Member":                 "dashboard.html"
    };
    window.location.href = map[r] || "home.html";
  }

  function goBack() { window.location.href = "home.html"; }

  function appendBackLink() {
    const d = document.createElement("div");
    d.innerHTML = '<span class="back-link" onclick="goBack()">&#8592; Back to Login</span>';
    document.querySelector(".container").appendChild(d);
  }

  function showAlert(message, type) {
    const container = document.querySelector(".container");
    let alertBox = document.querySelector(".alert-box");
    if (!alertBox) {
      alertBox = document.createElement("div");
      alertBox.className = "alert-box";
      container.insertBefore(alertBox, container.firstChild.nextSibling);
    }
    alertBox.textContent = message;
    if (type === "success") {
      alertBox.style.cssText =
        "background:#d4edda;color:#155724;border:1px solid #c3e6cb;" +
        "border-radius:6px;padding:12px;margin-top:12px;font-size:14px;text-align:left;";
    } else {
      alertBox.style.cssText =
        "background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;" +
        "border-radius:6px;padding:12px;margin-top:12px;font-size:14px;text-align:left;";
    }
  }

  function parseJwt(token) {
    try {
      const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b));
    } catch { return null; }
  }
</script>
</body>
</html>
