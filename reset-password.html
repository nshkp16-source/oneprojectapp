<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6); z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 30px; border-radius: 10px;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 { color: #007BFF; margin-bottom: 20px; }
    input {
      display: block; width: 90%; margin: 10px auto;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 12px; width: 90%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
    #message { margin-top: 10px; color: #cc0000; font-size: 14px; min-height: 18px; }
    #timer { margin-top: 10px; font-size: 14px; color: #cc0000; }
    .back-link {
      display: inline-block; margin-top: 20px;
      font-size: 14px; color: #6c757d; cursor: pointer;
      text-decoration: none;
    }
    .back-link:hover { color: #5a6268; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Your Password</h2>
    <p id="infoText"></p>
    <input type="password" id="newPassword" placeholder="New Password" required />
    <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
    <input type="text" id="verificationCode" placeholder="Enter verification code" required />
    <button onclick="verifyAndSave()">Verify & Save Password</button>
    <p id="message"></p>
    <p id="timer"></p>
    <button id="resendBtn" style="display:none;" onclick="resendCode()">Resend Code</button>
    <div><span class="back-link" onclick="goBack()">&#8592; Back</span></div>
  </div>

<script>
  const email = localStorage.getItem("pendingEmail");
  const role = localStorage.getItem("pendingRole");
  if (!email || !role) {
    alert("Missing reset context. Please request a new reset.");
    window.location.href = "home.html";
  }
  document.getElementById("infoText").textContent = `Resetting password for ${role} account: ${email}`;

  let resendCount = 0;
  let countdown;

  function isValidPassword(password) {
    const regex = /^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z\\d\\S]{6,}$/;
    return regex.test(password);
  }

  async function verifyAndSave() {
    const pass1 = document.getElementById("newPassword").value.trim();
    const pass2 = document.getElementById("confirmPassword").value.trim();
    const code = document.getElementById("verificationCode").value.trim();
    const messageEl = document.getElementById("message");

    if (!pass1 || !pass2 || !code) {
      messageEl.textContent = "Please fill in all fields.";
      return;
    }
    if (pass1 !== pass2) {
      messageEl.textContent = "Passwords do not match.";
      return;
    }
    if (!isValidPassword(pass1)) {
      messageEl.textContent = "Password must be at least 6 characters and include both letters and numbers.";
      return;
    }

    startCountdown();

    try {
      // Step 1: initiate reset (store pending password + send code)
      await fetch("https://oneprojectapp-backend.onrender.com/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass1 })
      });

      // Step 2: verify code automatically
      const res = await fetch("https://oneprojectapp-backend.onrender.com/verify-password-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: code })
      });
      const data = await res.json();

      if (!data.success) {
        messageEl.textContent = data.error || "Invalid code. Try again before time expires.";
        document.getElementById("resendBtn").style.display = "block";
        return;
      }

      clearInterval(countdown);
      alert("Password reset successfully!");
      localStorage.removeItem("pendingEmail");
      localStorage.removeItem("pendingRole");
      redirectToDashboard(role);
    } catch (err) {
      messageEl.textContent = "Server error. Please try again.";
    }
  }

  function startCountdown() {
    let timeLeft = 179; // 2:59 minutes
    const timerEl = document.getElementById("timer");
    countdown = setInterval(() => {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerEl.textContent = `Code expires in ${minutes}:${seconds.toString().padStart(2,"0")}`;
      timeLeft--;
      if (timeLeft < 0) {
        clearInterval(countdown);
        timerEl.textContent = "Code expired.";
        document.getElementById("resendBtn").style.display = "block";
      }
    }, 1000);
  }

  async function resendCode() {
    if (resendCount >= 2) {
      document.getElementById("message").textContent = "All attempts failed. Please return to Home.";
      document.getElementById("resendBtn").style.display = "none";
      return;
    }
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        alert("New code sent! Check your email.");
        resendCount++;
        startCountdown();
      } else {
        alert(data.error || "Failed to resend code.");
      }
    } catch (err) {
      alert("Server error. Please try again.");
    }
  }

  function redirectToDashboard(role) {
    switch (role) {
      case "client": window.location.href = "create-project.html"; break;
      case "consultant": window.location.href = "consultant-dashboard.html"; break;
      case "consultant_pm": window.location.href = "consultant-project-manager.html"; break;
      case "contractor": window.location.href = "contractor-dashboard.html"; break;
      case "contractor_pm": window.location.href = "contractor-project-manager.html"; break;
      case "team_member": window.location.href = "sub-contractor-dashboard.html"; break;
      default: window.location.href = "home.html";
    }
  }

  function goBack() {
    window.location.href = "home.html";
  }
</script>
</body>
</html>
