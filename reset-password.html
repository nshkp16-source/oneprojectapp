<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Verification</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.6); z-index: 0;
    }
    .container {
      position: relative; z-index: 1;
      background: #fff; padding: 30px; border-radius: 10px;
      max-width: 420px; width: 100%;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 { color: #007BFF; margin-bottom: 20px; }
    .code {
      width: 32px; height: 32px;
      margin: 3px; font-size: 18px;
      text-align: center; border-radius: 4px; border: 1px solid #ccc;
    }
    .password {
      display: block; width: 90%; margin: 10px auto;
      padding: 12px; font-size: 15px;
      border-radius: 5px; border: 1px solid #ccc;
    }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 12px; width: 90%;
      cursor: pointer; border-radius: 5px;
      font-size: 16px; margin-top: 20px;
    }
    button:hover { background-color: #0056b3; }
    #message { margin-top: 10px; color: #cc0000; font-size: 14px; min-height: 18px; }
    #timer { margin-top: 10px; font-size: 14px; color: #cc0000; }
    .back-link { display: inline-block; margin-top: 20px; font-size: 14px; color: #6c757d; cursor: pointer; }
    .back-link:hover { color: #5a6268; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Password</h2>
    <p id="infoText"></p>

    <!-- Verification Block -->
    <div id="verificationBlock">
      <p style="color:#007BFF; font-size:13px; margin-bottom:8px;">
        Enter the 6-digit reset code sent to your email.
      </p>
      <div style="display:flex; justify-content:center;">
        <input id="digit1" maxlength="1" class="code">
        <input id="digit2" maxlength="1" class="code">
        <input id="digit3" maxlength="1" class="code">
        <input id="digit4" maxlength="1" class="code">
        <input id="digit5" maxlength="1" class="code">
        <input id="digit6" maxlength="1" class="code">
      </div>
      <p id="message"></p>
      <p id="timer"></p>
      <button id="resendBtn" style="display:none;" onclick="resendCode()">Resend Code</button>
      <div><span class="back-link" onclick="goBack()">&#8592; Back</span></div>
    </div>

    <!-- Password Block -->
    <div id="passwordBlock" style="display:none;">
      <h3>Create New Password</h3>
      <input type="password" id="newPassword" class="password" placeholder="New Password" required />
      <input type="password" id="confirmPassword" class="password" placeholder="Confirm Password" required />
      <button onclick="savePassword()">Save Password</button>
      <p id="message"></p>
    </div>
  </div>

<script>
  const email = localStorage.getItem("pendingEmail");
  const role = localStorage.getItem("pendingRole");
  if (!email || !role) {
    alert("Missing reset context. Please try again.");
    window.location.href = "home.html";
  }
  document.getElementById("infoText").textContent = `Resetting password for ${role} account: ${email}`;

  let resendCount = 0;
  let countdown;

  // Send reset code immediately on page load
  window.onload = async () => {
    const res = await fetch("https://oneprojectapp-backend.onrender.com/reset-send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.success) {
      const expiry = new Date(data.expiresAt);
      startCountdown(expiry);   // Start countdown synced with backend expiry
      attachAutoVerify();       // Enable auto verification
    }
  };

  function attachAutoVerify() {
    const inputs = document.querySelectorAll(".code");
    inputs.forEach((input, idx) => {
      input.addEventListener("input", () => {
        if (input.value.length === 1 && idx < 5) inputs[idx + 1].focus();
        if (getCode().length === 6) verifyCode(); // Auto verify when all digits entered
      });
    });
  }

  function getCode() {
    let code = "";
    for (let i = 1; i <= 6; i++) code += document.getElementById("digit" + i).value.trim();
    return code;
  }

  async function verifyCode() {
    const code = getCode();
    if (code.length !== 6) return;
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/reset-verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: code })
      });
      const data = await res.json();
      if (!data.success) {
        document.getElementById("message").textContent = data.error || "Invalid code.";
        document.getElementById("resendBtn").style.display = "block";
        return;
      }
      clearInterval(countdown); // Stop countdown once verified
      document.getElementById("verificationBlock").style.display = "none";
      document.getElementById("passwordBlock").style.display = "block";
    } catch (err) {
      document.getElementById("message").textContent = "Server error. Please try again.";
    }
  }

  async function savePassword() {
    const pass1 = document.getElementById("newPassword").value.trim();
    const pass2 = document.getElementById("confirmPassword").value.trim();
    if (!pass1 || !pass2) return document.getElementById("message").textContent = "Fill all fields.";
    if (pass1 !== pass2) return document.getElementById("message").textContent = "Passwords do not match.";
    try {
      await fetch("https://oneprojectapp-backend.onrender.com/reset-set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pass1 })
      });
      alert("Password reset successfully!");
      localStorage.removeItem("pendingEmail");
      localStorage.removeItem("pendingRole");
      redirectToDashboard(role);
    } catch (err) {
      document.getElementById("message").textContent = "Server error. Please try again.";
    }
  }

  async function resendCode() {
    if (resendCount >= 2) {
      document.getElementById("message").textContent = "All attempts failed. Please return to Home.";
      document.getElementById("resendBtn").style.display = "none";
      return;
    }
    try {
      const res = await fetch("https://oneprojectapp-backend.onrender.com/reset-resend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        alert("New code sent! Check your email.");
        resendCount++;

        // Clear all code inputs
        for (let i = 1; i <= 6; i++) document.getElementById("digit" + i).value = "";

        // Clear error message and timer
        document.getElementById("message").textContent = "";
        document.getElementById("timer").textContent = "";

        // Hide resend button until needed again
        document.getElementById("resendBtn").style.display = "none";

        // Restart countdown with new expiry
        const expiry = new Date(data.expiresAt);
        startCountdown(expiry);
      }
    } catch (err) {
      alert("Server error. Please try again.");
    }
  }

  function startCountdown(expiry) {
    clearInterval(countdown);
    countdown = setInterval(() => {
      const diff = Math.floor((expiry - new Date()) / 1000);
      if (diff <= 0) {
        clearInterval(countdown);
        document.getElementById("timer").textContent = "Code expired.";
        document.getElementById("resendBtn").style.display = "block";
      } else {
        const minutes = Math.floor(diff / 60);
        const seconds = diff % 60;
        document.getElementById("timer").textContent =
          `Code expires in ${minutes}:${seconds.toString().padStart(2,"0")}`;
      }
    }, 1000);
  }

  function redirectToDashboard(role) {
    switch (role) {
      case "Client": window.location.href = "create-project.html"; break;
      case "Consultant": window.location.href = "consultant-dashboard.html"; break;
      case "Consultant Project Manager": window.location.href = "consultant-project-manager.html"; break;
      case "Contractor": window.location.href = "contractor-dashboard.html"; break;
      case "Contractor Project Manager": window.location.href = "contractor-project-manager.html"; break;
      case "Team Member": window.location.href = "team.html"; break;
      default: window.location.href = "home.html";
    }
  }

  function goBack() {
    window.location.href = "home.html";
  }
</script>
</body>
</html>
