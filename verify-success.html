<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verified Successfully</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    .container {
      background: #fff; padding: 40px;
      border-radius: 12px; width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #28a745; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    button {
      background-color: #28a745; color: white;
      border: none; padding: 12px; width: 100%;
      cursor: pointer; border-radius: 5px;
      font-size: 15px; margin-top: 10px;
    }
    button:hover { background-color: #1e7e34; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Email Verified!</h2>
    <p>Your account has been successfully verified and saved.</p>
    <p>You can now access your dashboard.</p>

    <!-- Continue button -->
    <button onclick="goToDashboard()">Go to Dashboard</button>
  </div>

  <script>
    // ✅ Immediately clean LocalStorage on page load
    window.onload = () => {
      localStorage.removeItem("projectDetails");
      localStorage.removeItem("projectAccount");
      localStorage.removeItem("resendAttempts");
    };

    function goToDashboard() {
      // Just navigation, saving already handled by backend
      window.location.href = "client-dashboard.html";
    }
  </script>
</body>
</html>
