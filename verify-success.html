<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verified Successfully</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    .container {
      background: #fff; padding: 40px;
      border-radius: 12px; width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      position: relative;
      transition: opacity 1s ease-out;
    }
    h2 { color: #28a745; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    #loadingBar {
      position: absolute; bottom: 0; left: 0;
      height: 5px; width: 0;
      background-color: #28a745;
      transition: width 3s linear;
    }
    #countdown {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container" id="successBox">
    <h2>Email Verified!</h2>
    <p>Your account has been successfully verified and saved.</p>
    <p>You will be redirected to your dashboard shortly.</p>

    <div id="loadingBar"></div>
    <p id="countdown">Redirecting in 3 seconds...</p>
  </div>

  <script>
    async function commitData() {
      const projectDetails = JSON.parse(localStorage.getItem("projectDetails") || "{}");
      const sessionId = localStorage.getItem("sessionId");
      const code = localStorage.getItem("verificationCode"); // store this when user enters code

      if (!projectDetails.client?.company_email || !sessionId || !code) {
        console.error("Missing verification data.");
        return;
      }

      try {
        const res = await fetch("https://oneprojectapp-backend.onrender.com/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: projectDetails.client.company_email,
            sessionId,
            code,
            client: projectDetails.client,
            project: projectDetails.project,
            contractor: projectDetails.contractor,
            consultant: projectDetails.consultant,
            team_members: projectDetails.team_members
          })
        });

        const data = await res.json();
        if (!data.success) {
          console.error("Verification commit failed:", data.error);
        }
      } catch (err) {
        console.error("Commit error:", err);
      }
    }

    window.onload = () => {
      // ✅ Commit data to backend
      commitData();

      // ✅ Clean LocalStorage after commit
      localStorage.removeItem("projectDetails");
      localStorage.removeItem("projectAccount");
      localStorage.removeItem("resendAttempts");
      localStorage.removeItem("verificationCode");

      // Start loading bar animation
      const bar = document.getElementById("loadingBar");
      setTimeout(() => { bar.style.width = "100%"; }, 100);

      // Countdown text
      let seconds = 3;
      const countdownEl = document.getElementById("countdown");
      const interval = setInterval(() => {
        seconds--;
        countdownEl.textContent = `Redirecting in ${seconds} seconds...`;
        if (seconds <= 0) clearInterval(interval);
      }, 1000);

      // Fade out container just before redirect
      const box = document.getElementById("successBox");
      setTimeout(() => { box.style.opacity = "0"; }, 2500);

      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = "client-dashboard.html";
      }, 3000);
    };
  </script>
</body>
</html>
