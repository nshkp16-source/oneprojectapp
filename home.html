<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - OneProjectApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* ── Welcome card ── */
    .welcome-box {
      background: #fff;
      border-radius: 14px;
      padding: 32px 28px;
      margin-top: clamp(24px, 8vh, 80px);
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      width: 100%;
      max-width: 340px;
    }

    .welcome-box h2 {
      color: #0052AA;
      font-size: clamp(18px, 4vw, 22px);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .welcome-box p {
      color: #555;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .welcome-box .btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 13px;
      font-size: 15px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: #007BFF;
      color: #fff;
      font-weight: 600;
      transition: background 0.2s;
    }
    .welcome-box .btn:hover  { background: #0056b3; }
    .welcome-box .btn:active { background: #004494; }

    /* ── Modal backdrop ── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }

    /* ── Modal card ── */
    .modal-content {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 380px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 16px;
      font-size: 22px;
      cursor: pointer;
      color: #666;
      line-height: 1;
      border: none;
      background: none;
      padding: 4px;
    }
    .modal-close:hover { color: #333; }

    .modal-content h3 {
      color: #007BFF;
      font-size: 18px;
      margin-bottom: 18px;
      text-align: center;
    }

    /* ── Form elements inside modal ── */
    .modal-content select,
    .modal-content input[type="email"],
    .modal-content input[type="password"] {
      display: block;
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-content select:focus,
    .modal-content input:focus { border-color: #007BFF; }

    .modal-content .modal-btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .modal-content .modal-btn:hover  { background: #0056b3; }
    .modal-content .modal-btn:active { background: #004494; }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #007BFF;
      cursor: pointer;
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }

    #notification {
      display: none;
      background: #e8f4ff;
      border: 1px solid #b3d7ff;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #0056b3;
      margin-bottom: 8px;
      text-align: left;
    }

    #message {
      color: #cc0000;
      font-size: 13px;
      min-height: 18px;
      margin-top: 8px;
      text-align: center;
    }

    /* ── Loading bar (top strip) ── */
    #loadingBar {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0;
      background: #007BFF;
      z-index: 999;
      transition: width 1.4s ease-in-out;
    }

    /* ── Mobile tweaks ── */
    @media (max-width: 400px) {
      .welcome-box { padding: 28px 18px; }
      .modal-content { padding: 24px 16px 20px; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <!-- Welcome card -->
  <div class="welcome-box">
    <h2>Welcome to OneProjectApp</h2>
    <p>Choose an option to get started:</p>
    <button class="btn" onclick="handleCreateAccount()">Create Account</button>
    <button class="btn" onclick="openModal()">Log In</button>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-label="Login">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
      <h3 id="modalTitle">Select Role</h3>

      <!-- Step 1: Role selection -->
      <div id="roleSelection">
        <select id="role" aria-label="Select your role">
          <option value="">-- Choose Role --</option>
          <option value="client">Client</option>
          <option value="client_pm">Client Project Manager</option>
          <option value="consultant">Consultant</option>
          <option value="consultant_pm">Consultant Project Manager</option>
          <option value="contractor">Contractor</option>
          <option value="contractor_pm">Contractor Project Manager</option>
          <option value="team_member">Team Member</option>
        </select>
        <button class="modal-btn" onclick="showLoginForm()">Continue</button>
      </div>

      <!-- Step 2: Credentials -->
      <div id="loginForm" style="display:none;">
        <div id="notification">
          First login: set any password with at least 6 characters including both letters and numbers.
        </div>
        <input type="email"    id="email"    placeholder="Your email address" autocomplete="email">
        <input type="password" id="password" placeholder="Your password"      autocomplete="current-password">
        <button class="modal-btn" onclick="validateLogin()">Log In</button>
        <a class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
        <p id="message"></p>
      </div>
    </div>
  </div>

<script>
  let selectedRole = "";

  const roleMap = {
    client:         "Client",
    client_pm:      "Client Project Manager",
    consultant:     "Consultant",
    consultant_pm:  "Consultant Project Manager",
    contractor:     "Contractor",
    contractor_pm:  "Contractor Project Manager",
    team_member:    "Team Member"
  };

  // Keys used only during account-creation flow
  const ACCOUNT_CREATION_KEYS = [
    "projectDetails", "clientEmail", "resendAttempts",
    "sessionId", "verificationCode", "projectAccount"
  ];

  function clearAccountCreationStorage() {
    ACCOUNT_CREATION_KEYS.forEach(k => localStorage.removeItem(k));
  }

  function clearAuthTokens() {
    localStorage.removeItem("authToken");
    localStorage.removeItem("refreshToken");
  }

  // ── Create Account button ──────────────────────────────────────────
  function handleCreateAccount() {
    // Wipe any leftover account-creation data from a previous attempt
    clearAccountCreationStorage();
    showLoading();
    setTimeout(() => window.location.href = "create-project-account.html", 400);
  }

  // ── Modal open/close ──────────────────────────────────────────────
  function openModal() {
    // Clear old tokens so a fresh login always starts clean
    clearAuthTokens();
    document.getElementById("loginModal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("loginModal").classList.remove("open");
    resetModal();
  }

  function resetModal() {
    document.getElementById("roleSelection").style.display = "block";
    document.getElementById("loginForm").style.display    = "none";
    document.getElementById("modalTitle").textContent     = "Select Role";
    document.getElementById("notification").style.display = "none";
    document.getElementById("message").textContent        = "";
    document.getElementById("role").value                 = "";
    document.getElementById("email").value                = "";
    document.getElementById("password").value             = "";
    selectedRole = "";
  }

  // Close modal when clicking backdrop
  document.getElementById("loginModal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  // ── Role → credentials ────────────────────────────────────────────
  function showLoginForm() {
    selectedRole = document.getElementById("role").value;
    if (!selectedRole) { alert("Please select a role first."); return; }
    document.getElementById("roleSelection").style.display = "none";
    document.getElementById("loginForm").style.display    = "block";
    document.getElementById("modalTitle").textContent     = roleMap[selectedRole] + " Login";
    document.getElementById("notification").style.display = selectedRole !== "client" ? "block" : "none";
    document.getElementById("email").focus();
  }

  // ── Login ─────────────────────────────────────────────────────────
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  async function validateLogin() {
    const emailInput = document.getElementById("email").value.trim();
    const password   = document.getElementById("password").value;
    const msgEl      = document.getElementById("message");

    if (!isValidEmail(emailInput)) { msgEl.textContent = "Invalid email format."; return; }
    if (!selectedRole)             { msgEl.textContent = "Please select a role."; return; }

    const backendRole = roleMap[selectedRole];
    const payload = backendRole === "Client"
      ? { role: backendRole, company_email: emailInput, password }
      : { role: backendRole, email: emailInput, password };

    showLoading();
    msgEl.textContent = "";

    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      hideLoading();

      if (!data.success && data.error?.includes("No password set yet")) {
        localStorage.setItem("pendingEmail", emailInput);
        localStorage.setItem("pendingRole",  backendRole);
        msgEl.textContent = "No password set yet. Redirecting…";
        showLoading();
        setTimeout(() => window.location.href = "first-login.html", 1200);
        return;
      }

      if (!data.success) { msgEl.textContent = data.error || "Login failed."; return; }

      if (data.accessToken && data.refreshToken) {
        // Store fresh tokens (old ones already cleared in openModal)
        localStorage.setItem("authToken",     data.accessToken);
        localStorage.setItem("refreshToken",  data.refreshToken);

        const decoded = parseJwt(data.accessToken);
        showLoading();
        setTimeout(() => {
          switch (decoded?.role) {
            case "Client":                      window.location.href = "client-dashboard.html"; break;
            case "Client Project Manager":      window.location.href = "client-project-manager.html"; break;
            case "Consultant":                  window.location.href = "consultant-dashboard.html"; break;
            case "Consultant Project Manager":  window.location.href = "consultant-project-manager.html"; break;
            case "Contractor":                  window.location.href = "contractor-dashboard.html"; break;
            case "Contractor Project Manager":  window.location.href = "contractor-project-manager.html"; break;
            case "Team Member":                 window.location.href = "team-members-dashboard.html"; break;
            default:
              hideLoading();
              msgEl.textContent = "Unknown role. Please contact support.";
          }
        }, 1200);
      }
    } catch (err) {
      hideLoading();
      console.error(err);
      document.getElementById("message").textContent = "Server error. Please try again.";
    }
  }

  // ── Forgot password ───────────────────────────────────────────────
  async function forgotPassword() {
    const emailInput = document.getElementById("email").value.trim();
    const msgEl      = document.getElementById("message");
    if (!isValidEmail(emailInput)) { msgEl.textContent = "Enter a valid email first."; return; }
    if (!selectedRole)             { msgEl.textContent = "Please select a role."; return; }

    const backendRole = roleMap[selectedRole];
    showLoading();
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/check-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ role: backendRole, email: emailInput })
      });
      const data = await res.json();
      hideLoading();
      if (!data.exists) { msgEl.textContent = "Email not found for this role."; return; }
      localStorage.setItem("pendingEmail", emailInput);
      localStorage.setItem("pendingRole",  backendRole);
      showLoading();
      setTimeout(() => window.location.href = "reset-password.html", 1200);
    } catch (err) {
      hideLoading();
      console.error(err);
      msgEl.textContent = "Server error. Please try again.";
    }
  }

  // ── JWT helper ────────────────────────────────────────────────────
  function parseJwt(token) {
    try {
      const b64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
      return JSON.parse(atob(b64));
    } catch { return null; }
  }

  // ── Loading bar ───────────────────────────────────────────────────
  function showLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "none";
    bar.style.width = "0";
    requestAnimationFrame(() => {
      bar.style.transition = "width 1.4s ease-in-out";
      bar.style.width = "90%";
    });
  }
  function hideLoading() {
    const bar = document.getElementById("loadingBar");
    bar.style.transition = "width 0.3s ease";
    bar.style.width = "0";
  }
</script>
</body>
</html>
