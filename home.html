<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Project App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('home-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .welcome-box {
      background-color: white;
      border-radius: 12px;
      padding: 20px 30px;
      margin-top: 8vh;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      max-width: 300px;
    }

    .welcome-box h2 {
      color: #007BFF;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .welcome-box p {
      color: #333;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .welcome-box button {
      margin: 8px 0;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #007BFF;
      color: white;
      width: 100%;
    }

    .welcome-box button:hover {
      background: #0056b3;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 360px;
      text-align: center;
    }

    select, input {
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      font-size: 14px;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 20px;
    }

    #roleSelection button, #loginForm button {
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #roleSelection button:hover, #loginForm button:hover {
      background: #0056b3;
    }

    #loginForm .actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    #loginForm a {
      font-size: 13px;
      color: #007BFF;
      text-decoration: none;
    }

    #loginForm a:hover {
      text-decoration: underline;
    }

    #message {
      color: #cc0000;
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="welcome-box">
    <h2>Welcome to the One Project App</h2>
    <p>Please choose an option below:</p>
    <button onclick="window.location.href='create-project-account.html'">Create Account</button>
    <button onclick="openModal()">Log In</button>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle">Select Role</h3>

      <div id="roleSelection">
        <select id="role">
          <option value="">-- Choose Role --</option>
          <option value="client">Client</option>
          <option value="consultant">Consultant</option>
          <option value="consultant_pm">Consultant Project Manager</option>
          <option value="contractor">Contractor</option>
          <option value="contractor_pm">Contractor Project Manager</option>
          <option value="team_member">Team Member</option>
        </select>
        <button onclick="showLoginForm()">Continue</button>
      </div>

      <div id="loginForm" style="display:none;">
        <input type="email" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <div class="actions">
          <button onclick="validateLogin()">Log In</button>
          <a href="reset-password.html">Forgot Password?</a>
        </div>
        <p id="message"></p>
      </div>
    </div>
  </div>

  <script>
    let selectedRole = "";

    function openModal() {
      document.getElementById("loginModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("loginModal").style.display = "none";
      document.getElementById("roleSelection").style.display = "block";
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("message").textContent = "";
      document.getElementById("modalTitle").textContent = "Select Role";
      document.getElementById("role").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    }

    function showLoginForm() {
      selectedRole = document.getElementById("role").value;
      if (!selectedRole) {
        alert("Please select a role.");
        return;
      }
      document.getElementById("roleSelection").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("modalTitle").textContent =
        selectedRole.replace("_", " ") + " Login";
    }

    function isValidEmail(email) {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return regex.test(email);
    }

    async function validateLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!isValidEmail(email)) {
        document.getElementById("message").textContent = "Invalid email format.";
        return;
      }
      if (!selectedRole) {
        document.getElementById("message").textContent = "Please select a role.";
        return;
      }

      try {
        const response = await fetch('https://oneprojectapp-backend.onrender.com/verify-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ role: selectedRole, email, password })
        });

        const data = await response.json();

        if (!data.success) {
          document.getElementById("message").textContent = data.error || "Login failed.";
          return;
        }

        // 🔹 Verification gate
        if (!data.verified) {
          localStorage.setItem("pendingEmail", email);
          localStorage.setItem("pendingRole", selectedRole);
          window.location.href = "pending-verification.html";
          return;
        }

        // 🔹 First login check
        if (!data.password_hash) {
          localStorage.setItem("pendingEmail", email);
          localStorage.setItem("pendingRole", selectedRole);
          window.location.href = "first-login.html";
          return;
        }

        // 🔹 Redirect by role
        switch (selectedRole) {
          case "client": window.location.href = "client-dashboard.html"; break;
          case "consultant": window.location.href = "consultant-dashboard.html"; break;
          case "consultant_pm": window.location.href = "consultant-project-manager.html"; break;
          case "contractor": window.location.href = "contractor-dashboard.html"; break;
          case "contractor_pm": window.location.href = "contractor-project-manager.html"; break;
          case "team_member": window.location.href = "sub-contractor-dashboard.html"; break;
          default: document.getElementById("message").textContent = "Unknown role.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("message").textContent = "Server error. Please try again.";
      }
    }
  </script>
</body>
</html>
