<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification Failed</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh; display: flex;
      justify-content: center; align-items: center;
    }
    #loadingBar {
      position: fixed; top: 0; left: 0;
      height: 4px; width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
    }
    .container {
      background: #fff; padding: 40px;
      border-radius: 12px; width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 { color: #cc0000; font-size: 22px; margin-bottom: 20px; }
    p { font-size: 15px; color: #333; margin-bottom: 20px; }
    button {
      background-color: #007BFF; color: white;
      border: none; padding: 12px; width: 100%;
      cursor: pointer; border-radius: 5px;
      font-size: 15px; margin-top: 10px;
    }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    #expired-msg { margin-top: 15px; font-size: 14px; color: #cc0000; }
    .back-link {
      display: block; margin-top: 15px;
      font-size: 14px; color: #007BFF;
      text-decoration: none; display: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="container">
    <h2>Verification Failed</h2>
    <p>Your verification code was invalid or expired.</p>
    <p>You may resend the verification code up to 2 times.</p>

    <button id="resendBtn" onclick="resendCode()">Resend Verification Code</button>
    <p id="expired-msg"></p>
    <a id="backLink" href="create-project-account.html" class="back-link" onclick="cleanupStorage()">← Back to Account Creation</a>
  </div>

  <script>
    let projectDetails = JSON.parse(localStorage.getItem("projectDetails") || "{}");
    let clientEmail = projectDetails.client?.company_email;
    let resendAttempts = parseInt(localStorage.getItem("resendAttempts") || "0");
    const resendBtn = document.getElementById("resendBtn");
    const expiredMsg = document.getElementById("expired-msg");
    const backLink = document.getElementById("backLink");
    const loadingBar = document.getElementById("loadingBar");

    function cleanupStorage() {
      localStorage.removeItem("projectDetails");
      localStorage.removeItem("projectAccount");
      localStorage.removeItem("resendAttempts");
    }

    function showLoading() { loadingBar.style.width = "100%"; }

    async function resendCode() {
      if (!clientEmail) {
        alert("No client email found. Please create account again.");
        cleanupStorage();
        window.location.href = "create-project-account.html";
        return;
      }

      if (resendAttempts >= 2) {
        resendBtn.disabled = true;
        expiredMsg.textContent = "Resend attempts have expired. Please start fresh.";
        backLink.style.display = "block"; // show back link
        return;
      }

      showLoading();

      try {
        const res = await fetch("https://oneprojectapp-backend.onrender.com/send-verification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: clientEmail })
        });
        const data = await res.json();

        if (data.success) {
          resendAttempts++;
          localStorage.setItem("resendAttempts", resendAttempts.toString());

          if (resendAttempts <= 2) {
            alert("Verification code resent! Redirecting to pending page...");
            loadingBar.style.width = "0"; 
            window.location.href = "pending-verification.html";
          } else {
            resendBtn.disabled = true;
            expiredMsg.textContent = "Resend attempts have expired. Please start fresh.";
            backLink.style.display = "block";
          }
        } else {
          alert(data.error || "Failed to resend code. Try again.");
          loadingBar.style.width = "0";
        }
      } catch (err) {
        console.error(err);
        alert("Server error. Please try again.");
        loadingBar.style.width = "0";
      }
    }

    window.onload = () => {
      if (resendAttempts >= 2) {
        resendBtn.disabled = true;
        expiredMsg.textContent = "Resend attempts have expired. Please start fresh.";
        backLink.style.display = "block";
      }
    };
  </script>
</body>
</html>
