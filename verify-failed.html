<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification Failed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }

    #loadingBar {
      position: fixed; top: 0; left: 0;
      height: 4px; width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
      z-index: 10;
    }

    .container {
      background: #fff; padding: 36px 28px;
      border-radius: 12px; width: 100%; max-width: 400px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    h2 { color: #cc0000; font-size: clamp(18px, 5vw, 22px); margin: 0 0 16px; }
    p  { font-size: 15px; color: #333; margin-bottom: 14px; line-height: 1.5; }

    button {
      background-color: #007BFF; color: white;
      border: none; padding: 13px; width: 100%;
      cursor: pointer; border-radius: 6px;
      font-size: 15px; margin-top: 8px;
      min-height: 48px;
    }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #999; cursor: not-allowed; }

    #expired-msg {
      margin-top: 12px; font-size: 14px;
      color: #cc0000; line-height: 1.5;
    }

    .back-link {
      display: none;
      margin-top: 14px;
      font-size: 14px; color: #007BFF;
      text-decoration: none;
      padding: 8px; min-height: 44px;
      line-height: 28px;
    }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 400px) {
      body { align-items: flex-start; padding-top: 32px; }
      .container { padding: 24px 16px; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <div id="loadingBar"></div>

  <div class="container">
    <h2>Verification Failed</h2>
    <p>Your verification code was invalid or expired.</p>
    <p>You may resend the verification code up to 2 times.</p>

    <button id="resendBtn" onclick="resendCode()">Resend Verification Code</button>
    <p id="expired-msg"></p>
    <a id="backLink" href="dashboard.html" class="back-link" onclick="cleanupStorage()">&#8592; Back to Dashboard</a>
  </div>

<script>
  let projectDetails  = JSON.parse(localStorage.getItem("projectDetails") || "{}");
  let clientEmail     = projectDetails.client?.company_email;
  let resendAttempts  = parseInt(localStorage.getItem("resendAttempts") || "0");

  const resendBtn  = document.getElementById("resendBtn");
  const expiredMsg = document.getElementById("expired-msg");
  const backLink   = document.getElementById("backLink");
  const loadingBar = document.getElementById("loadingBar");

  function cleanupStorage() {
    localStorage.removeItem("projectDetails");
    localStorage.removeItem("projectAccount");
    localStorage.removeItem("resendAttempts");
    localStorage.removeItem("sessionId");
  }

  function showLoading() {
    loadingBar.style.transition = "width 1.5s ease-in-out";
    loadingBar.style.width = "100%";
  }
  function resetLoading() {
    loadingBar.style.transition = "width 0.8s ease-in-out";
    loadingBar.style.width = "0";
  }

  async function resendCode() {
    if (!clientEmail) {
      alert("No client email found. Please create account again.");
      cleanupStorage();
      window.location.replace("dashboard.html");
      return;
    }
    if (resendAttempts >= 2) {
      resendBtn.disabled = true;
      expiredMsg.textContent = "Resend attempts have expired. Please start fresh.";
      backLink.style.display = "block";
      return;
    }

    showLoading();
    try {
      const res  = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: clientEmail })
      });
      const data = await res.json();

      if (data.success) {
        resendAttempts++;
        localStorage.setItem("resendAttempts", resendAttempts.toString());
        if (data.sessionId) localStorage.setItem("sessionId", data.sessionId);
        resetLoading();
        window.location.replace("dashboard.html");
      } else {
        alert(data.error || "Failed to resend code. Try again.");
        resetLoading();
      }
    } catch {
      alert("Server error. Please try again.");
      resetLoading();
    }
  }

  window.onload = () => {
    if (resendAttempts >= 2) {
      resendBtn.disabled = true;
      expiredMsg.textContent = "Resend attempts have expired. Please start fresh.";
      backLink.style.display = "block";
    }
  };
</script>
</body>
</html>
