<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification Failed</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Loading bar at top */
    #loadingBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background-color: #007BFF;
      transition: width 1.5s ease-in-out;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 {
      color: #cc0000;
      font-size: 22px;
      margin-bottom: 20px;
    }
    p {
      font-size: 15px;
      color: #333;
      margin-bottom: 20px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    .back-link {
      display: block;
      margin-top: 15px;
      font-size: 14px;
      color: #007BFF;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    #expired-msg {
      margin-top: 15px;
      font-size: 14px;
      color: #cc0000;
    }
  </style>
</head>
<body>
  <!-- Loading bar -->
  <div id="loadingBar"></div>

  <div class="container">
    <h2>Verification Failed</h2>
    <p>Your verification link or code was invalid or expired.</p>
    <p>You may resend the verification code up to 2 times.</p>

    <button id="resendBtn" onclick="resendLink()">Resend Verification Code</button>
    <p id="expired-msg"></p>
    <a href="create-project-account.html" class="back-link">← Back to Account Creation</a>
  </div>

  <script>
    let account = JSON.parse(localStorage.getItem("projectAccount") || "{}");
    let resendAttempts = parseInt(localStorage.getItem("resendAttempts") || "0");
    const resendBtn = document.getElementById("resendBtn");
    const expiredMsg = document.getElementById("expired-msg");
    const loadingBar = document.getElementById("loadingBar");

    function updateResendState() {
      if (resendAttempts >= 2) {
        resendBtn.disabled = true;
        expiredMsg.textContent = "Resend attempts have expired. Please go back and create a new account.";
      }
    }

    function showLoading() {
      loadingBar.style.width = "100%";
    }

    async function resendLink() {
      if (!account || !account.company_email) {
        alert("No account email found. Please go back and create an account.");
        return;
      }

      showLoading();

      try {
        const res = await fetch("https://oneprojectapp-backend.onrender.com/resend-verification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: account.company_email })
        });
        const data = await res.json();

        if (data.success) {
          resendAttempts++;
          localStorage.setItem("resendAttempts", resendAttempts.toString());

          if (data.sessionId) {
            account.sessionId = data.sessionId;
            localStorage.setItem("projectAccount", JSON.stringify(account));
          }

          if (resendAttempts <= 2) {
            alert("Verification code resent! Redirecting to pending page...");
            window.location.href = "pending-verification.html"; // fresh 2:59 countdown
          } else {
            updateResendState();
          }
        } else {
          alert(data.error || "Failed to resend code. Try again.");
          loadingBar.style.width = "0";
        }
      } catch (err) {
        console.error(err);
        alert("Server error. Please try again.");
        loadingBar.style.width = "0";
      }
    }

    window.onload = updateResendState;
  </script>
</body>
</html>
