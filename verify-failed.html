<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Verification Failed</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('account-background.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }
    h2 {
      color: #cc0000;
      font-size: 22px;
      margin-bottom: 20px;
    }
    p {
      font-size: 15px;
      color: #333;
      margin-bottom: 20px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 15px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Verification Failed</h2>
    <p>Sorry, your verification link is invalid or has expired.</p>
    <p>Please go back and request a new link to continue.</p>

    <!-- Retry button -->
    <button onclick="goBack()">Back to Account Creation</button>
  </div>

  <script>
    function goBack() {
      // Clear any stale verification state
      let account = JSON.parse(localStorage.getItem("projectAccount") || "{}");
      account.verified = false;
      localStorage.setItem("projectAccount", JSON.stringify(account));
      window.location.href = "create-project-account.html";
    }
  </script>
</body>
</html>
